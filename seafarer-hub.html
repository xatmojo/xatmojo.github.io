.btn[disabled]{opacity:.55;cursor:not-allowed}

/* ========== DASHBOARD ========== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);
  transition:transform var(--transition),box-shadow var(--transition);
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-icon{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  margin-bottom:10px;background:var(--gold-soft);color:var(--gold);
}
.stat-icon.navy{background:color-mix(in srgb,var(--navy) 12%,transparent);color:var(--navy)}
.stat-icon.green{background:var(--success-soft);color:var(--success)}
.stat-icon.blue{background:var(--info-soft);color:var(--info)}
.stat-value{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.stat-label{font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:2px}

.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.quick-btn{
  display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  padding:16px;border-radius:var(--radius);background:var(--surface);
  border:1px solid var(--border);transition:all var(--transition);text-align:left;
}
.quick-btn:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow)}
.quick-btn svg{color:var(--gold)}
.quick-btn span{font-size:12.5px;font-weight:600;color:var(--text)}

.progress-wrap{margin-top:8px}
.progress-bar{height:8px;background:var(--surface-3);border-radius:10px;overflow:hidden}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));
  border-radius:10px;transition:width .5s ease;
}
.progress-text{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:6px}

.tips-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.tip-item{display:flex;gap:10px;font-size:12.5px;color:var(--text-2);line-height:1.5}
.tip-item svg{color:var(--success);flex-shrink:0;margin-top:2px}

/* ========== GENERATOR ========== */
.gen-card{
  background:linear-gradient(135deg,color-mix(in srgb,var(--navy) 96%,transparent),var(--navy-2));
  color:#fff;border-radius:var(--radius-lg);padding:22px;margin-bottom:18px;
  position:relative;overflow:hidden;box-shadow:var(--shadow);
}
.gen-card::after{
  content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;
  background:radial-gradient(circle,rgba(201,162,39,.35),transparent 70%);border-radius:50%;
}
.gen-card h3{margin:0 0 4px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.gen-card h3 svg{color:var(--gold-2)}
.gen-card p{margin:0 0 16px;font-size:12.5px;color:rgba(232,238,251,.75);position:relative;z-index:1;line-height:1.5}
.gen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1}
.gen-grid .field label{color:rgba(232,238,251,.85)}
.gen-grid .field select{
  background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff;
  backdrop-filter:blur(8px);
}
.gen-grid .field select:focus{border-color:var(--gold);background:rgba(255,255,255,.18)}
.gen-grid .field select option{color:var(--navy);background:#fff}
.gen-action{grid-column:1/-1;margin-top:4px}
.gen-action .btn{width:100%;padding:12px}
.gen-note{
  font-size:11px;color:rgba(232,238,251,.6);margin-top:12px;
  position:relative;z-index:1;display:flex;gap:6px;align-items:flex-start;line-height:1.45;
}
.gen-note svg{flex-shrink:0;margin-top:1px}

/* ========== TEMPLATE CARDS ========== */
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tpl-card{
  border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;
  background:var(--surface);transition:all var(--transition);text-align:left;
  padding:0;position:relative;
}
.tpl-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow)}
.tpl-card.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.2)}
.tpl-card.active::after{
  content:"✓";position:absolute;top:8px;right:8px;width:22px;height:22px;
  background:var(--gold);color:var(--navy);border-radius:50%;display:grid;
  place-items:center;font-size:12px;font-weight:800;
}
.tpl-preview{
  height:88px;background:var(--surface-2);padding:10px;display:flex;
  flex-direction:column;gap:3px;border-bottom:1px solid var(--border);
}
.tpl-preview .ln{height:3px;border-radius:2px;background:var(--border-2)}
.tpl-preview .ln.title{height:6px;width:55%;background:var(--navy);margin-bottom:3px}
.tpl-preview .ln.short{width:40%}
.tpl-preview .ln.medium{width:75%}
.tpl-card[data-tpl="modern-corporate"] .tpl-preview .ln.title{background:var(--navy)}
.tpl-card[data-tpl="elegant-navy"] .tpl-preview{background:linear-gradient(180deg,var(--navy) 40%,var(--surface-2) 40%)}
.tpl-card[data-tpl="elegant-navy"] .tpl-preview .ln.title{background:var(--gold);width:60%}
.tpl-card[data-tpl="executive"] .tpl-preview .ln.title{background:var(--gold);width:65%}
.tpl-card[data-tpl="minimalist"] .tpl-preview{background:#fff}
.tpl-card[data-tpl="fresh-graduate"] .tpl-preview .ln.title{background:#0d9488}
.tpl-meta{padding:10px 12px}
.tpl-name{font-size:12px;font-weight:700;margin:0 0 2px;color:var(--text)}
.tpl-desc{font-size:10.5px;color:var(--text-3);font-weight:500;line-height:1.3}

/* ========== STYLE CONTROLS ========== */
.style-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.range-field{display:flex;flex-direction:column;gap:6px}
.range-field .range-head{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--text-2)}
.range-field .range-val{color:var(--gold);font-weight:700}
.range-field input[type=range]{
  width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:8px;
  background:var(--surface-3);outline:none;
}
.range-field input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--gold);cursor:pointer;border:3px solid var(--surface);
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
.range-field input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:var(--gold);
  cursor:pointer;border:3px solid var(--surface);
}
.color-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.color-dot{
  width:28px;height:28px;border-radius:50%;border:2px solid var(--border);
  cursor:pointer;transition:transform var(--transition);
}
.color-dot:hover{transform:scale(1.12)}
.color-dot.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.25)}

/* ========== LETTER EDITOR ========== */
.letter-fields{display:flex;flex-direction:column;gap:14px}
.letter-field{display:flex;flex-direction:column;gap:5px}
.letter-field label{font-size:11.5px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
.letter-field label .lbl-hint{font-size:10px;font-weight:500;color:var(--text-3);text-transform:none;letter-spacing:0}
.letter-field textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;
  background:var(--surface-2);color:var(--text);font-size:13px;line-height:1.55;
  resize:vertical;min-height:70px;font-weight:500;transition:all var(--transition);
}
.letter-field textarea:hover{border-color:var(--border-2)}
.letter-field textarea:focus{outline:none;border-color:var(--gold);background:var(--surface);box-shadow:0 0 0 3px rgba(201,162,39,.15)}
.letter-field input{
  width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;
  background:var(--surface-2);font-size:13px;font-weight:600;transition:all var(--transition);
}
.letter-field input:focus{outline:none;border-color:var(--gold);background:var(--surface);box-shadow:0 0 0 3px rgba(201,162,39,.15)}

/* ========== PREVIEW ========== */
.preview-toolbar{
  display:flex;align-items:center;gap:8px;padding:10px 16px;
  border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;
}
.preview-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  color:var(--success);background:var(--success-soft);padding:4px 10px;border-radius:20px;
}
.preview-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.preview-toolbar-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.pt-btn{
  display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;
  font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--text-2);
  transition:all var(--transition);border:1px solid var(--border);
}
.pt-btn:hover{background:var(--surface-3);color:var(--text);border-color:var(--border-2)}
.pt-btn svg{width:14px;height:14px}
.preview-scroll{
  flex:1;overflow-y:auto;padding:22px;display:flex;justify-content:center;
  background:
    radial-gradient(circle at 20% 10%,rgba(201,162,39,.06),transparent 40%),
    radial-gradient(circle at 80% 90%,rgba(37,74,140,.06),transparent 40%),
    var(--surface-2);
}
.zoom-wrap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);font-weight:600}

/* PAPER */
.paper{
  width:210mm;max-width:100%;min-height:297mm;background:#fff;color:#1a1a1a;
  padding:var(--paper-margin,20mm);
  font-family:var(--paper-font,'Times New Roman',Times,serif);
  font-size:var(--paper-size,12pt);
  line-height:var(--paper-line-height,1.6);
  color:var(--paper-color,#1a1a1a);
  box-shadow:0 10px 40px rgba(15,27,46,.18);
  position:relative;transition:box-shadow var(--transition);
  transform-origin:top center;
}
[data-theme="dark"] .paper{box-shadow:0 10px 40px rgba(0,0,0,.7)}
.paper-header{margin-bottom:18px}
.paper-name{font-size:1.9em;font-weight:700;margin:0 0 4px;letter-spacing:-.01em;line-height:1.15}
.paper-contact{font-size:.85em;color:#555;line-height:1.5}
.paper-date{text-align:right;margin-bottom:16px;font-size:.95em}
.paper-body p{margin:0 0 1em;text-align:justify;white-space:pre-wrap;word-wrap:break-word;outline:none;padding:2px;border-radius:3px;transition:background .15s}
.paper-body p:focus{background:rgba(201,162,39,.08)}
.paper-body .salutation{margin-bottom:1.2em}
.paper-body .recipient{margin-bottom:1.2em;line-height:1.5;white-space:normal}
.paper-body .recipient .recipient-name{font-weight:600}
.recipient-line{white-space:normal !important;text-align:left !important}
.paper-body .signature{margin-top:2.4em;page-break-inside:avoid;width:fit-content;min-width:55mm;max-width:100%;margin-left:auto;text-align:center}
.paper-body .signature .closing-salutation{margin-bottom:0;text-align:center;white-space:normal}
.paper-body .signature-space{height:64px;display:flex;align-items:center;justify-content:center}
.paper-body .signature-space.has-img{height:auto;min-height:64px;padding:6px 0}
.paper-body .signature-img{max-height:22mm;max-width:55mm;width:auto;height:auto;display:block;object-fit:contain}
.paper-body .signature-line{width:60mm;max-width:100%;border-top:1px solid #333;margin:0 auto 4px}
.paper-body .signature-name{font-weight:600;margin:0;text-align:center;white-space:normal}

/* TEMPLATE: classic-formal */
.template-classic-formal{--paper-font:'Times New Roman',Times,serif;--paper-size:12pt;--paper-line-height:1.65}
.template-classic-formal .paper-date{text-align:right}

/* TEMPLATE: modern-corporate */
.template-modern-corporate{--paper-font:Arial,Helvetica,sans-serif;--paper-size:11pt;--paper-line-height:1.6}
.template-modern-corporate .paper-header{border-bottom:3px solid #0f2147;padding-bottom:14px}
.template-modern-corporate .paper-name{color:#0f2147;font-size:1.7em;text-transform:uppercase;letter-spacing:.05em}
.template-modern-corporate .paper-contact{color:#6b7280;font-size:.8em}
.template-modern-corporate .paper-date{text-align:right;color:#6b7280}
.template-modern-corporate .signature-name{color:#0f2147}

/* TEMPLATE: minimalist */
.template-minimalist{--paper-font:Arial,Helvetica,sans-serif;--paper-size:11pt;--paper-line-height:1.75;--paper-margin:22mm}
.template-minimalist .paper-date{text-align:left;color:#888;font-size:.9em;margin-bottom:22px}
.template-minimalist .paper-body p{margin-bottom:1.1em}

/* TEMPLATE: elegant-navy */
.template-elegant-navy{--paper-font:Georgia,'Times New Roman',serif;--paper-size:11.5pt;--paper-line-height:1.7}
.template-elegant-navy .paper-header{
  background:#0f2147;color:#fff;margin:calc(-1 * var(--paper-margin,20mm)) calc(-1 * var(--paper-margin,20mm)) 22px;
  padding:22px var(--paper-margin,20mm);
}
.template-elegant-navy .paper-name{color:#fff;font-size:1.8em;font-weight:600}
.template-elegant-navy .paper-contact{color:rgba(255,255,255,.75)}
.template-elegant-navy .paper-date{text-align:left;color:#c9a227;font-weight:600;margin-bottom:18px}
.template-elegant-navy .signature-name{color:#0f2147}
.template-elegant-navy .paper-body .signature-line{border-top-color:#c9a227}

/* TEMPLATE: executive */
.template-executive{--paper-font:'Playfair Display',Georgia,serif;--paper-size:11.5pt;--paper-line-height:1.7}
.template-executive .paper-header{border-bottom:2px solid #c9a227;padding-bottom:12px;margin-bottom:20px}
.template-executive .paper-name{font-size:2em;color:#0f2147;font-weight:700;letter-spacing:-.02em}
.template-executive .paper-contact{color:#6b7280;font-size:.85em;letter-spacing:.03em}
.template-executive .paper-date{text-align:right;font-family:'Inter',sans-serif;font-size:.85em;color:#6b7280;letter-spacing:.04em;text-transform:uppercase}
.template-executive .paper-body{font-family:'Inter',sans-serif;font-size:.92em;line-height:1.75}
.template-executive .paper-body .signature-name{color:#0f2147;font-weight:700}

/* TEMPLATE: fresh-graduate */
.template-fresh-graduate{--paper-font:Arial,Helvetica,sans-serif;--paper-size:11pt;--paper-line-height:1.65}
.template-fresh-graduate .paper-header{
  border-left:5px solid #0d9488;padding:0 0 0 14px;margin-bottom:18px;
}
.template-fresh-graduate .paper-name{color:#0f766e;font-size:1.6em;font-weight:700}
.template-fresh-graduate .paper-contact{color:#64748b}
.template-fresh-graduate .paper-date{text-align:right;color:#64748b}
.template-fresh-graduate .signature-name{color:#0f766e;font-weight:700}

/* TEMPLATE: international */
.template-international{--paper-font:'Times New Roman',Times,serif;--paper-size:12pt;--paper-line-height:1.6}
.template-international .paper-date{text-align:left;margin-bottom:20px}
.template-international .paper-body p{margin-bottom:.95em}
.template-international .signature-name{font-weight:600}


/* ========== SIGNATURE PAD & DATE FIELD ========== */
.sig-pad-wrap{border:1.5px dashed var(--border-2);border-radius:var(--radius-sm);background:#fff;position:relative;overflow:hidden;touch-action:none}
.sig-pad-wrap canvas{display:block;width:100%;height:160px;cursor:crosshair;touch-action:none}
.sig-pad-hint{position:absolute;inset:0;display:grid;place-items:center;color:#9aa6b8;font-size:12.5px;pointer-events:none;transition:opacity .15s}
.sig-pad-wrap.drawn .sig-pad-hint{opacity:0}
.sig-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sig-current{display:none;margin-top:12px;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2)}
.sig-current.show{display:flex}
.sig-current img{height:44px;max-width:140px;object-fit:contain;background:#fff;border-radius:6px;border:1px solid var(--border);padding:2px}
.sig-current span{font-size:12px;color:var(--text-2);flex:1}
.date-field{position:relative;display:flex;align-items:center}
.date-field .date-text{width:100%;padding-right:42px}
.date-field .date-pick{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-2)}
.date-field .date-pick:hover{background:var(--surface-3);color:var(--text)}
.date-field .date-native{position:absolute;right:4px;top:0;width:32px;height:100%;opacity:0;pointer-events:none;border:0;padding:0}

/* ========== ARSIP ========== */
.search-bar{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:12px;padding:0 14px;margin-bottom:16px;
  transition:border var(--transition);
}
.search-bar:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.12)}
.search-bar svg{color:var(--text-3);width:18px;height:18px}
.search-bar input{flex:1;border:none;background:none;padding:12px 0;font-size:13.5px;outline:none;font-weight:500}
.letter-list{display:flex;flex-direction:column;gap:10px}
.letter-item{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;display:flex;align-items:center;gap:14px;transition:all var(--transition);
}
.letter-item:hover{border-color:var(--gold);box-shadow:var(--shadow-sm)}
.letter-icon{
  width:42px;height:42px;border-radius:10px;background:var(--gold-soft);color:var(--gold);
  display:grid;place-items:center;flex-shrink:0;
}
.letter-info{flex:1;min-width:0}
.letter-info h4{margin:0 0 2px;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.letter-info p{margin:0;font-size:11.5px;color:var(--text-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.letter-actions{display:flex;gap:4px;flex-shrink:0}
.letter-actions button{
  width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  color:var(--text-3);background:var(--surface-2);transition:all var(--transition);
}
.letter-actions button:hover{background:var(--surface-3);color:var(--text)}
.letter-actions button.del:hover{background:var(--danger-soft);color:var(--danger)}
.empty-state{
  text-align:center;padding:40px 20px;color:var(--text-3);
}
.empty-state svg{margin:0 auto 12px;color:var(--text-3);opacity:.5}
.empty-state h4{margin:0 0 4px;color:var(--text-2);font-size:14px}
.empty-state p{margin:0;font-size:12.5px}

/* ========== SETTINGS ========== */
.settings-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 0;border-bottom:1px solid var(--border);
}
.settings-row:last-child{border-bottom:none}
.settings-row .sr-info{min-width:0}
.settings-row .sr-title{font-size:13px;font-weight:600;margin:0 0 2px}
.settings-row .sr-desc{font-size:11.5px;color:var(--text-3);margin:0;font-weight:500}
.switch{
  position:relative;width:44px;height:24px;background:var(--surface-3);border-radius:20px;
  cursor:pointer;transition:background var(--transition);flex-shrink:0;border:none;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;
  background:#fff;border-radius:50%;transition:transform var(--transition);
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.switch.on{background:var(--gold)}
.switch.on::after{transform:translateX(20px)}
.theme-pills{display:flex;gap:8px;flex-shrink:0}
.theme-pill{
  padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;
  background:var(--surface-2);border:1.5px solid var(--border);color:var(--text-2);
  transition:all var(--transition);
}
.theme-pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ========== MODAL ========== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(5,10,20,.6);backdrop-filter:blur(4px);
  z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .2s ease;
}
.modal-overlay.show{display:flex}
.modal{
  background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:440px;
  padding:26px;box-shadow:var(--shadow-lg);animation:modalIn .25s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.modal-icon{
  width:48px;height:48px;border-radius:12px;display:grid;place-items:center;
  margin-bottom:14px;background:var(--warning-soft);color:var(--warning);
}
.modal-icon.danger{background:var(--danger-soft);color:var(--danger)}
.modal h3{margin:0 0 6px;font-size:17px;font-weight:700}
.modal p{margin:0 0 18px;font-size:13px;color:var(--text-2);line-height:1.55}
.modal .field{margin-bottom:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}

/* ========== PRINT PREVIEW MODAL ========== */
.print-modal{
  position:fixed;inset:0;z-index:150;background:#4a5568;
  display:none;flex-direction:column;
}
.print-modal.show{display:flex;animation:fadeIn .2s ease}
.print-modal-head{
  display:flex;align-items:center;gap:16px;padding:12px 20px;
  background:var(--navy);color:#fff;
  box-shadow:0 4px 20px rgba(0,0,0,.25);position:relative;z-index:2;
  flex-wrap:nowrap;
}
.print-modal-title{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.print-modal-title > svg{color:var(--gold-2);flex-shrink:0}
.print-modal-title h3{margin:0;font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.print-modal-title p{margin:2px 0 0;font-size:11px;color:rgba(232,238,251,.7);font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.print-modal-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* Tombol Aksi Modal Cetak */
.print-modal-actions .btn{
  display:inline-flex;align-items:center;justify-content:center;
  height:38px;padding:0 14px;border-radius:10px;
  font-size:12px;font-weight:600;transition:all var(--transition);
  white-space:nowrap;gap:6px;
}
.print-modal-actions .btn-close{
  background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.18);
}
.print-modal-actions .btn-close:hover{background:rgba(255,255,255,.22);color:#fff}
.print-modal-actions .btn svg{width:16px;height:16px;flex-shrink:0}

.print-modal-body{
  flex:1;overflow:auto;padding:30px 20px;
  display:flex;justify-content:center;align-items:flex-start;
  background:
    radial-gradient(circle at 15% 10%,rgba(201,162,39,.10),transparent 40%),
    radial-gradient(circle at 85% 90%,rgba(37,74,140,.18),transparent 45%),
    #4a5568;
  position:relative;
}
.print-modal-body::-webkit-scrollbar-thumb{background:#718096;border:2px solid #4a5568}
.print-modal-body .paper{
  flex-shrink:0;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.print-modal-tip{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  background:rgba(15,33,71,.92);color:#fff;padding:8px 16px;border-radius:20px;
  font-size:11.5px;font-weight:500;white-space:nowrap;backdrop-filter:blur(8px);
  box-shadow:0 8px 20px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;
  pointer-events:none;
}
.print-modal-tip svg{color:var(--gold-2)}

/* Responsive Print Modal */
@media(max-width:640px){
  .print-modal-head{padding:12px 16px;gap:10px}
  .print-modal-title p{display:none}
  .print-modal-title h3{font-size:14px}
  
  .print-modal-actions .btn{
    width:36px;height:36px;padding:0;border-radius:8px;
  }
  .print-modal-actions .btn .btn-label{display:none}
  .print-modal-actions .btn svg{margin-right:0;width:18px;height:18px}
  
  .print-modal-body{padding:14px 8px}
  .print-modal-body .paper{min-height:auto;padding:14mm 10mm}
  .print-modal-tip{display:none}
}

/* ========== TOAST ========== */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--text);
  padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;
  border-left:4px solid var(--info);min-width:240px;max-width:90vw;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);pointer-events:auto;
}
.toast.success{border-color:var(--success)}
.toast.success svg{color:var(--success)}
.toast.error{border-color:var(--danger)}
.toast.error svg{color:var(--danger)}
.toast.warning{border-color:var(--warning)}
.toast.warning svg{color:var(--warning)}
.toast svg{flex-shrink:0}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}

/* ========== BACK TO TOP ========== */
.back-top{
  position:fixed;bottom:20px;left:20px;z-index:45;width:42px;height:42px;
  border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;
  box-shadow:var(--shadow);opacity:0;visibility:hidden;transition:all var(--transition);
}
.back-top.show{opacity:1;visibility:visible}
.back-top:hover{background:var(--navy-2);transform:translateY(-2px)}

/* ========== MOBILE PREVIEW TOGGLE ========== */
.mobile-preview-toggle{display:none}
.mobile-preview-overlay{
  position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;
}
.mobile-preview-overlay.show{display:flex}
.mobile-preview-head{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:var(--surface);border-bottom:1px solid var(--border);
}
.mobile-preview-head h3{margin:0;font-size:14px;font-weight:700;flex:1}
.mobile-preview-body{flex:1;overflow-y:auto;padding:16px;display:flex;justify-content:center}

/* ========== RESPONSIVE ========== */
@media(max-width:1180px){
  .content{grid-template-columns:1fr}
  .preview-panel{display:none}
  .editor-panel{border-right:none;max-height:none;padding-bottom:60px}
  .mobile-preview-toggle{display:grid}
}
@media(max-width:900px){
  :root{--sidebar-w:260px}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .menu-toggle{display:grid}
  .editor-panel{padding:18px 16px 60px}
  .form-grid{grid-template-columns:1fr}
  .gen-grid{grid-template-columns:1fr}
  .style-grid{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .section-head h2{font-size:19px}
  .toast-container{left:12px;right:12px;bottom:12px}
  .toast{min-width:0;width:100%}
}
@media(max-width:520px){
  .topbar{padding:0 12px;gap:8px}
  .topbar-title h1{font-size:14px}
  .topbar-title p{font-size:10.5px}
  .card{padding:16px}
  .paper{padding:14mm 12mm;min-height:auto}
  .preview-toolbar{padding:8px 10px}
  .pt-btn span{display:none}
  .pt-btn{padding:8px}
  .modal{padding:20px}
  .back-top{bottom:12px;left:12px}
  .quick-grid{grid-template-columns:1fr 1fr}
}


/* ========== PREVIEW: FIT-TO-PANEL ========== */
.fit-host{max-width:100%;margin:0 auto;position:relative}
.fit-host.flow{width:100%}
.fit-host.flow .paper{margin:0 auto}
@media screen{ .fit-host.flow .paper{--paper-size:10pt} }
.preview-scroll{display:block;padding:26px 22px 48px}
.preview-meta{font-size:11px;font-weight:600;color:var(--text-3);white-space:nowrap}
.zoom-wrap{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border)}
.zoom-wrap .zbtn{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--text-2);line-height:1}
.zoom-wrap .zbtn:hover{background:var(--surface-3);color:var(--text)}
.zoom-wrap .zfit{width:auto;padding:0 8px;font-size:11px;font-weight:700}
.zoom-wrap .zlabel{min-width:42px;text-align:center;font-size:11px;font-weight:700;color:var(--text)}
.pt-btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.pt-btn.primary:hover{background:var(--navy-2);color:#fff;border-color:var(--navy-2)}
[data-theme="dark"] .pt-btn.primary{background:var(--gold);color:var(--navy);border-color:var(--gold)}
[data-theme="dark"] .pt-btn.primary:hover{background:var(--gold-2);color:var(--navy)}

/* ========== DROPDOWN UNDUH ========== */
.dl-wrap{position:relative;display:inline-flex}
.dl-menu{
  position:absolute;top:calc(100% + 8px);right:0;min-width:230px;z-index:120;
  background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow-lg);padding:6px;display:none;
}
.dl-wrap.open .dl-menu{display:block;animation:fadeIn .15s ease}
.dl-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;
  font-size:12.5px;font-weight:600;text-align:left;color:var(--text);
}
.dl-item:hover{background:var(--surface-2)}
.dl-item svg{width:16px;height:16px;color:var(--text-3)}
.dl-item small{display:block;font-size:10.5px;font-weight:500;color:var(--text-3);margin-top:1px}
.dl-sep{height:1px;background:var(--border);margin:5px 4px}
.print-modal-actions .dl-wrap .btn{height:38px}
.print-modal-actions .btn-gold{padding:0 18px}

/* ========== DESKTOP: LAYOUT LEBIH LEGA ========== */
@media(min-width:1181px){
  .content{grid-template-columns:minmax(400px,540px) minmax(0,1fr)}
  .preview-panel{background:
    radial-gradient(circle at 20% 0%,rgba(201,162,39,.07),transparent 45%),
    var(--surface-2)}
}
/* Layar menengah (mis. mode desktop di HP / laptop kecil): sidebar jadi rel ikon */
@media(min-width:901px) and (max-width:1360px){
  :root{--sidebar-w:76px}
  .sidebar{overflow:hidden;transition:width var(--transition),box-shadow var(--transition)}
  .sidebar:hover{width:264px;box-shadow:12px 0 40px rgba(5,10,20,.35)}
  .sidebar:not(:hover) .brand{padding:18px 17px;justify-content:center}
  .sidebar:not(:hover) .brand-text,.sidebar:not(:hover) .side-ver{display:none}
  .sidebar:not(:hover) .nav-label{font-size:0;height:1px;padding:0;margin:12px 10px;background:rgba(255,255,255,.08)}
  .sidebar:not(:hover) .nav-item,.sidebar:not(:hover) .sidebar-foot-btn{font-size:0;gap:0;justify-content:center;padding:12px 0}
  .sidebar:not(:hover) .nav-item .nav-badge{position:absolute;top:6px;right:14px;width:8px;min-width:8px;height:8px;padding:0;font-size:0}
  .sidebar:not(:hover) .nav-item.active::before{left:-12px}
  .sidebar-nav{padding:12px}
  .editor-panel{padding:24px 22px 80px}
}

/* ========== MOBILE: LIVE PREVIEW DOCK ========== */
.mobile-dock{display:none}
@media(max-width:1180px){
  body.has-dock .mobile-dock{display:block}
  .mobile-dock{
    position:fixed;left:0;right:0;bottom:0;z-index:48;background:var(--surface);
    border-radius:18px 18px 0 0;border-top:1px solid var(--border);
    box-shadow:0 -10px 30px rgba(15,27,46,.16);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .dock-handle{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px 12px;position:relative}
  .dock-grip{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:4px;background:var(--border-2)}
  .dock-meta{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--text-3)}
  .dock-chev{display:grid;place-items:center;color:var(--text-2);transition:transform var(--transition)}
  .mobile-dock.open .dock-chev{transform:rotate(180deg)}
  .dock-panel{display:none;flex-direction:column;height:min(54vh,540px);border-top:1px solid var(--border)}
  .mobile-dock.open .dock-panel{display:flex}
  .dock-body{flex:1;overflow:auto;padding:12px;background:var(--surface-2);overscroll-behavior:contain}
  .dock-body .paper{min-height:auto}
  .dock-actions{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--surface)}
  .dock-actions .pt-btn{flex:1;justify-content:center;padding:9px 10px}
  .dock-actions .pt-btn span{display:inline !important}
  body.has-dock .editor-panel{padding-bottom:96px}
  body.has-dock.dock-open .editor-panel{padding-bottom:calc(min(54vh,540px) + 130px)}
  body.has-dock .back-top{bottom:74px}
  body.has-dock.dock-open .back-top{display:none}
}

/* ========== PRINT ========== */
@media print{
  @page{size:A4;margin:20mm 18mm}
  html,body{
    background:#fff !important;margin:0 !important;padding:0 !important;
    overflow:visible !important;
  }
  body{font-size:12pt}

  /* Default: hide UI, keep live preview paper */
  .sidebar,.sidebar-scrim,.topbar,.editor-panel,.preview-toolbar,
  .toast-container,.back-top,.mobile-preview-overlay,.modal-overlay,.menu-toggle,
  .mobile-preview-toggle,.preview-badge,.preview-toolbar-actions,
  .print-modal-head,.print-modal-actions,.print-modal-tip,.mobile-dock,.dl-menu{display:none !important}
  .fit-host{width:auto !important;height:auto !important;max-width:none !important;margin:0 !important}

  /* When printing FROM the print preview modal */
  body.print-from-modal > *:not(#printModal){display:none !important}
  body.print-from-modal #printModal{
    display:block !important;position:static !important;inset:auto !important;
    background:#fff !important;
  }
  body.print-from-modal .print-modal-body{
    display:block !important;padding:0 !important;overflow:visible !important;
    background:#fff !important;position:static !important;
  }
  body.print-from-modal .print-modal-body .paper{
    width:100% !important;max-width:none !important;min-height:auto !important;
    box-shadow:none !important;margin:0 !important;padding:0 !important;
    transform:none !important;border:none !important;
  }

  /* Legacy: printing from live preview panel */
  body:not(.print-from-modal) .app,
  body:not(.print-from-modal) .main,
  body:not(.print-from-modal) .content{
    display:block !important;margin:0 !important;padding:0 !important;max-height:none !important;
  }
  body:not(.print-from-modal) .preview-panel{
    display:block !important;position:static !important;max-height:none !important;
    background:#fff !important;
  }
  body:not(.print-from-modal) .preview-scroll{
    display:block !important;overflow:visible !important;padding:0 !important;
    background:#fff !important;
  }
  body:not(.print-from-modal) .paper{
    width:100% !important;max-width:none !important;min-height:auto !important;
    box-shadow:none !important;margin:0 !important;padding:0 !important;
    transform:none !important;border:none !important;
  }

  /* Content flow rules */
  .paper-header{margin-bottom:16px}
  .paper-body p{page-break-inside:avoid;orphans:2;widows:2}
  .paper-body .signature{page-break-inside:avoid}
  .paper-body p:focus{background:transparent !important}
  .paper-body p{padding:0 !important}
  .template-elegant-navy .paper-header{
    margin:0 0 20px !important;padding:20px !important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
}

}
function hydrateIcons(root=document){
  root.querySelectorAll('[data-icon]').forEach(el => {
    const name = el.getAttribute('data-icon');
    const size = el.closest('.nav-item') ? 18 : (el.closest('.quick-btn') ? 20 : (el.closest('.stat-icon') ? 20 : 18));

/* ---------- UTILITIES ---------- */
const $ = (s, r=document) => r.querySelector(s);

const esc = (s) => (s==null?'':String(s)).replace(/[&>"']/g, c => ({'&':'&amp;','':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'l_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
function debounce(fn, ms=200){ let t; return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args), ms); }; }
function formatDateID(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return dateStr;
  const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}
function formatDateEN(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return dateStr;
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}
function formatDate(dateStr, lang){
  return lang === 'en' ? formatDateEN(dateStr) : formatDateID(dateStr);
}

/* ---------- PERSISTENCE ---------- */
function saveCurrent(){
  try{ localStorage.setItem(STORAGE_CURRENT, JSON.stringify(state)); } catch(e){ console.warn('Save failed', e); }
}
function loadCurrent(){
  try{
    const raw = localStorage.getItem(STORAGE_CURRENT);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(defaultState(), parsed);
      state.applicant = Object.assign(defaultState().applicant, parsed.applicant||{});
      state.company = Object.assign(defaultState().company, parsed.company||{});
      state.letter = Object.assign(defaultState().letter, parsed.letter||{});
      state.style = Object.assign(defaultState().style, parsed.style||{});
      return true;
    }
  } catch(e){ console.warn(e); }
  return false;
}
function saveLetters(){
  try{ localStorage.setItem(STORAGE_LETTERS, JSON.stringify(letters)); } catch(e){ console.warn(e); }
}
function loadLetters(){
  try{
    const raw = localStorage.getItem(STORAGE_LETTERS);
    if(raw){ letters = JSON.parse(raw) || []; }
  } catch(e){ letters = []; }
}

/* ---------- TOAST ---------- */
function toast(msg, type='info'){
  const container = $('#toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ic = type==='success'?'check':type==='error'?'alert':type==='warning'?'alert':'sparkles';
  el.innerHTML = icon(ic,18) + 'span>' + esc(msg) + '/span>';
  container.appendChild(el);
  setTimeout(()=>{
    el.classList.add('out');
    setTimeout(()=>el.remove(), 250);
  }, 2800);
}

/* ---------- MODAL ---------- */
function openModal(opts){
  const { title, message, iconName='alert', danger=false, confirmText='OK', cancelText='Batal', onConfirm, input=null, inputPlaceholder='', inputValue='' } = opts;
  const overlay = $('#modalOverlay');
  const box = $('#modalBox');
  box.innerHTML =
    'div class="modal-icon ' + (danger?'danger':'') + '">' + icon(iconName,22) + '/div>' +
    'h3>' + esc(title) + '/h3>' +
    (message?'p>' + esc(message) + '/p>':'') +
    (input!==null ? 'div class="field">label>' + esc(input) + '/label>input type="text" id="modalInput" value="' + esc(inputValue) + '" placeholder="' + esc(inputPlaceholder) + '">/div>' : '') +
    'div class="modal-actions">' +
      (cancelText ? 'button class="btn btn-ghost" id="modalCancel">' + esc(cancelText) + '/button>' : '') +
      'button class="btn ' + (danger?'btn-danger':'btn-primary') + '" id="modalConfirm">' + esc(confirmText) + '/button>' +
    '/div>';
  overlay.classList.add('show');
  const close = () => { overlay.classList.remove('show'); };
  const confirm = () => {
    const val = input!==null ? ($('#modalInput')?.value || '') : null;
    close();
    if(onConfirm) onConfirm(val);
  };
  $('#modalConfirm').onclick = confirm;
  const cancelBtn = $('#modalCancel');
  if(cancelBtn) cancelBtn.onclick = close;
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
  if(input!==null){

/* ---------- FIELD GET/SET ---------- */
function getFieldValue(path){
  const parts = path.split('.');
  let obj = state;
  for(let i=0;iparts.length;i++){
    if(obj==null) return '';
    obj = obj[parts[i]];
  }
  return obj == null ? '' : obj;
}
function setFieldValue(path, value){
  const parts = path.split('.');
  let obj = state;
  for(let i=0;iparts.length-1;i++){
    if(obj[parts[i]]==null) obj[parts[i]] = {};
    obj = obj[parts[i]];
  }
  obj[parts[parts.length-1]] = value;
  state.meta.updatedAt = Date.now();
}

/* ---------- FORM BINDING ---------- */
function bindForms(){
  $$('[data-bind]').forEach(el=>{
    const field = el.getAttribute('data-bind');
    el.value = getFieldValue(field);
    el.addEventListener('input', ()=>{
      setFieldValue(field, el.value);
      if(field.startsWith('letter.')){
        if(field==='letter.place' || field==='letter.date'){
          updateDateDisplay();
        }
        syncToPreview(field, el.value);
      } else {
        debouncedRender();
      }
      if(autoSaveEnabled) debouncedSave();
      updateStats();
      updateDashboard();
    });
  });
}
function refreshFormValues(){
  $$('[data-bind]').forEach(el=>{
    const field = el.getAttribute('data-bind');
    if(document.activeElement !== el){
      el.value = getFieldValue(field);
    }
  });
}

  { id:'modern-corporate', name:'Modern Corporate', desc:'Gaya korporat modern' },
  { id:'minimalist', name:'Minimalist Professional', desc:'Bersih dan minimalis' },

function buildPaperHTML(){
  const s = state;
  const tpl = s.style.template;
  const lang = s.style.language || 'id';
  const a = s.applicant, c = s.company, l = s.letter;

  const hasHeader = ['modern-corporate','elegant-navy','executive','fresh-graduate'].includes(tpl);
  let headerHTML = '';
  if(hasHeader){
    const contacts = [];
    if(a.phone) contacts.push(esc(a.phone));
    if(a.email) contacts.push(esc(a.email));
    if(a.city) contacts.push(esc(a.city));
    headerHTML = 'div class="paper-header">' +
      'div class="paper-name">' + esc(a.fullName || 'Nama Lengkap') + '/div>' +
      'div class="paper-contact">' + contacts.join(' · ') + '/div>' +
    '/div>';
  }

  const dateStr = formatDate(l.date, lang);
  const placeDate = (l.place ? esc(l.place) + ', ' : '') + dateStr;

  let bodyHTML = '';
  bodyHTML += 'p class="salutation" contenteditable="true" data-field="letter.salutation" spellcheck="false">' + esc(l.salutation || 'Dengan hormat,') + '/p>';

  if(c.name || c.hrdName){
    let rec = 'div class="recipient">';
    rec += 'div class="recipient-line">Kepada Yth./div>';
    const recName = (c.hrdName || '') + (c.hrdPosition ? ', ' + c.hrdPosition : '');
    if(recName.trim()) rec += 'div class="recipient-line recipient-name">' + esc(recName.trim()) + '/div>';
    if(c.name) rec += 'div class="recipient-line">' + esc(c.name) + '/div>';
    if(c.address) rec += 'div class="recipient-line">' + esc(c.address) + '/div>';
    if(c.city) rec += 'div class="recipient-line">' + esc(c.city) + '/div>';
    rec += '/div>';
    bodyHTML += rec;
  }

  const paras = ['opening','purpose','qualification','experience','skills','reason','availability'];
  paras.forEach(p=>{
    const val = l[p];
    if(val && String(val).trim()){
      bodyHTML += 'p class="paragraph" contenteditable="true" data-field="letter.'+p+'" spellcheck="false">' + esc(val) + '/p>';
    }
  });

  if(l.closing && String(l.closing).trim()){
    bodyHTML += 'p class="paragraph" contenteditable="true" data-field="letter.closing" spellcheck="false">' + esc(l.closing) + '/p>';
  }

  const sigStyle = s.style.signatureStyle || 'plain';
  bodyHTML += 'div class="signature">' +
    'p class="closing-salutation" contenteditable="true" data-field="letter.closingSalutation" spellcheck="false">' + esc(l.closingSalutation || 'Hormat saya,') + '/p>' +
    'div class="signature-space' + (l.signatureImage ? ' has-img' : '') + '">' +
      (l.signatureImage ? 'img class="signature-img" alt="Tanda tangan" src="' + esc(l.signatureImage) + '" style="max-height:22mm;max-width:55mm">' : '') +
    '/div>' +
    (sigStyle==='line' ? 'div class="signature-line">/div>' : '') +
    'p class="signature-name" contenteditable="true" data-field="applicant.fullName" spellcheck="false">' + esc(a.fullName || 'Nama Lengkap') + '/p>' +
  '/div>';

  const dateHTML = dateStr ? 'div class="paper-date">' + esc(placeDate) + '/div>' : '';

  return 'div class="paper template-' + tpl + '">' + headerHTML + dateHTML + 'div class="paper-body">' + bodyHTML + '/div>/div>';
}

function applyStyleVarsTo(paper){
  if(!paper) return;
  const st = state.style;
  if(st.font) paper.style.setProperty('--paper-font', st.font); else paper.style.removeProperty('--paper-font');
  if(st.fontSize) paper.style.setProperty('--paper-size', st.fontSize + 'pt'); else paper.style.removeProperty('--paper-size');
  if(st.lineHeight) paper.style.setProperty('--paper-line-height', st.lineHeight); else paper.style.removeProperty('--paper-line-height');
  if(st.margin) paper.style.setProperty('--paper-margin', st.margin + 'mm'); else paper.style.removeProperty('--paper-margin');
  if(st.color) paper.style.setProperty('--paper-color', st.color); else paper.style.removeProperty('--paper-color');
}

function renderPreview(){
  const container = $('#paperContainer');
  if(!container) return;
  container.innerHTML = buildPaperHTML();
  applyStyleVarsTo(container.querySelector('.paper'));
  attachPreviewListeners();
  const mob = $('#mobilePreviewBody');
  if(mob){
    mob.innerHTML = 'div class="fit-host">' + buildPaperHTML() + '/div>';
    applyStyleVarsTo(mob.querySelector('.paper'));
    attachPreviewListeners(mob);
  }
  const dock = $('#dockBody');
  if(dock){
    dock.innerHTML = 'div class="fit-host">' + buildPaperHTML() + '/div>';
    applyStyleVarsTo(dock.querySelector('.paper'));
    dock.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
  }
  updateStats();
  updateDashboard();
  observePapers();
  layoutPreviews();
}
const debouncedRender = debounce(renderPreview, 90);

function attachPreviewListeners(root=document){
  const scope = root === document ? document.querySelectorAll('#paperContainer [data-field], #mobilePreviewBody [data-field]') : root.querySelectorAll('[data-field]');
  scope.forEach(el=>{
    if(el.dataset.listenerAttached) return;
    el.dataset.listenerAttached = '1';
    el.addEventListener('input', ()=>{
      const field = el.getAttribute('data-field');
      const value = el.innerText.replace(/\u00a0/g,' ');
      setFieldValue(field, value);
      syncToTextarea(field, value);
      if(autoSaveEnabled) debouncedSave();
      updateStats();
    });
    el.addEventListener('blur', ()=>{
      const field = el.getAttribute('data-field');
      const value = el.innerText.replace(/\u00a0/g,' ');
      setFieldValue(field, value);
      syncToTextarea(field, value);
      saveCurrent();
    });
  });
}

function syncToPreview(field, value){
  const els = document.querySelectorAll('#paperContainer [data-field="'+CSS.escape(field)+'"], #mobilePreviewBody [data-field="'+CSS.escape(field)+'"], #dockBody [data-field="'+CSS.escape(field)+'"]');
  els.forEach(el=>{
    if(document.activeElement !== el){
      el.textContent = value;
    }
  });
}
function syncToTextarea(field, value){
  const el = document.querySelector('[data-bind="'+CSS.escape(field)+'"]');
  if(el && document.activeElement !== el){
    el.value = value;
  }
}
function updateDateDisplay(){
  const lang = state.style.language || 'id';
  const dateStr = formatDate(state.letter.date, lang);
  const placeDate = (state.letter.place ? state.letter.place + ', ' : '') + dateStr;
  document.querySelectorAll('.paper-date').forEach(el=>{

function generateLetter(){

function generateID(preset, tone){
  const a = state.applicant, c = state.company, l = state.letter;
  const position = c.position || '[Posisi yang dilamar]';
  const company = c.name || '[Nama Perusahaan]';

  l.salutation = 'Dengan hormat,';
  l.closingSalutation = 'Hormat saya,';

  if(preset === 'short'){
    l.opening = 'Saya bermaksud mengajukan lamaran kerja untuk posisi ' + position + ' di ' + company + '.';
  } else if(preset === 'fresh'){
    l.opening = 'Sebagai lulusan baru yang bersemangat, saya bermaksud mengajukan lamaran pekerjaan untuk posisi ' + position + ' di ' + company + '.';
  } else if(preset === 'experienced'){
    l.opening = 'Dengan pengalaman kerja yang saya miliki, saya bermaksud mengajukan lamaran pekerjaan untuk posisi ' + position + ' di ' + company + '.';
  } else {
    l.opening = 'Saya yang bertanda tangan di bawah ini bermaksud mengajukan lamaran pekerjaan untuk posisi ' + position + ' di ' + company + '.';
  }

  let purpose = '';
  if(c.source){
    purpose = 'Lowongan pekerjaan ini saya ketahui dari ' + c.source + '. ';
  }
  if(preset === 'short'){
    purpose += 'Saya tertarik untuk mengisi posisi tersebut sesuai dengan latar belakang yang saya miliki.';
  } else if(tone === 'confident'){
    purpose += 'Saya yakin bahwa latar belakang, pengalaman, dan kompetensi yang saya miliki dapat menjawab kebutuhan ' + company + ' untuk posisi tersebut.';
  } else if(tone === 'elegant'){
    purpose += 'Merupakan suatu kehormatan bagi saya untuk dapat mengajukan diri pada posisi ini, sejalan dengan latar belakang dan kompetensi yang saya miliki.';
  } else if(tone === 'concise'){
    purpose += 'Saya melamar karena posisi ini sesuai dengan latar belakang saya.';
  } else {
    purpose += 'Saya tertarik untuk mengisi posisi ini karena sesuai dengan latar belakang pendidikan, pengalaman, dan kompetensi yang saya miliki.';
  }
  l.purpose = purpose.trim();

  let qual = '';
  if(a.education && a.major){
    qual = 'Saya merupakan lulusan ' + a.education + ' jurusan ' + a.major + '.';
  } else if(a.education){
    qual = 'Saya merupakan lulusan ' + a.education + '.';
  }
  l.qualification = qual;

  l.experience = (a.experience && a.experience.trim()) ? a.experience.trim() : '';

  if(a.skills && a.skills.trim()){
    l.skills = 'Beberapa keahlian dan kompetensi yang saya miliki antara lain: ' + a.skills.trim() + '.';
  } else {
    l.skills = '';
  }

  if(preset === 'short'){
    l.reason = 'Saya meyakini dapat memberikan kontribusi terbaik bagi ' + company + '.';
  } else if(tone === 'confident'){
    l.reason = 'Saya percaya bahwa kombinasi latar belakang dan kompetensi saya akan membawa dampak positif bagi ' + company + ', dan saya siap membuktikannya melalui kinerja nyata.';
  } else if(tone === 'elegant'){
    l.reason = 'Saya memandang ' + company + ' sebagai tempat yang tepat untuk mengembangkan potensi diri sekaligus memberikan kontribusi yang bermakna bagi kemajuan perusahaan.';
  } else {
    l.reason = 'Saya tertarik untuk bergabung dengan ' + company + ' karena saya meyakini bahwa latar belakang dan kompetensi yang saya miliki dapat memberikan kontribusi positif bagi perusahaan.';
  }

  if(preset === 'short'){
    l.availability = 'Saya siap mengikuti seluruh proses seleksi.';
  } else {
    l.availability = 'Saya siap untuk mengikuti seluruh proses seleksi, termasuk wawancara, sesuai dengan jadwal yang Bapak/Ibu tentukan.';
  }

  if(preset === 'short'){
    l.closing = 'Demikian surat lamaran ini saya buat. Atas perhatian Bapak/Ibu, saya mengucapkan terima kasih.';
  } else {
    l.closing = 'Demikian surat lamaran ini saya buat dengan sebenar-benarnya. Besar harapan saya untuk dapat diberikan kesempatan bergabung dan berkontribusi di ' + company + '. Atas perhatian dan kesempatan yang Bapak/Ibu berikan, saya mengucapkan terima kasih.';
  }

  if(!l.place) l.place = c.city || a.city || '';
  if(!l.date) l.date = new Date().toISOString().slice(0,10);
  syncDateInputs();
}

function generateEN(preset, tone){
  const a = state.applicant, c = state.company, l = state.letter;
  const position = c.position || '[Position]';
  const company = c.name || '[Company Name]';

  l.salutation = 'Dear Hiring Manager,';
  l.closingSalutation = 'Sincerely,';

  if(preset === 'fresh'){
    l.opening = 'As a recent graduate with a strong passion to grow, I am writing to express my interest in the ' + position + ' position at ' + company + '.';
  } else if(preset === 'experienced'){
    l.opening = 'With my professional experience, I am writing to express my interest in the ' + position + ' position at ' + company + '.';
  } else {
    l.opening = 'I am writing to express my interest in the ' + position + ' position at ' + company + '.';
  }

  let purpose = '';
  if(c.source) purpose = 'I learned about this opportunity through ' + c.source + '. ';
  purpose += 'I believe that my background, experience, and skills align well with the requirements of the role.';
  if(tone === 'confident') purpose = purpose.replace('I believe', 'I am confident');
  l.purpose = purpose;

  let qual = '';
  if(a.education && a.major) qual = 'I hold a ' + a.education + ' degree in ' + a.major + '.';
  else if(a.education) qual = 'I hold a ' + a.education + ' degree.';
  l.qualification = qual;

  l.experience = (a.experience && a.experience.trim()) ? a.experience.trim() : '';

  if(a.skills && a.skills.trim()){
    l.skills = 'My key skills and competencies include: ' + a.skills.trim() + '.';
  } else l.skills = '';

  l.reason = 'I am particularly interested in joining ' + company + ' because I believe my background and skills can contribute positively to the company.';
  l.availability = 'I am available to participate in the entire selection process, including interviews, at your convenience.';
  l.closing = 'Thank you for considering my application. I look forward to the opportunity to discuss how I can contribute to ' + company + '.';

  if(!l.place) l.place = c.city || a.city || '';
  if(!l.date) l.date = new Date().toISOString().slice(0,10);
  syncDateInputs();
}
function syncDateInputs(){
  $$('[data-bind]').forEach(el=>{
    const f = el.getAttribute('data-bind');
    if(f==='letter.place' || f==='letter.date'){
      if(document.activeElement !== el) el.value = getFieldValue(f);
    }
  });
}

/* ---------- SAVE / LOAD / MANAGE LETTERS ---------- */
function saveCurrentAsLetter(name){
  const id = state.meta.id || uid();
  state.meta.id = id;
  state.meta.name = (name && name.trim()) || state.meta.name || ('Surat ' + new Date().toLocaleDateString('id-ID'));
  state.meta.updatedAt = Date.now();
  if(!state.meta.createdAt) state.meta.createdAt = Date.now();
  const record = {
    id,
    name: state.meta.name,
    state: JSON.parse(JSON.stringify(state)),
    createdAt: state.meta.createdAt,
    updatedAt: Date.now()
  };
  const idx = letters.findIndex(l=>l.id===id);
  if(idx>=0) letters[idx] = record;
  else letters.unshift(record);
  saveLetters();
  saveCurrent();
  updateArchiveCount();
  renderLetterList();
  updateDashboard();
  toast('Surat disimpan ke arsip', 'success');
}
function loadLetter(id){
  const rec = letters.find(l=>l.id===id);
  if(!rec) return;
  state = JSON.parse(JSON.stringify(rec.state));
  state.meta = { id: rec.id, name: rec.name, createdAt: rec.createdAt, updatedAt: rec.updatedAt };
  refreshFormValues();
  renderPreview();
  updateStyleControlsFromState();
  saveCurrent();
  navigateTo('letter');
  toast('Surat dimuat: ' + rec.name, 'success');
}
function duplicateLetter(id){
  const rec = letters.find(l=>l.id===id);
  if(!rec) return;
  const copy = JSON.parse(JSON.stringify(rec));
  copy.id = uid();
  copy.name = rec.name + ' (Salinan)';
  copy.createdAt = Date.now();
  copy.updatedAt = Date.now();
  copy.state.meta = { id: copy.id, name: copy.name, createdAt: copy.createdAt, updatedAt: copy.updatedAt };
  letters.unshift(copy);
  saveLetters();
  updateArchiveCount();
  renderLetterList();
  updateDashboard();
  toast('Surat diduplikasi', 'success');
}

/* ---------- PREVIEW LAYOUT (fit-to-panel, dock, zoom) ---------- */
let previewZoom = null;      // null = pas lebar panel
let paperRO = null, layoutQueued = false;
function fitPaper(host, availW, opts){
  opts = opts || {};
  if(!host) return 1;
  const paper = host.querySelector('.paper');
  if(!paper) return 1;
  paper.style.transform = ''; paper.style.width = ''; paper.style.maxWidth = '';
  host.style.width = ''; host.style.height = '';
  host.classList.remove('is-scaled');
  if(!opts.force && availW  560){ host.classList.add('flow'); return 1; }
  host.classList.remove('flow');
  paper.style.width = '210mm'; paper.style.maxWidth = 'none';
  const pw = paper.offsetWidth;
  const s = opts.zoom || Math.min(1, Math.max(.3, availW / pw));
  paper.style.transformOrigin = 'top left';
  paper.style.transform = 'scale(' + s + ')';
  host.classList.add('is-scaled');
  host.style.width = Math.round(pw * s) + 'px';
  host.style.height = Math.round(paper.offsetHeight * s) + 'px';
  return s;
}
function availWidth(el, extra){
  if(!el) return 0;
  const cs = getComputedStyle(el);
  return el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - (extra||0);
}
function layoutPreviews(){
  const ps = $('#previewScroll');
  if(ps && ps.clientWidth > 0){
    const s = fitPaper($('#paperContainer'), availWidth(ps), { force:true, zoom:previewZoom });
    const zl = $('#zoomLabel'); if(zl) zl.textContent = Math.round(s * 100) + '%';
  }
  const ov = $('#mobilePreviewOverlay');
  if(ov && ov.classList.contains('show')){
    const b = $('#mobilePreviewBody');
    fitPaper(b.querySelector('.fit-host'), availWidth(b));
  }
  const dock = $('#dockBody');
  if(dock && dock.clientWidth > 0) fitPaper(dock.querySelector('.fit-host'), availWidth(dock));
  const pm = $('#printModal'), pb = $('#printModalBody');
  if(pm && pm.classList.contains('show') && pb) fitPaper(pb.querySelector('.fit-host'), availWidth(pb));
}
function queueLayout(){
  if(layoutQueued) return;
  layoutQueued = true;
  requestAnimationFrame(()=>{ layoutQueued = false; layoutPreviews(); });
}
function observePapers(){
  if(typeof ResizeObserver === 'undefined') return;
  if(paperRO) paperRO.disconnect();
  paperRO = new ResizeObserver(queueLayout);
  document.querySelectorAll('#paperContainer .paper, #mobilePreviewBody .paper, #dockBody .paper, #printModalBody .paper')
    .forEach(p=>paperRO.observe(p));
}
function updateDockVisibility(){
  const show = window.innerWidth = 1180 && !['dashboard','archive','settings'].includes(currentSection);
  document.body.classList.toggle('has-dock', show);
  if(show) queueLayout();
}
function setDockOpen(open){
  const d = $('#mobileDock'); if(!d) return;
  d.classList.toggle('open', open);
  document.body.classList.toggle('dock-open', open);
  $('#dockToggle')?.setAttribute('aria-expanded', open ? 'true' : 'false');
  try{ localStorage.setItem('slp_dock_v1', open ? '1' : '0'); }catch(e){}
  queueLayout();
}
function closeMenus(){ $$('.dl-wrap.open').forEach(w=>w.classList.remove('open')); }
function initPreviewUI(){
  let dockOpen = false;
  try{ dockOpen = localStorage.getItem('slp_dock_v1') === '1'; }catch(e){}
  setDockOpen(dockOpen);
  updateDockVisibility();
  $('#dockToggle')?.addEventListener('click', ()=> setDockOpen(!$('#mobileDock').classList.contains('open')));
  document.addEventListener('click', (e)=>{
    const t = e.target.closest('[data-dl-toggle]');
    if(t){
      const wrap = t.closest('.dl-wrap');
      const was = wrap.classList.contains('open');
      closeMenus();
      wrap.classList.toggle('open', !was);
      return;
    }
    if(!e.target.closest('.dl-menu')) closeMenus();
    const z = e.target.closest('[data-zoom]');
    if(z){
      const cur = parseFloat(($('#zoomLabel')?.textContent || '100')) / 100 || 1;
      const act = z.getAttribute('data-zoom');
      if(act === 'fit') previewZoom = null;
      else previewZoom = Math.min(1.5, Math.max(.4, Math.round((cur + (act === 'in' ? .1 : -.1)) * 10) / 10));
      layoutPreviews();
    }
  });
  window.addEventListener('resize', ()=>{ updateDockVisibility(); queueLayout(); });
  observePapers();
  layoutPreviews();
}

/* ---------- DOWNLOAD / PRINT / COPY ---------- */
function getPlainText(){
  const paper = document.querySelector('#paperContainer .paper');
  if(!paper) return '';
  return paper.innerText.replace(/\n{3,}/g,'\n\n').trim();
}
function copyLetter(){
  const text = getPlainText();
  if(!text){ toast('Surat masih kosong', 'warning'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('Surat disalin ke clipboard', 'success'))
      .catch(()=>fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Surat disalin ke clipboard', 'success'); }
  catch(e){ toast('Gagal menyalin', 'error'); }
  ta.remove();
}
function downloadTXT(){
  const text = getPlainText();

  a.download = safeFileName() + '.txt';

  toast('File TXT diunduh', 'success');
}

/* ---------- EXPORT / IMPORT ---------- */
function exportJSON(){
  const data = {
    app:'Surat Lamaran Pro',
    version:1,
    exportedAt:new Date().toISOString(),
    letters: letters,
    current: state
  };
  const blob = new Blob([JSON.stringify(data,null,2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'surat-lamaran-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Backup JSON diunduh', 'success');
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      let imported = 0;
      if(Array.isArray(data.letters)){
        data.letters.forEach(l=>{
          if(l && l.id && l.state){
            const exists = letters.find(x=>x.id===l.id);
            if(!exists){ letters.push(l); imported++; }
          }
        });
      }
      if(data.current && data.current.meta){
        state = Object.assign(defaultState(), data.current);
        state.applicant = Object.assign(defaultState().applicant, data.current.applicant||{});
        state.company = Object.assign(defaultState().company, data.current.company||{});
        state.letter = Object.assign(defaultState().letter, data.current.letter||{});
        state.style = Object.assign(defaultState().style, data.current.style||{});
        refreshFormValues();
        renderPreview();
        updateStyleControlsFromState();
      }
      saveLetters();
      saveCurrent();
      updateArchiveCount();
      renderLetterList();
      updateDashboard();
      toast('Import berhasil: ' + imported + ' surat baru', 'success');
    } catch(e){
      toast('File JSON tidak valid', 'error');
    }
  };
  reader.readAsText(file);
}

/* ---------- DATE FIELD (dd/mm/yyyy) ---------- */
function isoToDMY(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
}
function dmyToISO(txt){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(txt || '');
  if(!m) return null;
  const d = +m[1], mo = +m[2], y = +m[3];
  const dt = new Date(y, mo - 1, d);
  if(y  1000 || dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return m[3] + '-' + m[2] + '-' + m[1];
}
function initDateFields(){
  const proto = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  $$('input[type="date"][data-bind]').forEach(native=>{
    if(native.dataset.dmy) return;
    native.dataset.dmy = '1';
    const wrap = document.createElement('div');
    wrap.className = 'date-field';
    const text = document.createElement('input');
    text.type = 'text';
    text.className = 'date-text';
    text.inputMode = 'numeric';
    text.placeholder = 'dd/mm/yyyy';
    text.autocomplete = 'off';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'date-pick';
    btn.title = 'Pilih dari kalender';
    btn.setAttribute('aria-label', 'Pilih tanggal dari kalender');
    btn.innerHTML = 'svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">rect x="3" y="4" width="18" height="18" rx="2"/>path d="M16 2v4M8 2v4M3 10h18"/>/svg>';
    native.parentNode.insertBefore(wrap, native);
    wrap.appendChild(text);
    wrap.appendChild(btn);
    wrap.appendChild(native);
    native.className = (native.className + ' date-native').trim();
    native.tabIndex = -1;

    // Setiap kali nilai ISO diubah lewat kode (refresh form, muat surat, generator), tampilan dd/mm/yyyy ikut diperbarui.
    Object.defineProperty(native, 'value', {
      configurable: true,
      get(){ return proto.get.call(native); },
      set(v){
        proto.set.call(native, v);
        if(document.activeElement !== text) text.value = isoToDMY(proto.get.call(native));
      }
    });
    text.value = isoToDMY(proto.get.call(native));

    const commit = (iso)=>{
      proto.set.call(native, iso);
      native.dispatchEvent(new Event('input', { bubbles:true }));
    };
    text.addEventListener('input', ()=>{
      const isoPaste = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text.value.trim());
      if(isoPaste) text.value = isoPaste[3] + isoPaste[2] + isoPaste[1];
      let digits = text.value.replace(/\D/g, '').slice(0, 8);
      let out = digits;
      if(digits.length > 4) out = digits.slice(0,2) + '/' + digits.slice(2,4) + '/' + digits.slice(4);
      else if(digits.length > 2) out = digits.slice(0,2) + '/' + digits.slice(2);
      text.value = out;
      if(out === ''){ commit(''); text.classList.remove('invalid'); return; }
      const iso = dmyToISO(out);
      if(iso){ commit(iso); text.style.borderColor = ''; }
      else if(out.length === 10){ text.style.borderColor = 'var(--danger)'; }
      else text.style.borderColor = '';
    });
    text.addEventListener('focus', ()=>{ setTimeout(()=>text.select(), 0); });
    text.addEventListener('blur', ()=>{
      const cur = proto.get.call(native);
      if(text.value && !dmyToISO(text.value)){
        text.value = isoToDMY(cur);
        text.style.borderColor = '';
        if(typeof toast === 'function') toast('Format tanggal harus dd/mm/yyyy dan tanggalnya valid', 'warning');
      } else {
        text.value = isoToDMY(cur);
      }
    });
    btn.addEventListener('click', ()=>{
      try{
        if(typeof native.showPicker === 'function'){ native.showPicker(); return; }
      } catch(e){}
      native.style.pointerEvents = 'auto';
      native.focus(); native.click();
      setTimeout(()=>{ native.style.pointerEvents = 'none'; }, 300);
    });
    native.addEventListener('change', ()=>{ text.value = isoToDMY(proto.get.call(native)); });
  });
}

/* ---------- SIGNATURE PAD ---------- */
function initSignaturePad(){
  const canvas = $('#sigCanvas');
  if(!canvas) return;
  const wrap = $('#sigPadWrap');
  const ctx = canvas.getContext('2d');
  let drawing = false, last = null, hasInk = false;

  function resize(){
    const rect = canvas.getBoundingClientRect();
    if(!rect.width) return;
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    const snapshot = hasInk ? canvas.toDataURL() : null;
    canvas.width = Math.round(rect.width * ratio);
    canvas.height = Math.round(rect.height * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111827';
    if(snapshot){
      const img = new Image();
      img.onload = ()=>ctx.drawImage(img, 0, 0, rect.width, rect.height);
      img.src = snapshot;
    }
  }
  function pos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  canvas.addEventListener('pointerdown', e=>{
    e.preventDefault();
    if(!canvas.width) resize();
    canvas.setPointerCapture(e.pointerId);
    drawing = true; last = pos(e);
    ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, Math.PI*2); ctx.fillStyle = '#111827'; ctx.fill();
    hasInk = true; wrap.classList.add('drawn');
  });
  canvas.addEventListener('pointermove', e=>{
    if(!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  });
  const stop = ()=>{ drawing = false; last = null; };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);
  canvas.addEventListener('pointerleave', stop);

  function clearPad(){
    ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore();
    hasInk = false; wrap.classList.remove('drawn');
  }
  // Potong area kosong di sekeliling coretan, hasilnya PNG transparan.
  function trimmedDataURL(srcCanvas){
    const w = srcCanvas.width, h = srcCanvas.height;
    const data = srcCanvas.getContext('2d').getImageData(0, 0, w, h).data;
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for(let y = 0; y  h; y++){
      for(let x = 0; x  w; x++){
        if(data[(y*w + x)*4 + 3] > 10){
          if(x  x0) x0 = x; if(x > x1) x1 = x;
          if(y  y0) y0 = y; if(y > y1) y1 = y;
        }
      }
    }
    if(x1  0) return '';
    const pad = 6;
    x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
    x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
    const out = document.createElement('canvas');
    out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
    out.getContext('2d').drawImage(srcCanvas, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    return out.toDataURL('image/png');
  }
  function applySignature(dataUrl){
    state.letter.signatureImage = dataUrl || '';
    state.meta.updatedAt = Date.now();
    renderPreview();
    saveCurrent();
    updateSignatureUI();
  }

  $('#sigSaveBtn')?.addEventListener('click', ()=>{
    if(!hasInk){ toast('Gambar tanda tangan dulu pada kotak di atas', 'warning'); return; }
    const url = trimmedDataURL(canvas);
    if(!url){ toast('Tanda tangan kosong', 'warning'); return; }
    applySignature(url);
    toast('Tanda tangan dipasang pada surat', 'success');
  });
  $('#sigClearPadBtn')?.addEventListener('click', clearPad);
  $('#sigRemoveBtn')?.addEventListener('click', ()=>{
    applySignature('');
    toast('Tanda tangan dihapus', 'info');
  });
  $('#sigUploadBtn')?.addEventListener('click', ()=>$('#sigFileInput')?.click());
  $('#sigFileInput')?.addEventListener('change', e=>{
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!f) return;
    if(!/^image\/(png|jpeg|webp)$/.test(f.type)){ toast('Gunakan file gambar PNG, JPG, atau WebP', 'warning'); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        // Perkecil agar penyimpanan ringan (maks. lebar 600px).
        const scale = Math.min(1, 600 / img.width);
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        const cx = c.getContext('2d');
        cx.drawImage(img, 0, 0, c.width, c.height);
        // Jika gambar berlatar putih (foto/scan), jadikan latar putih transparan.
        if(f.type !== 'image/png'){
          const id = cx.getImageData(0, 0, c.width, c.height);
          const d = id.data;
          for(let i = 0; i  d.length; i += 4){
            const lum = (d[i] + d[i+1] + d[i+2]) / 3;
            if(lum > 225) d[i+3] = 0;
            else if(lum > 170) d[i+3] = Math.round(d[i+3] * (225 - lum) / 55);
          }
          cx.putImageData(id, 0, 0);
        }
        applySignature(c.toDataURL('image/png'));
        toast('Tanda tangan dipasang pada surat', 'success');
      };
      img.onerror = ()=>toast('Gambar tidak dapat dibaca', 'error');
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  });

  window.addEventListener('resize', ()=>{ if(!drawing) resize(); });
  // Canvas baru berukuran benar setelah section terlihat.
  new ResizeObserver(()=>{ if(!drawing && !hasInk) resize(); }).observe(canvas);
  resize();
  updateSignatureUI();
}
function updateSignatureUI(){
  const box = $('#sigCurrent'), img = $('#sigCurrentImg');
  if(!box || !img) return;
  const has = !!(state.letter && state.letter.signatureImage);
  box.classList.toggle('show', has);
  if(has) img.src = state.letter.signatureImage;
}
