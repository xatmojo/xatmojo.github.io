 `<div class="card"><b>${n} dari ${all.length} siap (${p}%)</b><div class="bar"><i style="width:${p}%"></i></div></div>
 <form class="row" style="margin-top:14px" data-form="addChk"><label>Tambah item<input name="n" required></label><button>Tambah</button></form>
 <div class="list">${all.map(x=>`<label class="item chk"><input type="checkbox" data-act="chk" data-n="${esc(x)}" ${D.chk.done[x]?'checked':''}>${esc(x)}${D.chk.custom.includes(x)?`<button type="button" class="x" data-act="delChk" data-n="${esc(x)}" aria-label="Hapus">✕</button>`:''}</label>`).join('')}</div>`)};

/* ---------- Kontrak ---------- */
R.kontrak=()=>{const k=D.k;const f=(n,l,u)=>`<label>${l}<input type="number" min="0" step="any" name="${n}" value="${k[n]??u}"></label>`;
 return page('Kalkulator Kontrak','Perkiraan kasar. Sesuaikan dengan isi kontrak dan potongan Anda yang sebenarnya.',
 `<form class="card row" id="kform">${f('gaji','Gaji per bulan (USD)','')}${f('bln','Durasi kontrak (bulan)',9)}${f('kurs','Kurs (Rp per USD)','')}${f('pot','Potongan per bulan (USD)',0)}</form><div class="out" id="kout"></div>`)};
const kCalc=()=>{const f=$('#kform');if(!f)return;const v={};new FormData(f).forEach((x,n)=>v[n]=D.k[n]=x);save();
 const g=+v.gaji||0,b=+v.bln||0,r=+v.kurs||0,p=+v.pot||0,net=(g-p)*b;
 const c=(t,x)=>`<div class="card stat"><b>${x}</b><span>${t}</span></div>`;
 $('#kout').innerHTML=c('Total gaji kotor',`$${num(g*b)}`)+c('Total bersih setelah potongan',`$${num(net)}`)+c('Bersih per bulan dalam rupiah',`Rp ${num((g-p)*r)}`)+c('Total bersih dalam rupiah',`Rp ${num(net*r)}`)};

/* ---------- Pelacak lamaran ---------- */
const ST=['Terkirim','Interview','Medical','Diterima','Ditolak'];
R.lamaran=()=>{const L=[...D.apps].sort((a,b)=>b.sent.localeCompare(a.sent));
 return page('Pelacak Lamaran','Catat ke mana saja Anda melamar dan kapan perlu menindaklanjuti.',
 `<form class="card row" data-form="addApp"><label>Perusahaan/crewing<input name="co" required></label><label>Posisi<input name="pos" required></label><label>Tanggal kirim<input type="date" name="sent" value="${todayISO()}" required></label><label>Tindak lanjut<input type="date" name="fu"></label><label>Catatan<input name="note"></label><button>Tambah</button></form>
 <div class="list">${L.map(a=>{const late=a.fu&&a.fu<todayISO()&&ST.indexOf(a.st)<3;
 return `<div class="item"><div><b>${esc(a.co)}, ${esc(a.pos)}</b><span class="s">Dikirim ${fmtD(a.sent)}${a.fu?', tindak lanjut '+fmtD(a.fu):''}${a.note?'. '+esc(a.note):''}</span></div>
 <div class="row" style="align-items:center">${late?'<span class="tag bad">Perlu follow-up</span>':''}<select data-act="status" data-id="${a.id}" aria-label="Status">${ST.map(s=>`<option${s===a.st?' selected':''}>${s}</option>`).join('')}</select>${del('apps',a.id)}</div></div>`}).join('')||'<p class="empty">Belum ada lamaran tercatat.</p>'}</div>`)};

/* ---------- Templat pesan ---------- */
const MSG={
 id:{lamar:m=>`Perkenalkan, saya ${m.nama}. Saya bermaksud melamar posisi ${m.pos}${m.co?' di '+m.co:''}. Bersama pesan ini saya lampirkan CV dan dokumen pendukung saya. Saya siap mengikuti proses seleksi sesuai jadwal yang ditentukan.`,
 status:m=>`Saya ${m.nama}, sebelumnya telah mengirimkan lamaran untuk posisi ${m.pos}${m.co?' di '+m.co:''}. Mohon informasi mengenai perkembangan proses lamaran saya.`,
 follow:m=>`Terima kasih atas kesempatan interview untuk posisi ${m.pos}${m.co?' di '+m.co:''}. Saya ${m.nama}, ingin menanyakan tahapan selanjutnya dan dokumen apa yang perlu saya siapkan.`,
 hi:p=>`Yth. ${p||'Bapak/Ibu HRD'},`,bye:(n,t)=>`Terima kasih atas perhatiannya.\n\nHormat saya,\n${n}${t?'\n'+t:''}`},
 en:{lamar:m=>`My name is ${m.nama}. I would like to apply for the position of ${m.pos}${m.co?' at '+m.co:''}. Please find my CV and supporting documents attached. I am available to attend the selection process at your convenience.`,
 status:m=>`This is ${m.nama}. I previously submitted an application for the position of ${m.pos}${m.co?' at '+m.co:''}. May I kindly ask for an update on my application?`,
 follow:m=>`Thank you for the interview opportunity for the position of ${m.pos}${m.co?' at '+m.co:''}. This is ${m.nama}. May I ask about the next steps and which documents I should prepare?`,
 hi:p=>`Dear ${p||'Sir/Madam'},`,bye:(n,t)=>`Thank you for your time and consideration.\n\nBest regards,\n${n}${t?'\n'+t:''}`}};
const msgGen=()=>{const f=$('#mform');if(!f)return;const m={};new FormData(f).forEach((v,k)=>m[k]=D.msg[k]=v.trim());save();
 const T=MSG[m.lang||'id'];m.nama=m.nama||'[nama]';m.pos=m.pos||'[posisi]';
 $('#mout').value=`${T.hi(m.pen)}\n\n${T[m.type||'lamar'](m)}\n\n${T.bye(m.nama,m.tel)}`};
R.pesan=()=>{const m=D.msg,i=(n,l,p='')=>`<label>${l}<input name="${n}" value="${esc(m[n]||'')}" placeholder="${p}"></label>`;
 const s=(n,l,o)=>`<label>${l}<select name="${n}">${o.map(([v,t])=>`<option value="${v}"${m[n]===v?' selected':''}>${t}</option>`).join('')}</select></label>`;
 return page('Templat Pesan','Pesan singkat untuk email atau WhatsApp. Isi data, lalu salin atau kirim.',
 `<form class="card row" id="mform">${s('type','Jenis pesan',[['lamar','Melamar'],['status','Tanya status'],['follow','Setelah interview']])}${s('lang','Bahasa',[['id','Indonesia'],['en','English']])}${i('nama','Nama Anda')}${i('tel','Nomor telepon')}${i('pen','Nama penerima','opsional')}${i('co','Perusahaan','opsional')}${i('pos','Posisi','mis. Oiler')}</form>
 <textarea id="mout" aria-label="Hasil pesan"></textarea><div class="row" style="margin-top:10px"><button data-act="copy">Salin</button><button class="ghost" data-act="wa">Buka WhatsApp</button></div>`)};

/* ---------- Beranda ---------- */
R.home=()=>{const near=D.docs.filter(d=>docStatus(d)[0]!=='ok').length,tot=D.sea.reduce((n,s)=>n+seaDays(s),0),act=D.apps.filter(a=>ST.indexOf(a.st)<3).length;
 return page('Seafarer Hub','Semua alat untuk melamar dan mengurus dokumen pelaut di satu tempat. Data tersimpan di perangkat ini.',
 `<div class="stats"><div class="card stat"><b class="${near?'bad':''}">${near}</b><span>Dokumen perlu perhatian</span></div><div class="card stat"><b>${dur(tot)}</b><span>Total sea time</span></div><div class="card stat"><b>${act}</b><span>Lamaran aktif</span></div></div>
 <div class="tools">${TOOLS.filter(t=>t.d).map(t=>`<a href="#${t.id}"><b>${t.t}</b><span>${t.d}</span></a>`).join('')}</div>`)};

/* ---------- Aksi ---------- */
const FORMS={
 addDoc:f=>D.docs.push({id:uid(),name:f.get('name'),no:f.get('no'),exp:f.get('exp')}),
 addSea:f=>{if(f.get('off')&&f.get('off')<f.get('on'))return alert('Tanggal sign off harus setelah sign on.');D.sea.push({id:uid(),ship:f.get('ship'),rank:f.get('rank'),on:f.get('on'),off:f.get('off')})},
 addChk:f=>{const n=f.get('n').trim();if(n&&![...CHK,...D.chk.custom].includes(n))D.chk.custom.push(n)},
 addApp:f=>D.apps.push({id:uid(),co:f.get('co'),pos:f.get('pos'),sent:f.get('sent'),fu:f.get('fu'),note:f.get('note'),st:'Terkirim'})};
document.addEventListener('submit',e=>{const fn=FORMS[e.target.dataset.form];if(!fn)return;e.preventDefault();fn(new FormData(e.target));save();show(cur)});
document.addEventListener('input',e=>{if(e.target.form?.id==='kform')kCalc();if(e.target.form?.id==='mform')msgGen()});
document.addEventListener('change',e=>{const t=e.target;if(t.form?.id==='mform')msgGen();
 if(t.dataset.act==='chk'){D.chk.done[t.dataset.n]=t.checked;save();show(cur)}
 if(t.dataset.act==='status'){D.apps.find(a=>a.id===t.dataset.id).st=t.value;save();show(cur)}});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='del'){D[b.dataset.k]=D[b.dataset.k].filter(x=>x.id!==b.dataset.id);save();show(cur)}
 if(a==='delChk'){e.preventDefault();D.chk.custom=D.chk.custom.filter(x=>x!==b.dataset.n);save();show(cur)}
 if(a==='copy'){const v=$('#mout').value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>b.textContent='Tersalin',()=>{$('#mout').select();document.execCommand('copy');b.textContent='Tersalin'});setTimeout(()=>b.textContent='Salin',1500)}
 if(a==='wa')window.open('https://wa.me/?text='+encodeURIComponent($('#mout').value),'_blank','noopener')});

/* ---------- Navigasi ---------- */
let cur='home';
const nav=$('#nav'),views=$('#views');
nav.innerHTML='<div class="brand">Seafarer Hub<small>CV, lamaran, dokumen pelaut</small></div>'+TOOLS.map((t,i)=>(t.g&&t.g!==TOOLS[i-1]?.g?`<div class="grp">${t.g}</div>`:'')+`<a href="#${t.id}" data-id="${t.id}">${t.t}</a>`).join('');
TOOLS.forEach(t=>{const v=document.createElement('section');v.className='view '+(t.f?'frame':'native');v.id='v-'+t.id;views.appendChild(v)});
function show(id){cur=id;const t=TOOLS.find(x=>x.id===id),v=$('#v-'+id);
 document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x===v));
 nav.querySelectorAll('a').forEach(a=>{a.classList.toggle('on',a.dataset.id===id);if(a.dataset.id===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 document.title=(t.id==='home'?'':t.t+' | ')+'Seafarer Hub';
 if(t.f){if(!v.firstChild){const f=document.createElement('iframe');f.title=t.t;f.setAttribute('allow','clipboard-write; fullscreen');f.srcdoc=$('#src-'+id).textContent.replace(/\uE000/g,'<');v.appendChild(f)}}
 else{const y=v.scrollTop;v.innerHTML=R[id]();v.scrollTop=y;if(id==='kontrak')kCalc();if(id==='pesan')msgGen()}}
const route=()=>{const id=location.hash.slice(1);show(TOOLS.some(t=>t.id===id)?id:'home')};
addEventListener('hashchange',route);route();
</script>
</body>
</html>
