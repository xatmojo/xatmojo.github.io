*{box-sizing:border-box}
:root{--bg:#f3f5f8;--card:#fff;--ink:#12233c;--mut:#5d6c80;--line:#d8e0ea;--navy:#0b1f3a;--sea:#0f6f7c;--on:#fff;--amber:#f0a732;--ok:#1d7a4c;--warn:#a96b0b;--bad:#b3322a}
@media(prefers-color-scheme:dark){:root{--bg:#0d1726;--card:#14233a;--ink:#e6edf6;--mut:#93a3b8;--line:#243752;--navy:#071324;--sea:#4fc3d1;--on:#06202a;--ok:#5cc58d;--warn:#f0b04d;--bad:#ff7d73}}
html,body{height:100%;margin:0}
body{font:15px/1.55 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:250px 1fr;height:100dvh}
nav{background:var(--navy);color:#cfd9e6;overflow:auto;padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.brand{font:600 20px Outfit,sans-serif;color:#fff;padding:4px 10px 10px}
.brand small{display:block;font:400 12px Inter,sans-serif;color:#8fa3bd}
.grp{font-size:12px;color:#8fa3bd;padding:14px 10px 4px}
nav a{color:inherit;text-decoration:none;padding:8px 10px;border-radius:8px;border-left:3px solid transparent}
nav a:hover{background:rgba(255,255,255,.07)}
nav a.on{background:rgba(255,255,255,.1);color:#fff;border-left-color:var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#views{min-width:0;height:100%}
.view{display:none;height:100%}.view.on{display:block}
.view.native{overflow:auto;padding:28px clamp(16px,4vw,44px)}
.view iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.wrap{max-width:860px;margin:auto}
h1{font:600 26px Outfit,sans-serif;margin:0 0 4px}
.lead{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);flex:1 1 150px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:240px;resize:vertical;margin-top:12px}
button{font:600 14px Inter,sans-serif;border:0;border-radius:8px;padding:9px 16px;background:var(--sea);color:var(--on);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.x{background:none;color:var(--mut);padding:4px 8px}
.list{display:grid;gap:8px;margin-top:16px}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.item b{display:block}.item span.s{color:var(--mut);font-size:13px}
.item select{width:auto}
.item.chk{flex-direction:row;justify-content:flex-start;color:var(--ink);font-size:15px;cursor:pointer}
.item.chk input{width:auto}.item.chk .x{margin-left:auto}
.tag{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.stat b{font:600 24px Outfit,sans-serif;display:block}.stat span{color:var(--mut);font-size:13px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tools a{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.tools a:hover{border-color:var(--sea)}.tools b{display:block;font:600 16px Outfit,sans-serif}.tools span{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 0}.bar i{display:block;height:100%;background:var(--sea)}
.empty{color:var(--mut);padding:18px;text-align:center}
.out{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}nav{flex-direction:row;overflow-x:auto;padding:8px;gap:4px;align-items:center}.brand,.grp{display:none}nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}nav a.on{border-bottom-color:var(--amber)}.item{flex-wrap:wrap}}
</style>
</head>

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:var(--fs);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
h1,h2,h3,h4{font-family:'Outfit','Inter',sans-serif;margin:0;line-height:1.25;font-weight:600}
button{font-family:inherit;font-size:inherit}
a{color:inherit}
img{max-width:100%}

.icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:-0.14em}
.icon.fill{fill:currentColor;stroke:none}

/* =========================================================
   2. PRELOADER
   ========================================================= */
#preloader{
  position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#cbd8e8;
  transition:opacity .45s ease,visibility .45s;
}
#preloader.hide{opacity:0;visibility:hidden}
.loader{
  width:46px;height:46px;border-radius:50%;
  border:3px solid rgba(255,255,255,.2);
  border-top-color:var(--gold);
  animation:spin .85s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#preloader span{font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-2)}

/* =========================================================
   3. APP SHELL
   ========================================================= */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh;align-items:start}
.sidebar{grid-column:1;grid-row:1}
.main{grid-column:2;grid-row:1;min-height:100vh}
/* Backdrop hanya dipakai di layar kecil; di desktop jangan ikut jadi item grid */
.sidebar-backdrop{position:fixed;inset:0;display:none}

.sidebar{
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
  color:#cfdcec;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;padding:22px 16px;gap:6px;
  border-right:1px solid rgba(255,255,255,.1);
  z-index:120;
  transition:background .3s;
}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px}
.brand-mark{
  width:42px;height:42px;border-radius:13px;flex:none;
  background:linear-gradient(140deg,var(--gold),var(--navy-2));
  display:grid;place-items:center;color:#fff;font-size:1.3rem;
  box-shadow:0 6px 16px rgba(0,0,0,.3);
}
.brand strong{display:block;font-family:'Outfit',sans-serif;font-size:1.02rem;color:#fff;letter-spacing:.02em}
.brand small{display:block;font-size:.7rem;color:rgba(255,255,255,.7);letter-spacing:.12em;text-transform:uppercase}

.nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1;padding-right:2px}
.nav::-webkit-scrollbar{width:5px}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:8px}

/* PERBAIKAN GARIS: Menghapus border-left dan menggunakan padding-left kompensasi */
.nav-link{
  display:flex;align-items:center;gap:11px;
  padding:10px 13px;padding-left:16px;border-radius:11px;text-decoration:none;
  font-size:.865rem;font-weight:500;color:rgba(255,255,255,.8);
  border:none;transition:.22s;
}
.nav-link .icon{font-size:1.02rem;opacity:.85}
.nav-link:hover{background:rgba(255,255,255,.08);color:#fff}

/* PERBAIKAN GARIS: Menggunakan box-shadow inset sebagai pengganti border */
.nav-link.active{
  background:linear-gradient(90deg,rgba(255,255,255,.15),transparent);
  color:#fff;
  box-shadow:inset 3px 0 0 var(--gold);
}
.nav-link.active .icon{color:var(--gold-2);opacity:1}

.sidebar-foot{border-top:1px solid rgba(255,255,255,.1);padding-top:14px;display:grid;gap:7px}
.sidebar-foot .btn{width:100%;justify-content:flex-start;font-size:.82rem;color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.2)}
.sidebar-foot .btn:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.4)}
.sidebar-foot .btn.ghost{color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.22)}
.sidebar-foot .btn.ghost:hover{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.45)}
/* Tombol menu hanya relevan saat sidebar berupa drawer (layar kecil) */
#menuBtn{display:none}

/* ---------- Main / Topbar ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:12px;
  padding:11px 22px;background:var(--card);
  border-bottom:1px solid var(--border);
  box-shadow:var(--shadow-sm);
  backdrop-filter:blur(8px);
}
.topbar-title{font-family:'Outfit',sans-serif;font-weight:600;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.save-indicator{
  font-size:.72rem;font-weight:600;color:var(--green);
  display:flex;align-items:center;gap:5px;opacity:0;transition:.3s;letter-spacing:.04em;
}
.save-indicator.show{opacity:1}

/* ---------- Content ---------- */
.content{padding:22px;max-width:1180px;width:100%;margin:0 auto;flex:1}
section{scroll-margin-top:82px}

/* =========================================================
   4. BUTTONS
   ========================================================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:11px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-weight:600;font-size:.83rem;
  cursor:pointer;transition:.2s;white-space:nowrap;line-height:1.2;
  outline:none;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn .icon{font-size:1rem}

/* Perbaikan garis tepi */
.btn.primary{background:linear-gradient(135deg,var(--navy-2),var(--navy-3));color:#fff;border:none;padding:10px 16px}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--navy-2));color:#fff;border:none;padding:10px 16px}
.btn.danger{background:var(--red);color:#fff;border:none;padding:10px 16px}

.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{background:rgba(0,0,0,.05);color:var(--text)}
[data-theme="dark"] .btn.ghost:hover{background:rgba(255,255,255,.07)}

.btn.sm{padding:6px 11px;font-size:.76rem;border-radius:9px}
.btn.sm .icon{font-size:.9rem}
.btn.sm.primary, .btn.sm.gold, .btn.sm.danger { padding:7px 12px; }

.icon-btn{
  display:inline-grid;place-items:center;width:38px;height:38px;
  border-radius:11px;border:1px solid var(--border);background:var(--card);
  color:var(--text);cursor:pointer;transition:.2s;font-size:1.05rem;flex:none;
  outline:none;
}
.icon-btn:hover{background:var(--card-2);transform:translateY(-1px)}
.icon-btn .icon{vertical-align:0;display:block}
.icon-btn:focus-visible,.btn:focus-visible,.nav-link:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.icon-btn.sm{width:31px;height:31px;font-size:.85rem;border-radius:9px}

/* Language toggle button */
.lang-btn{
  display:inline-flex !important;
  width:auto !important;
  height:38px;
  padding:0 11px;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:.72rem;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  white-space:nowrap;
}

/* =========================================================
   5. HERO
   ========================================================= */
.hero{
  position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-3) 55%,var(--navy) 100%);
  border-radius:22px;padding:34px;margin-bottom:20px;
  display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;
  box-shadow:var(--shadow);
  transition:background .3s;
}
.hero::before{
  content:'';position:absolute;right:-70px;top:-70px;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.15),transparent 68%);pointer-events:none;
}
.hero::after{
  content:'';position:absolute;left:-90px;bottom:-110px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.05),transparent 70%);pointer-events:none;
}
.hero-photo-wrap{position:relative;z-index:1}
.hero-photo{
  width:152px;height:152px;border-radius:50%;overflow:hidden;position:relative;
  border:3px solid var(--gold);box-shadow:0 0 0 7px rgba(255,255,255,.1);
  background:rgba(0,0,0,.3);display:grid;place-items:center;
}
.hero-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.hero-photo .photo-empty{font-size:3.2rem;color:rgba(255,255,255,.3)}
.photo-edit{
  position:absolute;right:-2px;bottom:-2px;width:38px;height:38px;border-radius:50%;
  background:var(--gold);color:var(--navy);border:3px solid var(--navy);
  display:grid;place-items:center;cursor:pointer;font-size:1rem;transition:.2s;
}
.photo-edit:hover{transform:scale(1.08)}

.hero-text{position:relative;z-index:1;min-width:0}
.hero-eyebrow{
  font-size:.68rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--gold-2);font-weight:600;margin-bottom:6px;
}
.hero h1{
  font-size:clamp(1.5rem,3.4vw,2.35rem);color:#fff;letter-spacing:.01em;
  word-break:break-word;
}
.hero-rank{
  display:inline-flex;align-items:center;gap:8px;margin-top:9px;
  font-size:.9rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--gold-2);
}
.hero-rank::before{content:'';width:26px;height:2px;background:var(--gold);border-radius:2px}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 12px;border-radius:999px;font-size:.775rem;font-weight:500;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#eaf1f9;text-decoration:none;transition:.2s;max-width:100%;
}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.chip:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);color:#fff}
.chip .icon{color:var(--gold-2)}

/* =========================================================
   6. SECTIONS
   ========================================================= */
.section{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm);
  transition:background .3s,border-color .3s;
}
.section-head{display:flex;align-items:center;gap:13px;margin-bottom:18px;flex-wrap:wrap}
.section-icon{
  width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:var(--bg);color:var(--navy);font-size:1.15rem;
}
[data-theme="dark"] .section-icon{background:rgba(255,255,255,.05);color:var(--gold-2)}
.section-title{min-width:0}
.section-title h2{font-size:.98rem;letter-spacing:.09em;text-transform:uppercase;color:var(--navy)}
[data-theme="dark"] .section-title h2{color:var(--text)}
.section-title p{margin:2px 0 0;font-size:.78rem;color:var(--muted)}
.section-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px}
.info-item{
  display:flex;gap:11px;padding:13px 14px;border-radius:var(--radius-sm);
  background:var(--card-2);border:1px solid var(--border);
}
.info-item .ii-icon{
  width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:var(--bg);color:var(--navy);font-size:.95rem;
}
[data-theme="dark"] .info-item .ii-icon{background:rgba(255,255,255,.05);color:var(--gold-2)}
.info-item .ii-label{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.info-item .ii-value{font-size:.9rem;font-weight:600;word-break:break-word}
.info-item.full{grid-column:1/-1}

.summary-text{font-size:.95rem;line-height:1.85;color:var(--text);white-space:pre-wrap}
.empty{
  padding:34px 18px;text-align:center;color:var(--muted);font-size:.87rem;
  border:1.5px dashed var(--border);border-radius:var(--radius-sm);background:var(--card-2);
}
.empty .icon{font-size:1.9rem;display:block;margin:0 auto 10px;opacity:.45}

/* =========================================================
   7. TABLES
   ========================================================= */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm);-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:collapse;font-size:.86rem;min-width:760px}
table.data th{
  background:var(--card-2);text-align:left;padding:11px 14px;font-weight:700;
  font-size:.71rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;border-bottom:1px solid var(--border);
}
table.data td{padding:11px 14px;border-top:1px solid var(--border);vertical-align:top;word-break:break-word}
table.data tbody tr:first-child td{border-top:0}
table.data tbody tr{transition:background .15s}
table.data tbody tr:hover{background:var(--card-2)}
.cell-actions{display:flex;gap:6px;justify-content:flex-end}
.cell-strong{font-weight:600}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:.7rem;font-weight:700;letter-spacing:.03em;white-space:nowrap;
}
.badge-green{background:rgba(15,157,88,.14);color:#0f9d58}
.badge-amber{background:rgba(217,119,6,.16);color:#b45309}
.badge-red{background:rgba(220,38,38,.14);color:#dc2626}
[data-theme="dark"] .badge-green{color:#3ddc84}
[data-theme="dark"] .badge-amber{color:#fbbf24}
[data-theme="dark"] .badge-red{color:#f87171}
.cd{display:block;font-size:.68rem;color:var(--muted);margin-top:4px}

.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.search-box{position:relative;flex:1;min-width:190px}
.search-box .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.95rem}
.search-box input{
  width:100%;padding:9px 12px 9px 36px;border-radius:11px;border:1px solid var(--border);
  background:var(--card-2);color:var(--text);font-size:.83rem;font-family:inherit;
}
.search-box input:focus{outline:2px solid var(--gold);outline-offset:0}
select.mini{
  padding:9px 12px;border-radius:11px;border:1px solid var(--border);
  background:var(--card-2);color:var(--text);font-size:.8rem;font-family:inherit;cursor:pointer;
}

/* =========================================================
   8. TIMELINE
   ========================================================= */
.timeline{position:relative;padding-left:26px}
.timeline::before{
  content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;
  background:linear-gradient(180deg,var(--gold),transparent);border-radius:2px;
}
.tl-item{position:relative;margin-bottom:16px}
.tl-item:last-child{margin-bottom:0}
.tl-dot{
  position:absolute;left:-24px;top:16px;width:13px;height:13px;border-radius:50%;
  background:var(--gold);border:3px solid var(--card);box-shadow:0 0 0 2px var(--gold);
}
.tl-card{
  background:var(--card-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:16px 18px;
}
.tl-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.tl-head h3{font-size:.98rem}
.tl-company{font-size:.83rem;color:var(--navy);font-weight:600;margin:1px 0 0}
[data-theme="dark"] .tl-company{color:var(--gold-2)}
.pill{
  margin-left:auto;padding:4px 11px;border-radius:999px;font-size:.7rem;font-weight:700;
  background:var(--bg);color:var(--navy);white-space:nowrap;
}
[data-theme="dark"] .pill{background:rgba(255,255,255,.1);color:var(--gold-2)}
.tl-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tl-meta span{
  font-size:.72rem;padding:3px 9px;border-radius:7px;
  background:var(--card);border:1px solid var(--border);color:var(--muted);
}
.tl-desc{margin:11px 0 0;font-size:.85rem;color:var(--muted);white-space:pre-wrap;line-height:1.7}
.tl-actions{display:flex;gap:6px;margin-top:12px;justify-content:flex-end}

/* =========================================================
   9. CONTACT CARDS & THEME SWATCH
   ========================================================= */
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px}
.contact-card{
  display:flex;align-items:center;gap:13px;padding:16px;border-radius:var(--radius-sm);
  background:var(--card-2);border:1px solid var(--border);text-decoration:none;
  color:var(--text);transition:.22s;
}
a.contact-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--gold)}
.cc-icon{
  width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--navy-2),var(--navy-3));color:var(--gold-2);font-size:1.15rem;
}
.cc-icon.wa{background:linear-gradient(140deg,#128C7E,#25D366);color:#fff}
.cc-icon.mail{background:linear-gradient(140deg,#1b4066,#2a6ba8);color:#fff}
.cc-icon.ig{background:linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);color:#fff}
.contact-card small{display:block;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.contact-card strong{display:block;font-size:.87rem;word-break:break-word;font-weight:600}

/* Theme Grid - Perbaikan Garis Pojok */
.theme-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px}
.theme-swatch{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px;border-radius:12px;
  background:var(--card-2);cursor:pointer;transition:.2s;
  border:none;
  box-shadow: inset 0 0 0 1px var(--border), 0 1px 3px rgba(0,0,0,0.02);
}
.theme-swatch:hover{
  transform:translateY(-2px);
  box-shadow: inset 0 0 0 1px var(--gold), var(--shadow-sm);
}
.theme-swatch.active{
  box-shadow: inset 0 0 0 2px var(--gold), 0 2px 8px rgba(201,162,39,.15);
}
.swatch-colors{
  width:100%;height:40px;border-radius:8px;position:relative;overflow:hidden;
}
.theme-swatch span{font-size:.75rem;font-weight:600;color:var(--text);text-align:center}

/* =========================================================
   10. ALERT
   ========================================================= */
.alert-banner{
  display:flex;gap:13px;align-items:flex-start;padding:15px 18px;border-radius:var(--radius-sm);
  background:rgba(217,119,6,.10);border:1px solid rgba(217,119,6,.35);
  margin-bottom:20px;font-size:.84rem;
}
.alert-banner.danger{background:rgba(220,38,38,.09);border-color:rgba(220,38,38,.35)}
.alert-banner .icon{font-size:1.3rem;color:var(--amber);flex:none;margin-top:1px}
.alert-banner.danger .icon{color:var(--red)}
.alert-banner strong{display:block;margin-bottom:3px}
.alert-banner ul{margin:5px 0 0;padding-left:18px}

/* =========================================================
   11. MODAL
   ========================================================= */
#modalRoot{position:fixed;inset:0;z-index:500;display:none}
#modalRoot.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(7,15,25,.62);backdrop-filter:blur(3px);animation:fadeIn .22s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  position:relative;z-index:1;width:min(680px,calc(100% - 28px));max-height:88vh;
  margin:6vh auto;display:flex;flex-direction:column;
  background:var(--card);border-radius:20px;border:1px solid var(--border);
  box-shadow:0 30px 70px rgba(0,0,0,.4);animation:popIn .26s cubic-bezier(.2,.9,.3,1.2);
  overflow:hidden;
}
@keyframes popIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{
  display:flex;align-items:center;gap:12px;padding:17px 20px;
  border-bottom:1px solid var(--border);background:var(--card-2);flex:none;
}
.modal-head h3{font-size:1rem;flex:1}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{
  display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;
  border-top:1px solid var(--border);background:var(--card-2);flex:none;
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:.76rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field label .req{color:var(--red);margin-left:2px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--border);
  background:var(--card-2);color:var(--text);font-family:inherit;font-size:.87rem;
  transition:.18s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.18);
}
.field textarea{resize:vertical;min-height:78px;line-height:1.6}
.field input[data-date-input]{letter-spacing:.03em;font-variant-numeric:tabular-nums}
.confirm-msg{font-size:.92rem;line-height:1.75;margin:0}

.photo-editor{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:start}
.photo-preview{
  width:200px;height:240px;border-radius:16px;overflow:hidden;border:2px solid var(--gold);
  background:var(--card-2);display:grid;place-items:center;
}
.photo-preview img{width:100%;height:100%;object-fit:cover;display:block}
.photo-controls{display:flex;flex-direction:column;gap:13px}
.upload-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px;border-radius:11px;cursor:pointer;font-weight:700;font-size:.84rem;
  background:linear-gradient(135deg,var(--navy-2),var(--navy-3));color:#fff;
}
input[type="range"]{
  width:100%;-webkit-appearance:none;height:6px;border-radius:6px;
  background:var(--border);outline:none;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--gold);cursor:pointer;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);
}
input[type="range"]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;background:var(--gold);
  cursor:pointer;border:2px solid #fff;
}

/* =========================================================
   12. TOAST
   ========================================================= */
#toasts{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:900;
  display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none;
  width:max-content;max-width:calc(100% - 30px);
}
.toast{
  display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:12px;
  background:var(--navy);color:#fff;font-size:.83rem;font-weight:600;
  box-shadow:0 12px 30px rgba(0,0,0,.3);animation:toastIn .3s cubic-bezier(.2,.9,.3,1.3);
  transition:opacity .3s,transform .3s;
}
.toast .icon{font-size:1.05rem;color:var(--gold-2)}
.toast.err{background:var(--red)}
.toast.err .icon{color:#fca5a5}
.toast.info{background:var(--navy-2)}
.toast.info .icon{color:var(--gold-2)}
.toast.out{opacity:0;transform:translateY(12px)}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}

/* =========================================================
   13. BACK TO TOP
   ========================================================= */
.back-top{
  position:fixed;right:20px;bottom:20px;z-index:200;
  width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(140deg,var(--gold),var(--navy-2));color:#fff;
  display:grid;place-items:center;font-size:1.15rem;
  box-shadow:0 10px 24px rgba(0,0,0,.3);
  opacity:0;visibility:hidden;transform:translateY(14px);transition:.3s;
}
.back-top.show{opacity:1;visibility:visible;transform:none}

/* =========================================================
   14. EDIT MODE VISIBILITY
   ========================================================= */
.edit-only{display:none !important}
body.edit-on .edit-only{display:inline-flex !important}
body.edit-on .edit-only.block{display:flex !important}

body.edit-on #editToggle{
  background:linear-gradient(135deg,var(--gold),var(--navy-2));
  color:#fff;
  border:none;
  padding:10px 16px;
}

body:not(.edit-on) th.th-actions,
body:not(.edit-on) td.col-action,
body:not(.edit-on) .tl-actions {
  display: none !important;
}

/* =========================================================
   15. APP FOOTER
   ========================================================= */
.app-foot{
  text-align:center;padding:22px;font-size:.75rem;color:var(--muted);
  border-top:1px solid var(--border);letter-spacing:.04em;
}

/* =========================================================
   16. RESPONSIVE
   ========================================================= */
@media (max-width:1024px){
  .app{grid-template-columns:minmax(0,1fr)}
  .main{grid-column:1;min-height:0}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:280px;
    transform:translateX(-100%);transition:transform .3s cubic-bezier(.3,.9,.4,1);
    box-shadow:none;height:100vh;visibility:hidden;
    transition:transform .3s cubic-bezier(.3,.9,.4,1),visibility 0s .3s,box-shadow .3s;
  }
  .sidebar.open{transform:none;visibility:visible;box-shadow:0 0 50px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.3,.9,.4,1),visibility 0s,box-shadow .3s}
  .topbar-title{display:none}
  .topbar-actions{flex-wrap:nowrap}
  .topbar-actions .btn span{white-space:nowrap}
  #menuBtn{display:inline-grid;place-items:center}
  .sidebar-backdrop{
    display:block;position:fixed;inset:0;background:rgba(7,15,25,.55);z-index:110;
    opacity:0;visibility:hidden;transition:.3s;
  }
  .sidebar-backdrop.show{opacity:1;visibility:visible}
  .content{padding:16px}
  .hero{padding:26px}
}

@media (max-width:760px){
  .topbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    padding:10px 12px;
  }
  .topbar-title{display:none}
  .save-indicator{display:none}
  .topbar-actions{display:contents}

  #menuBtn{order:1}
  #devBtn{order:2;margin-left:auto;width:38px;height:38px}
  #langBtn{order:3;height:38px;padding:0 9px;font-size:.7rem;}
  #colorThemeBtn{order:4;width:38px;height:38px}
  #themeBtn{order:5;width:38px;height:38px}

  .topbar::after{
    content:'';
    order:6;
    flex-basis:100%;
    height:0;
  }

  #editToggle{order:7;flex:1 1 0;min-width:0}
  .topbar-actions > [data-action="print"]{order:8;flex:1 1 0;min-width:0}
  .topbar-actions > [data-action="reset"]{order:9;flex:1 1 0;min-width:0}

  .topbar-actions .btn{
    padding:9px 6px;
    font-size:.74rem;
    gap:5px;
    justify-content:center;
  }
  .topbar-actions .btn span{
    display:inline;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .hero{grid-template-columns:1fr;justify-items:center;text-align:center;gap:20px;padding:26px 20px}
  .hero-rank{justify-content:center}
  .hero-chips{justify-content:center}
  .hero-photo{width:128px;height:128px}
  .section{padding:18px}
  .form-grid{grid-template-columns:1fr}
  .photo-editor{grid-template-columns:1fr;justify-items:center}
  .photo-preview{width:170px;height:200px}
  .section-tools{margin-left:0;width:100%}
  .section-head{gap:10px}
  .theme-grid{grid-template-columns:repeat(2, 1fr)}

  table.data{min-width:0}
  table.data thead{display:none}
  table.data tr{
    display:block;border:1px solid var(--border);border-radius:12px;
    margin-bottom:10px;padding:4px;background:var(--card);
  }
  table.data tbody tr:first-child td{border-top:0}
  table.data td{
    display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
    border:0;padding:8px 10px;border-bottom:1px dashed var(--border);text-align:right;
  }
  table.data td:last-child{border-bottom:0}
  table.data td::before{
    content:attr(data-label);font-weight:700;color:var(--muted);
    font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;flex:none;text-align:left;
    padding-top:2px;
  }
  table.data td.cell-actions{justify-content:flex-end}
  .timeline{padding-left:20px}
  .tl-dot{left:-19px}
}

@media (max-width:420px){
  .topbar{padding:8px 10px;gap:6px}
  .topbar-actions .btn{padding:8px 5px;font-size:.7rem;gap:4px}
  .topbar-actions .btn .icon{font-size:.85rem}
  #menuBtn,#themeBtn,#devBtn,#colorThemeBtn{width:38px;height:38px}
  #langBtn{height:38px;padding:0 7px;font-size:.66rem;}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
  .icon-btn:hover{transform:none}
}

/* =========================================================
   17. PRINT (INTEGRASI TEMA)
   ========================================================= */
@media print{
  @page{size:A4 portrait;margin:12mm 11mm 13mm}

  html[data-theme],:root{
    --bg:#ffffff;--card:#ffffff;--card-2:#ffffff;--text:#0f1c2e;
    --muted:#4a5a6e;--border:#b9c6d6;--shadow:none;--shadow-sm:none;
  }
  html,body{background:#fff !important;color:#0f1c2e !important;font-size:10pt !important}
  body{line-height:1.45}

  .sidebar,.sidebar-backdrop,.topbar,.back-top,#toasts,#preloader,
  .no-print,#modalRoot{display:none !important}

  body .edit-only,
  body.edit-on .edit-only{display:none !important}

  .empty{display:none !important}
  section.is-empty{display:none !important}
  .v-empty{display:none !important}
  .info-item.item-empty{display:none !important}
  .contact-card.is-placeholder{display:none !important}

  table.data th.th-actions{display:none !important}
  table.data td.col-action,
  table.data td.cell-actions{display:none !important}

  .app{display:block !important}
  .main{display:block !important}
  .content{padding:0 !important;max-width:none !important;margin:0 !important}

  .hero{
    display:grid !important;grid-template-columns:26mm 1fr;gap:6mm;align-items:center;
    background:var(--navy) !important;color:#fff !important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    border-radius:6px !important;padding:6mm !important;margin:0 0 4mm !important;
    box-shadow:none !important;page-break-inside:avoid;
  }
  .hero::before,.hero::after{display:none !important}
  /* Cetak selalu rata kiri, walau dicetak dari HP (lebar = 760px memakai gaya mobile yang rata tengah) */
  .hero{justify-items:start !important;text-align:left !important}
  .hero-text{text-align:left !important}
  .hero-rank{justify-content:flex-start !important}
  .hero-chips{justify-content:flex-start !important}
  .hero-photo{width:26mm !important;height:26mm !important;border-width:2px !important;box-shadow:none !important}
  .hero-photo .photo-empty{font-size:2rem}
  .hero h1{font-size:16pt !important;color:#fff !important}
  .hero-rank{font-size:8.5pt !important;color:var(--gold-2) !important;margin-top:1mm !important}
  .hero-eyebrow{font-size:6.5pt !important;color:var(--gold-2) !important;margin-bottom:1mm !important}
  .hero-chips{gap:2mm !important;margin-top:2.5mm !important}
  .chip{font-size:7.2pt !important;padding:1mm 2.4mm !important;background:rgba(255,255,255,.15) !important;border-color:rgba(255,255,255,.3) !important;color:#eaf1f9 !important}
  .photo-edit{display:none !important}

  .section{
    border:1px solid #c3cede !important;border-radius:4px !important;
    padding:3.4mm 4mm !important;margin:0 0 3mm !important;
    box-shadow:none !important;background:#fff !important;
    break-inside:avoid;page-break-inside:avoid;
  }
  .section-head{margin-bottom:2.4mm !important;gap:2.5mm !important}
  .section-icon{
    width:7mm !important;height:7mm !important;border-radius:2mm !important;
    font-size:9pt !important;background:var(--bg) !important;color:var(--navy) !important;
  }
  .section-title h2{font-size:9.5pt !important;letter-spacing:.06em !important;color:var(--navy) !important}
  .section-title p{font-size:7pt !important;margin-top:0 !important;color:#4a5a6e !important}

  .info-grid{grid-template-columns:1fr 1fr !important;gap:2mm !important}
  .info-item{padding:2mm 2.6mm !important;border:1px solid #dfe6ee !important;background:#fafcfe !important;border-radius:2mm !important}
  .info-item .ii-icon{display:none !important}
  .info-item .ii-label{font-size:6.5pt !important}
  .info-item .ii-value{font-size:8.3pt !important}
  .summary-text{font-size:8.8pt !important;line-height:1.6 !important}

  .table-wrap{overflow:visible !important;border:1px solid #c3cede !important;border-radius:3px !important}
  table.data{min-width:0 !important;width:100% !important;font-size:7.6pt !important}
  table.data thead{display:table-header-group !important}
  table.data tr{display:table-row !important;border:0 !important;margin:0 !important;padding:0 !important;background:transparent !important}
  table.data th{
    display:table-cell !important;padding:1.6mm 2mm !important;font-size:6.6pt !important;
    background:#eef2f8 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;
    border-bottom:1px solid #b9c6d6 !important;color:#33455c !important;
  }
  table.data td{
    display:table-cell !important;padding:1.6mm 2mm !important;
    border-bottom:1px solid #dde5ef !important;border-top:0 !important;text-align:left !important;
  }
  table.data td::before{display:none !important}
  table.data tbody tr{page-break-inside:avoid}

  .badge{font-size:6.4pt !important;padding:.6mm 1.8mm !important;border:1px solid currentColor !important;background:transparent !important}
  .cd{font-size:6pt !important;margin-top:.4mm !important}

  .timeline{padding-left:5mm !important}
  .timeline::before{width:1px !important;left:1.2mm !important;background:var(--gold) !important}
  .tl-dot{left:-5mm !important;width:2.6mm !important;height:2.6mm !important;border-width:1px !important;background:var(--gold) !important;border-color:#fff !important}
  .tl-card{background:#fafcfe !important;border:1px solid #dfe6ee !important;padding:2.4mm 3mm !important;border-radius:2mm !important;page-break-inside:avoid}
  .tl-head h3{font-size:8.8pt !important}
  .tl-company{font-size:8pt !important;color:var(--navy) !important}
  .pill{font-size:6.6pt !important;padding:.6mm 2mm !important;background:#eef2f8 !important;color:var(--navy) !important;border:1px solid #cfdae7 !important}
  .tl-meta span{font-size:6.6pt !important;padding:.5mm 1.6mm !important;background:#fff !important;border:1px solid #dfe6ee !important}
  .tl-desc{font-size:7.6pt !important;line-height:1.5 !important;margin-top:1.5mm !important}
  .tl-actions{display:none !important}
  .tl-item{margin-bottom:2.5mm !important}

  .contact-grid{grid-template-columns:1fr 1fr !important;gap:2mm !important}
  .contact-card{padding:2.4mm 3mm !important;background:#fafcfe !important;border:1px solid #dfe6ee !important;border-radius:2mm !important}
  .cc-icon{width:8mm !important;height:8mm !important;border-radius:2mm !important;font-size:9pt !important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .contact-card small{font-size:6.2pt !important}
  .contact-card strong{font-size:8pt !important}

  .alert-banner{display:none !important}
  .toolbar{display:none !important}
  .app-foot{display:none !important}
  .timeline,.section:last-child{margin-bottom:0 !important}
  a{text-decoration:none !important;color:inherit !important}
}

/* ---------- 3. TANGGAL ---------- */
function isoToDMY(iso){
  if(!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : String(iso);
}
function dmyToISO(dmy){
  if(!dmy) return '';
  const m = String(dmy).trim().match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if(!m) return null;
  const d = parseInt(m[1],10), mo = parseInt(m[2],10), y = parseInt(m[3],10);
  if(mo1||mo>12||d1||d>31) return null;
  const dt = new Date(y, mo-1, d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d) return null;
  return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function fmtDate(v){
  if(!v) return '—';
  const d = new Date(String(v).length === 10 ? v + 'T00:00:00' : v);
  if(isNaN(d.getTime())) return '—';
  const M = UI.lang === 'en' ? MONTHS_EN : MONTHS_ID;
  return `${String(d.getDate()).padStart(2,'0')} ${M[d.getMonth()]} ${d.getFullYear()}`;
}
function daysLeft(exp){
  if(!exp) return null;
  const d = new Date(exp + 'T00:00:00');
  if(isNaN(d.getTime())) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d - today) / DAY);
}
function certStatus(c){
  const d = daysLeft(c.expiryDate);
  if(d === null) return null;
  if(d  0)   return { key:'expired', label:t('status_expired'), cls:'badge-red',   days:d };
  if(d = 90) return { key:'soon',    label:t('status_soon'),    cls:'badge-amber', days:d };
  return           { key:'active',  label:t('status_active'),  cls:'badge-green', days:d };
}
function statusCell(item){
  const s = certStatus(item);
  if(!s) return DASH;
  const extra = s.days  0
    ? t('status_days_ago').replace('{n}', Math.abs(s.days))
    : t('status_days_left').replace('{n}', s.days);
  return `span class="badge ${s.cls}">${s.label}/span>small class="cd">${extra}/small>`;
}
function durationDays(a, b){
  if(!a || !b) return null;
  const d1 = new Date(a + 'T00:00:00');
  const d2 = new Date(b + 'T00:00:00');
  if(isNaN(d1) || isNaN(d2) || d2  d1) return null;
  return Math.round((d2 - d1) / DAY) + 1;
}
function durationLabel(a, b){
  const d = durationDays(a, b);
  if(d === null) return '—';
  const m = Math.round(d / 30.44 * 10) / 10;
  if(UI.lang === 'en') return `${m} months · ${d} days`;
  return `${m} bulan · ${d} hari`;
}
function waNumber(phone){
  if(!phone) return '';
  let n = String(phone).replace(/[^\d+]/g, '').replace(/^\+/, '');
  if(n.startsWith('0')) n = '62' + n.slice(1);
  if(n.startsWith('620')) n = '62' + n.slice(3);
  return n;
}

const DASH = 'span class="v-empty">—/span>';
function tv(v){
  const s = String(v ?? '').trim();
  return (!s || s === '—') ? DASH : esc(s);
}
function tvDate(v){
  if(!v) return DASH;
  const f = fmtDate(v);
  return f === '—' ? DASH : esc(f);
}
function tvDur(a, b){
  const d = durationDays(a, b);
  return d === null ? DASH : esc(durationLabel(a, b));
}

function mergeData(saved){
  const base = blankData();
  if(!saved || typeof saved !== 'object') return base;
  base.profile = Object.assign({}, base.profile, saved.profile || {});
  base.documents      = Array.isArray(saved.documents)      ? saved.documents.map(x => Object.assign({ id: uid() }, x))      : base.documents;
  base.certificates   = Array.isArray(saved.certificates)   ? saved.certificates.map(x => Object.assign({ id: uid() }, x))   : [];
  base.seaService     = Array.isArray(saved.seaService)     ? saved.seaService.map(x => Object.assign({ id: uid() }, x))     : [];
  base.workExperience = Array.isArray(saved.workExperience) ? saved.workExperience.map(x => Object.assign({ id: uid() }, x)) : [];
  return base;
}

    return mergeData(JSON.parse(raw));

let modalSaveHandler = null;
function openModal({ title, bodyHTML, saveLabel = 'Save', onSave = null, danger = false, cancelLabel = null }){
  const root = $('#modalRoot');
  root.innerHTML = `
    div class="modal-backdrop" data-close>/div>
    div class="modal" role="dialog" aria-modal="true">
      div class="modal-head">

        ${onSave ? `button class="btn ${danger ? 'danger' : 'primary'}" id="modalSave">${icon('save')}${esc(saveLabel)}/button>` : ''}
      /div>
    /div>`;
  root.classList.add('open');
  document.body.style.overflow = 'hidden';
  root.querySelectorAll('[data-close]').forEach(b => { b.onclick = closeModal; });
  modalSaveHandler = onSave;
  const btn = root.querySelector('#modalSave');
  if(btn) btn.onclick = () => {
    if(modalSaveHandler && modalSaveHandler() === false) return;
    closeModal();
  };
  root.onkeydown = e => {
    if(e.key === 'Escape') closeModal();
    if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && btn){ e.preventDefault(); btn.click(); }
  };
  setTimeout(() => {
    const first = root.querySelector('.modal-body input:not([type=range]):not([type=file]), .modal-body select, .modal-body textarea');
    if(first) first.focus();
  }, 90);
}
function closeModal(){
  const root = $('#modalRoot');
  root.classList.remove('open');
  root.innerHTML = '';
  root.onkeydown = null;
  modalSaveHandler = null;
  document.body.style.overflow = '';
}

/* ---------- 6. FORM BUILDER ---------- */
function fieldHTML(f, value){
  const id = 'fld_' + f.key;
  const v  = value == null ? '' : value;
  const label = t(f.labelKey);
  const ph = f.phKey ? t(f.phKey) : (f.ph || '');
  let input;

  if(f.type === 'textarea'){
    input = `textarea id="${id}" name="${esc(f.key)}" rows="${f.rows || 3}" placeholder="${esc(ph)}">${esc(v)}/textarea>`;
  } else if(f.type === 'select'){
    const opts = (f.options || []).map(o => {
      const val = o.v !== undefined ? o.v : o;
      const lbl = o.l ? t(o.l) : o;
      return `option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(lbl)}/option>`;
    }).join('');
    input = `select id="${id}" name="${esc(f.key)}">${opts}/select>`;
  } else if(f.type === 'date'){
    input = `input id="${id}" name="${esc(f.key)}" type="text" inputmode="numeric"
             value="${esc(isoToDMY(v))}" placeholder="dd/mm/yyyy" maxlength="10"
             ${f.required ? 'required' : ''} autocomplete="off" data-date-input="1">`;
  } else {
    input = `input id="${id}" name="${esc(f.key)}" type="${f.type || 'text'}" value="${esc(v)}"
             placeholder="${esc(ph)}"${f.min ? ` min="${esc(f.min)}"` : ''}
             ${f.max ? ` max="${esc(f.max)}"` : ''}${f.step ? ` step="${esc(f.step)}"` : ''}
             ${f.required ? ' required' : ''} autocomplete="off">`;
  }
  return `div class="field ${f.full ? 'full' : ''}">
            label for="${id}">${esc(label)}${f.required ? 'span class="req">*/span>' : ''}/label>
            ${input}
          /div>`;
}

function openFormModal(title, fields, values, onSubmit, opts = {}){
  const html = `form id="modalForm" class="form-grid" novalidate autocomplete="off">
      ${fields.map(f => fieldHTML(f, values[f.key])).join('')}
    /form>`;

  openModal({
    title,
    bodyHTML: html,
    saveLabel: opts.saveLabel || t('btn_save'),
    onSave: () => {
      const form = $('#modalForm');
      if(!form) return false;
      const data = {};

      for(const f of fields){
        const elm = form.elements[f.key];
        const raw = elm ? String(elm.value).trim() : '';
        const label = t(f.labelKey);

        if(f.type === 'date'){
          if(!raw){
            if(f.required){
              toast(t('toast_required').replace('{label}', label), 'err');
              if(elm) elm.focus();
              return false;
            }
            data[f.key] = '';
            continue;
          }
          const iso = dmyToISO(raw);
          if(iso === null){
            toast(t('toast_date_invalid').replace('{label}', label), 'err');
            if(elm) elm.focus();
            return false;
          }
          data[f.key] = iso;
          continue;
        }

        data[f.key] = raw;

        if(f.required && !raw){
          toast(t('toast_required').replace('{label}', label), 'err');
          if(elm) elm.focus();
          return false;
        }
        if(f.type === 'email' && raw && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(raw)){
          toast(t('toast_email_invalid'), 'err');
          if(elm) elm.focus();
          return false;
        }
        if(f.type === 'tel' && raw && !/^[0-9+\-\s()]{7,20}$/.test(raw)){
          toast(t('toast_phone_invalid'), 'err');
          if(elm) elm.focus();
          return false;
        }
      }
      onSubmit(data);
      return true;
    }
  });
}

/* ---------- 9. RENDER ALERTS ---------- */
function renderAlerts(){
  const zone = $('#alertZone');
  const soon = [], expired = [];
  DATA.certificates.forEach(c => {
    const s = certStatus(c);
    if(!s) return;
    if(s.key === 'expired') expired.push(c);
    else if(s.key === 'soon') soon.push(c);
  });
  if(!soon.length && !expired.length){ zone.innerHTML = ''; return; }

  let html = '';
  if(expired.length){
    html += `div class="alert-banner danger no-print">
      ${icon('alert')}
      div>
        strong>${esc(t('alert_expired_title').replace('{n}', expired.length))}/strong>
        ul>${expired.map(c => `li>${esc(c.name || t('alert_no_name'))} — ${fmtDate(c.expiryDate)}/li>`).join('')}/ul>
      /div>
    /div>`;
  }
  if(soon.length){
    html += `div class="alert-banner no-print">
      ${icon('clock')}
      div>
        strong>${esc(t('alert_soon_title').replace('{n}', soon.length))}/strong>
        ul>${soon.map(c => `li>${esc(c.name || t('alert_no_name'))} — ${t('status_days_left').replace('{n}', daysLeft(c.expiryDate))} (${fmtDate(c.expiryDate)})/li>`).join('')}/ul>
      /div>
    /div>`;
  }
  zone.innerHTML = html;
}

const CERT_META = {
  coc:   { id:'coc',   icon:'award',  titleKey:'sec_coc_title',   subKey:'sec_coc_sub',   emptyKey:'empty_coc' },
  cop:   { id:'cop',   icon:'shield', titleKey:'sec_cop_title',   subKey:'sec_cop_sub',   emptyKey:'empty_cop' },
  other: { id:'other', icon:'award',  titleKey:'sec_other_title', subKey:'sec_other_sub', emptyKey:'empty_other' }

function getCerts(cat){
  let list = DATA.certificates.filter(c => c.category === cat);
  const s = UI.sort[cat] || 'default';
  if(s === 'expiry')      list.sort((a,b) => (a.expiryDate || '9999-99-99').localeCompare(b.expiryDate || '9999-99-99'));
  else if(s === 'name')   list.sort((a,b) => (a.name || '').localeCompare(b.name || '', 'id'));
  else if(s === 'issued') list.sort((a,b) => (b.issueDate || '').localeCompare(a.issueDate || ''));
  return list;
}

/* ---------- 22. PHOTO EDITOR ---------- */
function resizeImage(file, maxSize = 720){
  return new Promise((resolve, reject) => {
    if(!file.type.startsWith('image/')){ reject(new Error(t('photo_not_image'))); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const ratio = Math.min(1, maxSize / Math.max(w, h));
        w = Math.max(1, Math.round(w * ratio));
        h = Math.max(1, Math.round(h * ratio));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.88));
      };
      img.onerror = () => reject(new Error(t('photo_read_err')));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error(t('photo_file_err')));
    reader.readAsDataURL(file);
  });
}

function exportJSON(){
  try{
    const name = (DATA.profile.name || 'Seafarer').replace(/[^\w\-]+/g, '_');
    const stamp = new Date().toISOString().slice(0, 10);
    const blob = new Blob([JSON.stringify(DATA, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `CV-${name}-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast(t('toast_backup_ok'));
  }catch(e){
    toast(t('toast_backup_err'), 'err');
  }
}
function importJSON(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || typeof parsed !== 'object' || !parsed.profile){
        toast(t('toast_import_invalid'), 'err');
        return;
      }
      confirmModal(t('modal_import_title'), t('modal_import_msg'), () => {
        DATA = mergeData(parsed);
        save();
        renderAll();
        toast(t('toast_import_ok'));
      });
    }catch(err){
      toast(t('toast_import_err'), 'err');
    }
  };
  reader.readAsText(file);
}

  confirmModal(t('modal_reset_title'), t('modal_reset_msg'), () => {

  const cat = actionEl.dataset.cat;
  const label = actionEl.dataset.label || '';

  switch(action){

      $('#sidebarBackdrop').classList.toggle('show');
      $('#menuBtn').setAttribute('aria-expanded', $('#sidebar').classList.contains('open'));
      break;

      break;

    case 'color-selector':
      openColorThemeModal();
      break;

    case 'select-color':
      const newColor = actionEl.dataset.color;
      if(newColor) {
        UI.color = newColor;
        saveUI();
        applyColorTheme();
        closeModal();
        toast(t('toast_color_changed'));
      }
      break;

    case 'toggle-lang':
      UI.lang = UI.lang === 'en' ? 'id' : 'en';
      saveUI();
      applyLang();
      renderAll();
      toast(t(UI.lang === 'en' ? 'toast_lang_en' : 'toast_lang_id'), 'info');

      saveUI(); applyTheme(); applyColorTheme();
      toast(t(UI.theme === 'dark' ? 'toast_theme_dark' : 'toast_theme_light'), 'info');
      break;

    case 'toggle-edit':
      UI.edit = !UI.edit; saveUI(); applyEditMode();
      toast(UI.edit ? t('toast_edit_on') : t('toast_preview_on'), 'info');
      break;

    case 'print': doPrint(); break;

    case 'back-top':
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;

    case 'import': $('#importInput').click(); break;
    case 'reset':  resetData(); break;

    let out = v.slice(0, 2);
    if(v.length > 2) out += '/' + v.slice(2, 4);

  section.querySelectorAll('tbody tr').forEach(tr => {

  const inp = e.target.closest('[data-date-input]');
  if(!inp) return;
  const cb = e.clipboardData || window.clipboardData;
  if(!cb) return;
  const text = (cb.getData('text') || '').trim();
  const iso = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(iso){
    e.preventDefault();
    inp.value = `${iso[3]}/${iso[2]}/${iso[1]}`;

      if(el && el.offsetParent !== null && (el.getBoundingClientRect().top + window.scrollY) = pos) current = id;
    });
    /* Jika sudah mentok di dasar halaman, section terakhir (Kontak) dianggap aktif,
       karena section pendek tidak akan pernah mencapai batas atas viewport. */
    const atBottom = (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 4);
    if(atBottom && window.scrollY > 0){
      for(let i = NAV_IDS.length - 1; i >= 0; i--){
        const el = document.getElementById(NAV_IDS[i]);
        if(el && el.offsetParent !== null){ current = NAV_IDS[i]; break; }
      }
    }
    setActiveNav(current);
    const bt = $('#backTop');
    if(window.scrollY > 380) bt.classList.add('show');
    else bt.classList.remove('show');
    scrollTick = false;
  });
}
window.addEventListener('scroll', onScroll, { passive:true });

(function init(){

  setTimeout(() => {

    if(pl) pl.classList.add('hide');
  }, 1600);

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && $('#sidebar').classList.contains('open')){
      $('#sidebar').classList.remove('open');

    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'e'){
      e.preventDefault();
      UI.edit = !UI.edit; saveUI(); applyEditMode();
      toast(UI.edit ? t('toast_edit_on') : t('toast_preview_on'), 'info');
    }

})();

/* ============ RESET & BASE ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f2744; --navy-2:#1a3a5c; --navy-3:#0b1c33;

  --accent:#c9a961;
  --bg:#eef1f6; --panel:#ffffff; --panel-2:#f8fafc;
  --text:#0f172a; --text-2:#334155; --muted:#64748b;
  --border:#e2e8f0; --border-2:#cbd5e1;
  --ok:#059669; --warn:#d97706; --danger:#dc2626;
  --shadow-sm:0 1px 2px rgba(15,39,68,.06);

}
[data-theme="dark"]{

  --text:#e8eef6; --text-2:#c3d0de; --muted:#8a9cb0;

  --shadow-lg:0 20px 50px rgba(0,0,0,.6);
}
html,body{height:100%}
body{
  font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
  transition:background .25s ease,color .25s ease;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
svg{display:block;flex-shrink:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:10px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}

/* ============ LOADER ============ */
#loader{
  position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;
  background:linear-gradient(140deg,#0f2744,#0b1c33 60%,#12314f);
  color:#fff;transition:opacity .45s ease,visibility .45s ease;
}
#loader.hide{opacity:0;visibility:hidden}
.spinner{
  width:44px;height:44px;border-radius:50%;
  border:3px solid rgba(201,169,97,.25);border-top-color:var(--gold);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loader .l-title{font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--gold);text-transform:uppercase}
#loader .l-sub{font-size:12px;color:#8fa6c0}

/* ============ HEADER ============ */
.app-header{
  position:sticky;top:0;z-index:120;height:var(--header-h);
  display:flex;align-items:center;gap:10px;padding:0 14px;
  background:linear-gradient(100deg,#0f2744,#14324f);
  border-bottom:1px solid rgba(201,169,97,.28);
  box-shadow:0 2px 18px rgba(0,0,0,.22);
  color:#fff;
}
.brand{display:flex;align-items:center;gap:9px;margin-right:6px;flex-shrink:0}
.brand-mark{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--gold),#a8863f);
  color:#0f2744;font-weight:800;font-size:15px;
  box-shadow:0 3px 10px rgba(201,169,97,.45);
}
.brand-name{font-weight:800;font-size:15px;letter-spacing:.04em;line-height:1}
.brand-name span{color:var(--gold)}
.brand-tag{font-size:9px;letter-spacing:.18em;color:#8fa6c0;text-transform:uppercase;margin-top:2px}

.hdr-seg{
  display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:3px;gap:2px;
  border:1px solid rgba(255,255,255,.1);
}
.hdr-seg button{
  display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:6px;
  font-size:12px;font-weight:600;color:#b9cade;transition:.18s;
}
.hdr-seg button.active{background:var(--gold);color:#0f2744;box-shadow:0 2px 8px rgba(201,169,97,.4)}
.hdr-seg button:not(.active):hover{background:rgba(255,255,255,.1);color:#fff}

.hdr-spacer{flex:1}
.hdr-btn{
  display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;
  font-size:12px;font-weight:600;color:#cfdcea;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  transition:.18s;white-space:nowrap;
}
.hdr-btn:hover{background:rgba(255,255,255,.15);color:#fff;transform:translateY(-1px)}
.hdr-btn.gold{background:linear-gradient(140deg,var(--gold),#b9963f);color:#0f2744;border-color:transparent;box-shadow:0 3px 12px rgba(201,169,97,.35)}
.hdr-btn.gold:hover{filter:brightness(1.08)}
.save-dot{
  display:flex;align-items:center;gap:5px;font-size:11px;color:#8fa6c0;
  padding:0 8px;transition:color .3s;
}
.save-dot.flash{color:#5eead4}
.save-dot i{width:7px;height:7px;border-radius:50%;background:#5eead4;display:block;transition:.3s}
.save-dot.flash i{box-shadow:0 0 0 4px rgba(94,234,212,.2)}

/* ============ LAYOUT ============ */
.app-main{
  display:grid;grid-template-columns:400px 1fr;
  height:calc(100vh - var(--header-h));
  overflow:hidden;
}
body.mode-preview .app-main{grid-template-columns:1fr}
body.mode-preview .sidebar{display:none}

/* ============ SIDEBAR ============ */
.sidebar{
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:2px 0 20px rgba(15,39,68,.04);
}
.tab-strip{
  display:flex;gap:2px;padding:8px 8px 0;overflow-x:auto;flex-shrink:0;
  border-bottom:1px solid var(--border);scrollbar-width:none;
}
.tab-strip::-webkit-scrollbar{display:none}
.tab-btn{
  display:flex;align-items:center;gap:5px;padding:8px 11px;border-radius:8px 8px 0 0;
  font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;
  border-bottom:2px solid transparent;transition:.16s;
}
.tab-btn:hover{color:var(--text);background:var(--panel-2)}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--gold);background:var(--panel-2)}
[data-theme="dark"] .tab-btn.active{color:var(--gold)}
.sidebar-body{flex:1;overflow-y:auto;padding:16px}
.sidebar-foot{
  padding:10px 16px;border-top:1px solid var(--border);font-size:10.5px;
  color:var(--muted);display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;background:var(--panel-2);
}

.panel-title{
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:18px 0 10px;display:flex;align-items:center;gap:7px;
}
.panel-title:first-child{margin-top:0}
.panel-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* ============ FORM ============ */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field.full{grid-column:1/-1}
.field label{font-size:11.5px;font-weight:600;color:var(--text-2)}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border-radius:8px;
  border:1px solid var(--border);background:var(--panel-2);
  font-size:13px;color:var(--text);transition:.16s;outline:none;
}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--accent);background:var(--panel);
  box-shadow:0 0 0 3px rgba(201,169,97,.16);
}
.field input.err,.field textarea.err{border-color:var(--danger);background:rgba(220,38,38,.04)}
.field-err{font-size:10.5px;color:var(--danger);min-height:0;display:none}
.field-err.show{display:block}
.field .check{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--text)}
.field .check input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.hint{
  display:flex;gap:8px;align-items:flex-start;font-size:11px;color:var(--muted);
  background:var(--panel-2);border:1px dashed var(--border-2);border-radius:9px;
  padding:10px 11px;margin-top:12px;line-height:1.5;
}
.hint svg{margin-top:1px;color:var(--accent)}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 14px;border-radius:9px;font-size:12.5px;font-weight:600;
  background:var(--panel-2);border:1px solid var(--border);color:var(--text-2);
  transition:.16s;
}
.btn:hover{background:var(--panel);border-color:var(--border-2);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-primary{background:linear-gradient(140deg,var(--navy),var(--navy-2));color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(15,39,68,.22)}
.btn-primary:hover{filter:brightness(1.1);box-shadow:0 6px 18px rgba(15,39,68,.3)}
.btn-gold{background:linear-gradient(140deg,var(--gold),#b9963f);color:#0f2744;border-color:transparent;box-shadow:0 3px 12px rgba(201,169,97,.32)}
.btn-gold:hover{filter:brightness(1.07)}
.btn-danger{background:rgba(220,38,38,.08);color:var(--danger);border-color:rgba(220,38,38,.25)}
.btn-danger:hover{background:rgba(220,38,38,.16)}
.btn-sm{padding:6px 10px;font-size:11.5px;border-radius:7px}
.btn-col{display:flex;flex-direction:column;gap:9px}
.icon-btn{
  width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  color:var(--muted);transition:.15s;background:transparent;
}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn.danger:hover{background:rgba(220,38,38,.1);color:var(--danger)}

/* ============ PHOTO ============ */
.photo-row{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.photo-box{
  width:96px;height:120px;border-radius:10px;overflow:hidden;flex-shrink:0;
  background:var(--panel-2);border:2px dashed var(--border-2);
  display:grid;place-items:center;font-size:10px;color:var(--muted);text-align:center;padding:6px;
  transition:.2s;
}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-btns{display:flex;flex-direction:column;gap:7px;flex:1}
.photo-btns .btn{justify-content:flex-start;padding:7px 11px;font-size:11.5px}

/* ============ LIST ============ */
.list-tools{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.search-box{
  flex:1;display:flex;align-items:center;gap:7px;padding:8px 11px;
  background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
  color:var(--muted);transition:.16s;
}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,169,97,.14)}
.search-box input{flex:1;border:none;background:none;outline:none;font-size:12.5px;color:var(--text)}
.search-box input::placeholder{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.list-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--panel-2);border:1px solid var(--border);border-radius:9px;
  transition:.16s;
}
.list-item:hover{border-color:var(--border-2);box-shadow:var(--shadow-sm)}
.li-main{flex:1;min-width:0}
.li-title{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.li-acts{display:flex;gap:1px;flex-shrink:0}
.empty{
  text-align:center;padding:22px 12px;font-size:12px;color:var(--muted);
  border:1.5px dashed var(--border-2);border-radius:10px;
}
.subsec{margin-bottom:20px}
.subsec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.subsec-head h4{font-size:12.5px;font-weight:700;color:var(--text-2)}

/* ============ SWITCH ============ */
.switch{position:relative;display:inline-block;width:34px;height:19px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch span{
  position:absolute;inset:0;background:var(--border-2);border-radius:20px;
  transition:.2s;cursor:pointer;
}
.switch span::before{
  content:'';position:absolute;width:13px;height:13px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::before{transform:translateX(15px)}

/* ============ ORDER LIST ============ */
.order-list{display:flex;flex-direction:column;gap:6px}
.order-item{
  display:flex;align-items:center;gap:9px;padding:9px 11px;
  background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
  cursor:grab;transition:.16s;font-size:12.5px;font-weight:500;
}
.order-item:hover{border-color:var(--accent)}
.order-item.dragging{opacity:.4;cursor:grabbing}
.order-item.drag-over{border-color:var(--accent);background:rgba(201,169,97,.09)}
.order-item > span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-item svg:first-child{color:var(--muted)}

/* ============ SWATCHES ============ */
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatch{
  width:28px;height:28px;border-radius:50%;border:2px solid transparent;

}
