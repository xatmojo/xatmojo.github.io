<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070f">
<title>Neon Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070f;--g:#39ff88;--c:#22e4ff;--r:#ff3d6e;--txt:#e8f1ff;--mut:#7f8fae;--glass:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:var(--bg)}
body{position:fixed;left:0;top:0;width:var(--vw,100%);height:var(--vh,100dvh);display:flex;flex-direction:column;overflow:hidden;color:var(--txt);font-family:'Space Grotesk',Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% 0,#0b1430,#05070f 65%)}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.2;animation:drift 20s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--g);left:-22vmax;top:-14vmax}
.bg i:nth-child(2){background:var(--c);right:-26vmax;bottom:-18vmax;animation-delay:-10s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 14px 4px}
h1{font-size:20px;font-weight:700;letter-spacing:.04em}
h1 b{margin-left:6px;background:linear-gradient(90deg,var(--g),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 24px rgba(57,255,136,.35)}
.stats{display:flex;gap:8px}
.stat{min-width:76px;padding:6px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--bd);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.stat small{display:block;font-size:11px;color:var(--mut)}
.stat span{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat.bump span{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.3);color:var(--g);text-shadow:0 0 14px var(--g)}}
.acts{display:flex;gap:8px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--txt);background:var(--glass);border:1px solid var(--bd);cursor:pointer;transition:transform .15s,border-color .2s}
.ib:hover{border-color:var(--c)}.ib:active{transform:scale(.92)}
.ib svg,.btn svg{width:20px;height:20px;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linecap:round}
main{flex:1;min-height:0;display:grid;place-items:center;padding:8px 14px 14px}
#board{position:relative;border-radius:16px;overflow:hidden;background:rgba(8,12,24,.7);box-shadow:0 0 0 1px var(--bd),0 0 70px rgba(57,255,136,.12),0 20px 60px rgba(0,0,0,.5)}
canvas{display:block}
.ov{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;padding:16px;text-align:center;background:rgba(5,7,15,.58);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transform:scale(1.05);transition:opacity .3s,transform .3s,visibility .3s}
.ov.on{opacity:1;visibility:visible;transform:none}
.ov h2{font-size:clamp(26px,8vmin,44px);font-weight:700;letter-spacing:.03em;line-height:1.1}
.ov h2.grad{background:linear-gradient(90deg,var(--g),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.ov h2.bad{color:var(--r);text-shadow:0 0 28px rgba(255,61,110,.5)}
.ov p{color:var(--mut);font-size:14px;max-width:26ch;line-height:1.4}
.res{display:flex;gap:10px}
.res div{min-width:88px;padding:8px 14px;border-radius:12px;background:var(--glass);border:1px solid var(--bd)}
.res small{display:block;font-size:11px;color:var(--mut)}.res b{font-size:24px}
#nb{color:var(--g);font-weight:700;font-size:14px;text-shadow:0 0 12px var(--g);display:none}
.btn{margin-top:6px;display:inline-flex;align-items:center;gap:8px;padding:13px 30px;border:0;border-radius:999px;font:700 16px 'Space Grotesk',system-ui,sans-serif;letter-spacing:.06em;color:#03140a;cursor:pointer;background:linear-gradient(90deg,var(--g),var(--c));box-shadow:0 0 28px rgba(57,255,136,.4);transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 40px rgba(34,228,255,.5)}.btn:active{transform:scale(.96)}
.ov.soft{background:rgba(5,7,15,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ov.clear{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;pointer-events:none}
.ov.soft .res div{min-width:72px}
.kbd{font-size:12px;color:var(--mut)}
#cn{font-size:clamp(72px,26vmin,150px);font-weight:700;line-height:1;background:linear-gradient(180deg,#fff,var(--g));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(57,255,136,.55));animation:cd .6s ease-out both}
@keyframes cd{0%{opacity:0;transform:scale(1.7)}35%{opacity:1}100%{opacity:.9;transform:scale(1)}}
.ov.soft h2{animation:cd .35s ease-out both}
html.w560 .stats{order:3;width:100%}html.w560 .stat{flex:1;min-width:0}
html.w400 h1{font-size:18px}html.w400 .acts{gap:6px}html.w400 .ib{width:36px;height:36px}
html.w340 h1{font-size:15px}html.w340 .acts{gap:4px}html.w340 .ib{width:32px;height:32px}
html.h480 header{padding-top:6px}html.h480 h1{font-size:17px}html.h480 .stat{padding:3px 10px}html.h480 .stat span{font-size:16px}html.h480 .ib{width:34px;height:34px}html.h480 main{padding:4px 14px 8px}
@media(prefers-reduced-motion:reduce){.bg i{animation:none}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i></div>
<header>
  <h1>NEON<b>SNAKE</b></h1>
  <div class="stats">
    <div class="stat" id="stScore"><small>Skor</small><span id="sc">0</span></div>
    <div class="stat"><small>Terbaik</small><span id="best">0</span></div>
    <div class="stat"><small>Level</small><span id="lv">1</span></div>
  </div>
  <div class="acts">
    <button class="ib" id="bFs" aria-label="Layar penuh"></button>
    <button class="ib" id="bMusic" aria-label="Musik"></button>
    <button class="ib" id="bMute" aria-label="Suara"></button>
    <button class="ib" id="bPause" aria-label="Jeda"></button>
  </div>
</header>
<main>
  <div id="board">
    <canvas id="cv"></canvas>
    <div class="ov on" id="ovStart">
      <h2 class="grad">NEON SNAKE</h2>
      <p id="hint"></p>
      <button class="btn" id="bPlay">PLAY</button>
    </div>
    <div class="ov soft" id="ovPause">
      <h2 class="grad">JEDA</h2>
      <div class="res"><div><small>Skor</small><b id="ps">0</b></div><div><small>Level</small><b id="pl">1</b></div></div>
      <button class="btn" id="bResume">LANJUT</button>
      <span class="kbd" id="pk">Spasi untuk lanjut</span>
    </div>
    <div class="ov clear" id="ovCount"><div id="cn">3</div></div>
    <div class="ov" id="ovOver">
      <h2 class="bad">GAME OVER</h2>
      <div class="res"><div><small>Skor</small><b id="fs">0</b></div><div><small>Terbaik</small><b id="fb">0</b></div></div>
      <div id="nb">Rekor baru!</div>
      <button class="btn" id="bAgain">PLAY AGAIN</button>
    </div>
  </div>
</main>
<script>
(()=>{
'use strict';
const N=20,$=s=>document.querySelector(s);
const D={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- Audio ---------- */
const CH=[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]],BS=[110,87.31,130.81,98];
const Sfx={ctx:null,master:null,mus:null,timer:0,step:0,next:0,
  muted:store.get('snake_mute','0')==='1',music:store.get('snake_music','1')!=='0',
  init(){if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;
      if(A){const c=this.ctx=new A(),k=c.createDynamicsCompressor();
        this.master=c.createGain();this.master.gain.value=1.5;this.master.connect(k);k.connect(c.destination);
        this.mus=c.createGain();this.mus.gain.value=.4;this.mus.connect(this.master)}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  osc(f,t,d,type,v,bus,f2){const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.02)},
  tone(f,d,type,v,at,f2){if(this.muted||!this.ctx)return;this.osc(f,this.ctx.currentTime+(at||0),d,type||'sine',v||.3,this.master,f2)},
  eat(){this.tone(520,.1,'triangle',.4);this.tone(780,.14,'triangle',.4,.07);this.tone(1040,.16,'sine',.25,.14)},
  over(){this.tone(320,.6,'sawtooth',.35,0,50);this.tone(160,.6,'square',.2,0,35)},
  tick(){this.tone(440,.06,'square',.12)},
  sched(){const c=this.ctx;if(!c)return;const sd=60/Math.min(150,104+(G.level-1)*4)/2;
    while(this.next<c.currentTime+.2){const i=this.step%16,q=i&3,t=this.next;
      this.osc(CH[i>>2][[0,1,2,1][q]]*2,t,sd*1.6,'triangle',.3,this.mus);
      if(q===0||q===2)this.osc(BS[i>>2],t,sd*1.8,'sine',.55,this.mus);
      if(q===3)this.osc(CH[i>>2][2]*4,t,sd*.8,'sine',.1,this.mus);
      this.next+=sd;this.step++}},
  sync(want){const on=want&&this.music&&!this.muted&&this.ctx;
    if(on&&!this.timer){this.next=this.ctx.currentTime+.05;this.timer=setInterval(()=>this.sched(),40)}
    else if(!on&&this.timer){clearInterval(this.timer);this.timer=0}}};

/* ---------- State & logic ---------- */
const G={state:'ready',snake:[],prev:[],dir:D.right,queue:[],food:null,foodAt:0,score:0,eaten:0,level:1,
  best:parseInt(store.get('snake_best','0'),10)||0,acc:0,t:0,shake:0,flash:0,shown:0,timer:0};
const interval=()=>Math.max(62,150-(G.level-1)*10);

function spawnFood(){
  const used=new Set(G.snake.map(s=>s.y*N+s.x)),free=[];
  for(let i=0;i<N*N;i++)if(!used.has(i))free.push(i);
  if(!free.length)return win();
  const i=free[Math.floor(Math.random()*free.length)];
  G.food={x:i%N,y:Math.floor(i/N)};G.foodAt=performance.now();
}
function reset(){
  clearTimeout(G.timer);clearTimeout(G.cdT);
  const m=N>>1;G.snake=[{x:m,y:m},{x:m-1,y:m},{x:m-2,y:m}];G.prev=G.snake.map(s=>({...s}));
  G.dir=D.right;G.queue=[];G.score=0;G.shown=0;G.eaten=0;G.level=1;G.acc=0;G.t=0;G.shake=0;G.flash=0;
  fx.p.length=fx.r.length=fx.t.length=0;spawnFood();updUI(true);
}
function start(){Sfx.init();Sfx.tick();reset();G.state='playing';show(null);setPauseIcon()}
function pauseNow(){
  clearTimeout(G.cdT);G.state='paused';
  $('#ps').textContent=G.score;$('#pl').textContent=G.level;show('ovPause');setPauseIcon();
}
function countdown(n){
  G.state='countdown';show('ovCount');setPauseIcon();
  const el=$('#cn');el.textContent=n;el.style.animation='none';void el.offsetWidth;el.style.animation='';
  Sfx.tone(n>1?520:780,.12,'triangle',.3);
  G.cdT=setTimeout(()=>{if(n>1)countdown(n-1);else{G.state='playing';show(null);setPauseIcon()}},600);
}
function togglePause(){
  if(G.state==='playing'||G.state==='countdown')pauseNow();
  else if(G.state==='paused'){Sfx.init();countdown(3)}
}
function turn(d){
  if(G.state!=='playing'&&G.state!=='countdown')return;
  const last=G.queue.length?G.queue[G.queue.length-1]:G.dir;
  if(d===last||(d.x+last.x===0&&d.y+last.y===0))return;
  if(G.queue.length<2)G.queue.push(d);
}
function step(){
  if(G.queue.length)G.dir=G.queue.shift();
  G.prev=G.snake.map(s=>({x:s.x,y:s.y}));
  const h={x:G.snake[0].x+G.dir.x,y:G.snake[0].y+G.dir.y};
  const eat=h.x===G.food.x&&h.y===G.food.y;
  const body=eat?G.snake:G.snake.slice(0,-1);
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(s=>s.x===h.x&&s.y===h.y))return die();
  G.snake.unshift(h);
  if(!eat){G.snake.pop();return}
  G.score+=10;G.eaten++;G.level=1+Math.floor(G.eaten/4);
  burst(G.food);Sfx.eat();spawnFood();updUI();
}
function win(){die()}
function die(){
  G.state='dying';G.shake=1;G.flash=1;G.t=0;Sfx.over();
  const nb=G.score>G.best;if(nb){G.best=G.score;store.set('snake_best',G.best)}
  G.timer=setTimeout(()=>{G.state='over';$('#fs').textContent=G.score;$('#fb').textContent=G.best;
    $('#nb').style.display=nb?'block':'none';updUI(true);show('ovOver')},750);
}

/* ---------- Effects ---------- */
const fx={p:[],r:[],t:[]};
function burst(c){
  const x=(c.x+.5)*cell,y=(c.y+.5)*cell;
  for(let i=0;i<18;i++){const a=Math.random()*6.283,s=cell*(2+Math.random()*4);
    fx.p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.55,m:.55,c:i%3?'#ff3d6e':'#39ff88',r:cell*(.07+Math.random()*.08)})}
  fx.r.push({x,y,l:.45,m:.45});fx.t.push({x,y,l:.8,m:.8});
}

/* ---------- Rendering ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d'),board=$('#board');
let cell=20,S=400,dpr=1,grid=null;
function resize(){
  const st=$('main'),cs=getComputedStyle(st);
  const w=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const h=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  cell=Math.max(8,Math.floor(Math.min(w,h)/N));S=cell*N;dpr=Math.min(window.devicePixelRatio||1,2.5);
  board.style.width=board.style.height=S+'px';
  cv.style.width=cv.style.height=S+'px';
  cv.width=cv.height=Math.round(S*dpr);
  grid=document.createElement('canvas');grid.width=grid.height=cv.width;
  const g=grid.getContext('2d');g.scale(dpr,dpr);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){g.fillStyle=(x+y)&1?'rgba(255,255,255,.018)':'rgba(255,255,255,0)';g.fillRect(x*cell,y*cell,cell,cell)}
  g.strokeStyle='rgba(120,200,255,.07)';g.lineWidth=1;g.beginPath();
  for(let i=1;i<N;i++){g.moveTo(i*cell+.5,0);g.lineTo(i*cell+.5,S);g.moveTo(0,i*cell+.5);g.lineTo(S,i*cell+.5)}
  g.stroke();
  const v=g.createRadialGradient(S/2,S/2,S*.3,S/2,S/2,S*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');
  g.fillStyle=v;g.fillRect(0,0,S,S);
}
function drawFood(now){
  const f=G.food;if(!f)return;
  const p=.5+.5*Math.sin(now/260),born=Math.max(0,Math.min(1,(now-G.foodAt)/220)),sc=born<1?1-Math.pow(1-born,3):1;
  const x=(f.x+.5)*cell,y=(f.y+.5)*cell,r=Math.max(.5,cell*(.27+.05*p)*sc);
  ctx.save();ctx.shadowColor='#ff3d6e';ctx.shadowBlur=cell*(.7+.6*p);
  const g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);g.addColorStop(0,'#ffd1dd');g.addColorStop(1,'#ff3d6e');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,61,110,'+(.35-.25*p)+')';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x,y,cell*(.38+.1*p)*sc,0,6.283);ctx.stroke();ctx.restore();
}
function drawSnake(){
  const t=Math.min(1,G.t),n=G.snake.length,dead=G.state==='dying'||G.state==='over';
  const pts=G.snake.map((s,i)=>{const p=G.prev[Math.min(i,G.prev.length-1)];
    return{x:(p.x+(s.x-p.x)*t+.5)*cell,y:(p.y+(s.y-p.y)*t+.5)*cell}});
  const a=pts[0],b=pts[n-1];
  const gr=ctx.createLinearGradient(a.x,a.y,b.x+.01,b.y);
  gr.addColorStop(0,dead?'#ff7a99':'#7dffb0');gr.addColorStop(1,dead?'#7a2038':'#0fb86a');
  ctx.save();ctx.lineCap=ctx.lineJoin='round';
  ctx.shadowColor=dead?'#ff3d6e':'#39ff88';ctx.shadowBlur=cell*.8;
  ctx.strokeStyle=gr;ctx.lineWidth=cell*.7;ctx.beginPath();
  pts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
  if(n===1)ctx.lineTo(a.x+.01,a.y);ctx.stroke();
  ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=cell*.24;ctx.stroke();
  // head
  ctx.shadowColor=dead?'#ff3d6e':'#39ff88';ctx.shadowBlur=cell*.9;
  ctx.fillStyle=dead?'#ffb3c4':'#c9ffe0';ctx.beginPath();ctx.arc(a.x,a.y,cell*.44,0,6.283);ctx.fill();
  ctx.shadowBlur=0;
  const d=G.dir,px=-d.y,py=d.x;
  ctx.fillStyle='#04130b';
  for(const s of[-1,1]){ctx.beginPath();ctx.arc(a.x+d.x*cell*.13+px*s*cell*.18,a.y+d.y*cell*.13+py*s*cell*.18,cell*.085,0,6.283);ctx.fill()}
  ctx.restore();
}
function drawFx(){
  for(const p of fx.p){ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}
  for(const r of fx.r){const k=1-r.l/r.m;ctx.globalAlpha=1-k;ctx.strokeStyle='#ff3d6e';ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,cell*(.3+k*1.3),0,6.283);ctx.stroke()}
  ctx.textAlign='center';ctx.font='700 '+Math.round(cell*.7)+'px "Space Grotesk",system-ui,sans-serif';
  for(const t of fx.t){const k=1-t.l/t.m;ctx.globalAlpha=1-k*k;ctx.fillStyle='#39ff88';ctx.fillText('+10',t.x,t.y-cell*.5-k*cell*1.2)}
  ctx.globalAlpha=1;
}
function draw(now){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,S);ctx.drawImage(grid,0,0,S,S);
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-.5)*G.shake*cell*.7,(Math.random()-.5)*G.shake*cell*.7);
  drawFood(now);drawSnake();drawFx();ctx.restore();
  if(G.flash>0){ctx.fillStyle='rgba(255,61,110,'+G.flash*.28+')';ctx.fillRect(0,0,S,S)}
}

/* ---------- UI ---------- */
const IC={on:'<svg viewBox="0 0 24 24"><path stroke="none" d="M4 9v6h4l5 4V5L8 9H4z"/><path fill="none" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>',
  off:'<svg viewBox="0 0 24 24"><path stroke="none" d="M4 9v6h4l5 4V5L8 9H4z"/><path fill="none" d="M17 9.5l5 5M22 9.5l-5 5"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path stroke="none" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path stroke="none" d="M8 5v14l11-7z"/></svg>'};
const sc=$('#sc');
function show(id){['ovStart','ovPause','ovCount','ovOver'].forEach(o=>$('#'+o).classList.toggle('on',o===id))}
function setPauseIcon(){$('#bPause').innerHTML=G.state==='paused'?IC.play:IC.pause;$('#bPause').setAttribute('aria-label',G.state==='paused'?'Lanjut':'Jeda')}
const MI={on:'<svg viewBox="0 0 24 24"><path fill="none" d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.5" stroke="none"/><circle cx="17" cy="16" r="2.5" stroke="none"/></svg>',
  off:'<svg viewBox="0 0 24 24"><path fill="none" d="M9 18V6l10-2v12M4 4l16 16"/><circle cx="7" cy="18" r="2.5" stroke="none"/><circle cx="17" cy="16" r="2.5" stroke="none"/></svg>'};
function setMusicIcon(){$('#bMusic').innerHTML=Sfx.music?MI.on:MI.off}
function setMuteIcon(){$('#bMute').innerHTML=Sfx.muted?IC.off:IC.on}
function bump(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function updUI(silent){
  $('#best').textContent=G.best;
  const lv=$('#lv');if(lv.textContent!=G.level){lv.textContent=G.level;if(!silent)bump(lv.parentNode)}
  if(silent)sc.textContent=G.shown=G.score;
}
$('#pk').style.display=matchMedia('(pointer:coarse)').matches?'none':'';
$('#hint').textContent=matchMedia('(pointer:coarse)').matches?'Geser jari ke atas, bawah, kiri, atau kanan untuk mengarahkan ular.':'Panah atau WASD untuk bergerak. Spasi untuk jeda.';
const press=(sel,fn)=>$(sel).addEventListener('click',e=>{e.currentTarget.blur();fn()});
press('#bPlay',start);press('#bAgain',start);press('#bResume',togglePause);
press('#bPause',()=>{if(G.state==='playing'||G.state==='paused'||G.state==='countdown')togglePause()});
press('#bMusic',()=>{Sfx.music=!Sfx.music;store.set('snake_music',Sfx.music?'1':'0');Sfx.init();setMusicIcon()});
press('#bMute',()=>{Sfx.muted=!Sfx.muted;store.set('snake_mute',Sfx.muted?'1':'0');Sfx.init();setMuteIcon();Sfx.tick()});

const de=document.documentElement,fsReq=de.requestFullscreen||de.webkitRequestFullscreen;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const FI={on:'<svg viewBox="0 0 24 24"><path fill="none" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',off:'<svg viewBox="0 0 24 24"><path fill="none" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'};
function setFsIcon(){$('#bFs').innerHTML=fsEl()?FI.off:FI.on}
function toggleFs(){try{if(fsEl())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else{const r=fsReq.call(de);if(r&&r.catch)r.catch(()=>{})}}catch(e){}}
if(!fsReq)$('#bFs').style.display='none';
press('#bFs',toggleFs);setFsIcon();
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{setFsIcon();setTimeout(fit,120)}));

/* Mode "desktop site" di browser HP: layout lebih lebar dari layar. Samakan ukuran halaman dengan area yang terlihat. */
function fit(){
  const v=window.visualViewport,r=document.documentElement.style;
  if(v&&(Math.abs(v.scale-1)>.02||Math.abs(v.width-innerWidth)>2||Math.abs(v.height-innerHeight)>80)){
    r.setProperty('--vw',v.width+'px');r.setProperty('--vh',v.height+'px');
  }else{r.removeProperty('--vw');r.removeProperty('--vh')}
  const w=v&&r.getPropertyValue('--vw')?v.width:innerWidth,h=v&&r.getPropertyValue('--vh')?v.height:innerHeight,cl=document.documentElement.classList;
  cl.toggle('w560',w<=560);cl.toggle('w400',w<=400);cl.toggle('w340',w<=340);cl.toggle('h480',h<=480);
  resize();
}

/* ---------- Input ---------- */
const KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
addEventListener('keydown',e=>{
  const k=KM[e.key]||KM[e.key.toLowerCase()];
  if(k){e.preventDefault();turn(D[k]);return}
  if(e.key==='f'||e.key==='F'){e.preventDefault();toggleFs();return}
  if(e.code==='Space'||e.key==='Escape'||e.key==='p'||e.key==='P'){
    e.preventDefault();if(e.repeat)return;
    if(G.state==='ready'||G.state==='over')start();else togglePause();
  }else if(e.key==='Enter'&&(G.state==='ready'||G.state==='over')){e.preventDefault();start()}
});
addEventListener('keyup',e=>{if(e.code==='Space')e.preventDefault()});
let tx=0,ty=0;const TH=20;
addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;Sfx.init()},{passive:true});
addEventListener('touchmove',e=>{
  e.preventDefault();const t=e.touches[0],dx=t.clientX-tx,dy=t.clientY-ty,ax=Math.abs(dx),ay=Math.abs(dy);
  if(Math.max(ax,ay)<TH)return;
  turn(ax>ay?(dx>0?D.right:D.left):(dy>0?D.down:D.up));tx=t.clientX;ty=t.clientY;
},{passive:false});
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(G.state==='playing'||G.state==='countdown'))pauseNow()});
addEventListener('blur',()=>{if(G.state==='playing'||G.state==='countdown')pauseNow()});
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,150));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(resize).observe($('main'));

/* ---------- Loop ---------- */
let last=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(G.state==='playing'){
    G.acc+=dt*1000;let iv=interval();
    while(G.acc>=iv&&G.state==='playing'){G.acc-=iv;step();iv=interval()}
    G.t=G.state==='playing'?Math.min(1,G.acc/iv):0;
  }
  Sfx.sync(G.state==='playing');
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*1.8);
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt*2.2);
  for(const a of[fx.p,fx.r,fx.t])for(let i=a.length-1;i>=0;i--){const o=a[i];o.l-=dt;if(o.l<=0)a.splice(i,1);else if(o.vx!==undefined){o.x+=o.vx*dt;o.y+=o.vy*dt;o.vx*=.94;o.vy*=.94}}
  if(G.shown<G.score){G.shown=Math.min(G.score,G.shown+Math.max(1,Math.ceil((G.score-G.shown)*.2)));sc.textContent=G.shown;bump($('#stScore'))}
  draw(now);
}
setMuteIcon();setMusicIcon();setPauseIcon();fit();reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
