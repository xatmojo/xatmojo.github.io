cv.addEventListener('pointerdown',e=>{e.preventDefault();A.init();if(G.st!=='play')return;try{cv.setPointerCapture(e.pointerId)}catch(_){}ptr.set(e.pointerId,{sx:e.clientX,sy:e.clientY,t:performance.now(),bx:P.tx,b:0,f:0,dr:0})});
cv.addEventListener('pointermove',e=>{e.preventDefault();const p=ptr.get(e.pointerId);if(!p||G.st!=='play')return;const dx=e.clientX-p.sx,dy=e.clientY-p.sy,dt=performance.now()-p.t;
 if(!p.b&&dy<-55&&-dy>Math.abs(dx)*1.2){p.b=1;boost()}
 if(!p.f&&Math.abs(dx)>30&&dt<220&&Math.abs(dx)>Math.abs(dy)){p.f=1;P.tx=clamp(Math.round(p.bx/2)*2+Math.sign(dx)*2,-2,2);hp(5);return}
 if(!p.f&&Math.abs(dx)>6){p.dr=1;P.tx=clamp(p.bx+dx*6.6/innerWidth,-2.6,2.6)}});
const up=e=>{const p=ptr.get(e.pointerId);if(!p)return;ptr.delete(e.pointerId);if(G.st!=='play')return;const dx=e.clientX-p.sx,dy=e.clientY-p.sy,dt=performance.now()-p.t;
 if(!p.f&&p.dr)P.tx=clamp(Math.round(P.tx/2)*2,-2,2);
 if(!p.b&&!p.f&&!p.dr&&Math.abs(dx)<12&&Math.abs(dy)<12&&dt<300)pulse()};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.key;
 if(k==='f'||k==='F'){if(fsOK)toggleFS();return}
 if(k==='Escape'||k==='p'||k==='P'){G.st==='play'?pause():resume();return}
 if(G.st==='menu'&&(k==='Enter'||k===' ')){start();return}
 if(G.st!=='play')return;
 if(k==='ArrowLeft'||k==='a'||k==='A')step(-1);else if(k==='ArrowRight'||k==='d'||k==='D')step(1);
 else if(k==='ArrowUp'||k==='w'||k==='W'||k===' ')boost();else if(k==='ArrowDown'||k==='s'||k==='S'||k==='e')pulse();
 if(k===' '||k.startsWith('Arrow'))e.preventDefault()});
/* ===== MAIN LOOP ===== */
let last=performance.now(),fa=0,fc=0;
function loop(now){requestAnimationFrame(loop);const raw=(now-last)/1000;last=now;if(document.hidden)return;const dt=Math.min(.05,raw);
 if(G.flash>0)G.flash=Math.max(0,G.flash-raw*2.2);
 if(G.st==='play'){phys(dt);fa+=raw;fc++;if(fa>2){const f=fc/fa;if(f<46&&pr>.7){pr=Math.max(.7,pr-.2);rd.setPixelRatio(pr);rs()}else if(f<36&&PP.on())PP.low=1;fa=fc=0}}
 if(G.st==='play'||G.st==='menu'||G.st==='over')vis(G.st==='over'?dt:dt);
 post()}
newGame();G.st='menu';setTxt();U.show('menu');requestAnimationFrame(loop);
})();
</script></body></html>
