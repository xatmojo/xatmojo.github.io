<style>
/* ============ RESET & BASE ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f2744; --navy-2:#1a3a5c; --navy-3:#0b1c33;
  --gold:#c9a961; --gold-2:#d4af37;
  --accent:#c9a961;
  --bg:#eef1f6; --panel:#ffffff; --panel-2:#f8fafc;
  --text:#0f172a; --text-2:#334155; --muted:#64748b;
  --border:#e2e8f0; --border-2:#cbd5e1;
  --ok:#059669; --warn:#d97706; --danger:#dc2626;
  --shadow-sm:0 1px 2px rgba(15,39,68,.06);
  --shadow:0 4px 20px rgba(15,39,68,.08);
  --shadow-lg:0 20px 50px rgba(15,39,68,.18);
  --radius:12px; --radius-lg:18px;
  --header-h:60px;
}
[data-theme="dark"]{
  --bg:#0a1420; --panel:#111d2b; --panel-2:#0e1a27;
  --text:#e8eef6; --text-2:#c3d0de; --muted:#8a9cb0;
  --border:#1f3045; --border-2:#2a3f58;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 4px 20px rgba(0,0,0,.45);
  --shadow-lg:0 20px 50px rgba(0,0,0,.6);
}
html,body{height:100%}
body{
  font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
  transition:background .25s ease,color .25s ease;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
svg{display:block;flex-shrink:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:10px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}

/* ============ LOADER ============ */
#loader{
  position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;
  background:linear-gradient(140deg,#0f2744,#0b1c33 60%,#12314f);
  color:#fff;transition:opacity .45s ease,visibility .45s ease;
}
#loader.hide{opacity:0;visibility:hidden}
.spinner{
  width:44px;height:44px;border-radius:50%;
  border:3px solid rgba(201,169,97,.25);border-top-color:var(--gold);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loader .l-title{font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--gold);text-transform:uppercase}
#loader .l-sub{font-size:12px;color:#8fa6c0}

/* ============ HEADER ============ */
.app-header{
  position:sticky;top:0;z-index:120;height:var(--header-h);
  display:flex;align-items:center;gap:10px;padding:0 14px;
  background:linear-gradient(100deg,#0f2744,#14324f);
  border-bottom:1px solid rgba(201,169,97,.28);
  box-shadow:0 2px 18px rgba(0,0,0,.22);
  color:#fff;
}
.brand{display:flex;align-items:center;gap:9px;margin-right:6px;flex-shrink:0}
.brand-mark{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--gold),#a8863f);
  color:#0f2744;font-weight:800;font-size:15px;
  box-shadow:0 3px 10px rgba(201,169,97,.45);
}
.brand-name{font-weight:800;font-size:15px;letter-spacing:.04em;line-height:1}
.brand-name span{color:var(--gold)}
.brand-tag{font-size:9px;letter-spacing:.18em;color:#8fa6c0;text-transform:uppercase;margin-top:2px}

.hdr-seg{
  display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:3px;gap:2px;
  border:1px solid rgba(255,255,255,.1);
}
.hdr-seg button{
  display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:6px;
  font-size:12px;font-weight:600;color:#b9cade;transition:.18s;
}
.hdr-seg button.active{background:var(--gold);color:#0f2744;box-shadow:0 2px 8px rgba(201,169,97,.4)}
.hdr-seg button:not(.active):hover{background:rgba(255,255,255,.1);color:#fff}

.hdr-spacer{flex:1}
.hdr-btn{
  display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;
  font-size:12px;font-weight:600;color:#cfdcea;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  transition:.18s;white-space:nowrap;
}
.hdr-btn:hover{background:rgba(255,255,255,.15);color:#fff;transform:translateY(-1px)}
.hdr-btn.gold{background:linear-gradient(140deg,var(--gold),#b9963f);color:#0f2744;border-color:transparent;box-shadow:0 3px 12px rgba(201,169,97,.35)}
.hdr-btn.gold:hover{filter:brightness(1.08)}
.save-dot{
  display:flex;align-items:center;gap:5px;font-size:11px;color:#8fa6c0;
  padding:0 8px;transition:color .3s;
}
.save-dot.flash{color:#5eead4}
.save-dot i{width:7px;height:7px;border-radius:50%;background:#5eead4;display:block;transition:.3s}
.save-dot.flash i{box-shadow:0 0 0 4px rgba(94,234,212,.2)}

/* ============ LAYOUT ============ */
.app-main{
  display:grid;grid-template-columns:400px 1fr;
  height:calc(100vh - var(--header-h));
  overflow:hidden;
}
body.mode-preview .app-main{grid-template-columns:1fr}
body.mode-preview .sidebar{display:none}

/* ============ SIDEBAR ============ */
.sidebar{
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:2px 0 20px rgba(15,39,68,.04);
}
.tab-strip{
  display:flex;gap:2px;padding:8px 8px 0;overflow-x:auto;flex-shrink:0;
  border-bottom:1px solid var(--border);scrollbar-width:none;
}
.tab-strip::-webkit-scrollbar{display:none}
.tab-btn{
  display:flex;align-items:center;gap:5px;padding:8px 11px;border-radius:8px 8px 0 0;
  font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;
  border-bottom:2px solid transparent;transition:.16s;
}
.tab-btn:hover{color:var(--text);background:var(--panel-2)}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--gold);background:var(--panel-2)}
[data-theme="dark"] .tab-btn.active{color:var(--gold)}
.sidebar-body{flex:1;overflow-y:auto;padding:16px}
.sidebar-foot{
  padding:10px 16px;border-top:1px solid var(--border);font-size:10.5px;
  color:var(--muted);display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;background:var(--panel-2);
}

.panel-title{
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:18px 0 10px;display:flex;align-items:center;gap:7px;
}
.panel-title:first-child{margin-top:0}
.panel-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* ============ FORM ============ */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field.full{grid-column:1/-1}
.field label{font-size:11.5px;font-weight:600;color:var(--text-2)}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border-radius:8px;
  border:1px solid var(--border);background:var(--panel-2);
  font-size:13px;color:var(--text);transition:.16s;outline:none;
}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--accent);background:var(--panel);
  box-shadow:0 0 0 3px rgba(201,169,97,.16);
}
.field input.err,.field textarea.err{border-color:var(--danger);background:rgba(220,38,38,.04)}
.field-err{font-size:10.5px;color:var(--danger);min-height:0;display:none}
.field-err.show{display:block}
.field .check{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--text)}
.field .check input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.hint{
  display:flex;gap:8px;align-items:flex-start;font-size:11px;color:var(--muted);
  background:var(--panel-2);border:1px dashed var(--border-2);border-radius:9px;
  padding:10px 11px;margin-top:12px;line-height:1.5;
}
.hint svg{margin-top:1px;color:var(--accent)}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 14px;border-radius:9px;font-size:12.5px;font-weight:600;
  background:var(--panel-2);border:1px solid var(--border);color:var(--text-2);
  transition:.16s;
}
.btn:hover{background:var(--panel);border-color:var(--border-2);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-primary{background:linear-gradient(140deg,var(--navy),var(--navy-2));color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(15,39,68,.22)}
.btn-primary:hover{filter:brightness(1.1);box-shadow:0 6px 18px rgba(15,39,68,.3)}
.btn-gold{background:linear-gradient(140deg,var(--gold),#b9963f);color:#0f2744;border-color:transparent;box-shadow:0 3px 12px rgba(201,169,97,.32)}
.btn-gold:hover{filter:brightness(1.07)}
.btn-danger{background:rgba(220,38,38,.08);color:var(--danger);border-color:rgba(220,38,38,.25)}
.btn-danger:hover{background:rgba(220,38,38,.16)}
.btn-sm{padding:6px 10px;font-size:11.5px;border-radius:7px}
.btn-col{display:flex;flex-direction:column;gap:9px}
.icon-btn{
  width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  color:var(--muted);transition:.15s;background:transparent;
}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn.danger:hover{background:rgba(220,38,38,.1);color:var(--danger)}

/* ============ PHOTO ============ */
.photo-row{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.photo-box{
  width:96px;height:120px;border-radius:10px;overflow:hidden;flex-shrink:0;
  background:var(--panel-2);border:2px dashed var(--border-2);
  display:grid;place-items:center;font-size:10px;color:var(--muted);text-align:center;padding:6px;
  transition:.2s;
}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-btns{display:flex;flex-direction:column;gap:7px;flex:1}
.photo-btns .btn{justify-content:flex-start;padding:7px 11px;font-size:11.5px}

/* ============ LIST ============ */
.list-tools{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.search-box{
  flex:1;display:flex;align-items:center;gap:7px;padding:8px 11px;
  background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
  color:var(--muted);transition:.16s;
}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,169,97,.14)}
.search-box input{flex:1;border:none;background:none;outline:none;font-size:12.5px;color:var(--text)}
.search-box input::placeholder{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.list-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--panel-2);border:1px solid var(--border);border-radius:9px;
  transition:.16s;
}
.list-item:hover{border-color:var(--border-2);box-shadow:var(--shadow-sm)}
.li-main{flex:1;min-width:0}
.li-title{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.li-acts{display:flex;gap:1px;flex-shrink:0}
.empty{
  text-align:center;padding:22px 12px;font-size:12px;color:var(--muted);
  border:1.5px dashed var(--border-2);border-radius:10px;
}
.subsec{margin-bottom:20px}
.subsec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.subsec-head h4{font-size:12.5px;font-weight:700;color:var(--text-2)}

/* ============ SWITCH ============ */
.switch{position:relative;display:inline-block;width:34px;height:19px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch span{
  position:absolute;inset:0;background:var(--border-2);border-radius:20px;
  transition:.2s;cursor:pointer;
}
.switch span::before{
  content:'';position:absolute;width:13px;height:13px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::before{transform:translateX(15px)}

/* ============ ORDER LIST ============ */
.order-list{display:flex;flex-direction:column;gap:6px}
.order-item{
  display:flex;align-items:center;gap:9px;padding:9px 11px;
  background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
  cursor:grab;transition:.16s;font-size:12.5px;font-weight:500;
}
.order-item:hover{border-color:var(--accent)}
.order-item.dragging{opacity:.4;cursor:grabbing}
.order-item.drag-over{border-color:var(--accent);background:rgba(201,169,97,.09)}
.order-item > span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-item svg:first-child{color:var(--muted)}

/* ============ SWATCHES ============ */
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatch{
  width:28px;height:28px;border-radius:50%;border:2px solid transparent;
  transition:.16s;position:relative;
}
.swatch:hover{transform:scale(1.12)}
.swatch.active{border-color:var(--text);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--accent)}
.swatches input[type=color]{
  width:32px;height:28px;padding:0;border:1px solid var(--border);border-radius:7px;
  background:var(--panel-2);cursor:pointer;
}

/* ============ PREVIEW ============ */
.preview-wrap{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.preview-toolbar{
  display:flex;align-items:center;gap:8px;padding:9px 16px;flex-shrink:0;
  background:var(--panel);border-bottom:1px solid var(--border);
  font-size:11.5px;color:var(--muted);overflow-x:auto;
}
.preview-toolbar .pt-label{font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.preview-toolbar .pt-sp{flex:1}
.preview-toolbar .btn{padding:6px 11px;font-size:11.5px}
.preview-stage{flex:1;overflow:auto;padding:22px 12px 60px;display:flex;justify-content:center}
.cv-holder{position:relative;transition:width .15s,height .15s}

/* ============ CV PAGE ============ */
.cv-page{
  position:absolute;top:0;left:0;
  width:794px;min-height:1123px;
  background:#fff;color:#1e293b;
  padding:52px 56px 56px;
  font-family:'Inter',sans-serif;
  font-size:10.5pt;line-height:1.5;
  box-shadow:0 10px 40px rgba(15,39,68,.16);
  transform-origin:top left;
  --cv-accent:#c9a961;
}
.cv-page.density-compact{padding:42px 48px 44px;font-size:9.5pt;line-height:1.42}
.cv-page.density-relaxed{padding:58px 62px 62px;font-size:11pt;line-height:1.62}

/* CV Header */
.cv-head{
  display:flex;gap:24px;align-items:flex-start;
  padding-bottom:14px;margin-bottom:18px;
  border-bottom:2.5px solid var(--cv-accent);
}
.cv-head-main{flex:1;min-width:0}
.cv-name{
  font-size:25pt;font-weight:800;color:#0f2744;line-height:1.08;
  letter-spacing:-.02em;text-transform:uppercase;word-break:break-word;
}
.cv-role{
  font-size:11pt;font-weight:600;color:var(--cv-accent);letter-spacing:.14em;
  text-transform:uppercase;margin-top:5px;
}
.cv-contact{
  display:flex;flex-wrap:wrap;gap:5px 16px;margin-top:11px;
  font-size:9pt;color:#475569;
}
.cv-contact span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.cv-contact svg{color:var(--cv-accent);flex-shrink:0}
.cv-photo{
  width:88px;height:110px;object-fit:cover;border-radius:7px;
  border:2.5px solid var(--cv-accent);flex-shrink:0;
  box-shadow:0 3px 10px rgba(15,39,68,.14);
}
.cv-photo.hide{display:none}

/* CV Sections */
.cv-section{margin-bottom:17px;break-inside:avoid}
.cv-section-title{
  font-size:10pt;font-weight:800;color:#0f2744;
  letter-spacing:.13em;text-transform:uppercase;
  padding-bottom:4px;margin-bottom:9px;
  border-bottom:1.5px solid var(--cv-accent);
  display:flex;align-items:center;gap:7px;
}
.cv-section-title::before{
  content:'';width:4px;height:12px;background:var(--cv-accent);border-radius:2px;
}
.cv-section-body{color:#334155}
.cv-summary{text-align:justify;line-height:1.55;font-size:9.7pt}

.cv-item{margin-bottom:11px;break-inside:avoid}
.cv-item:last-child{margin-bottom:0}
.cv-item-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cv-item-title{font-weight:700;font-size:10.2pt;color:#0f2744;line-height:1.3}
.cv-item-date{font-size:8.6pt;color:#64748b;font-weight:600;white-space:nowrap;flex-shrink:0}
.cv-item-sub{font-size:9.2pt;color:#475569;font-weight:600;margin-top:1px}
.cv-dur{font-weight:500;color:#94a3b8;font-size:8.4pt}
.cv-item-desc{margin-top:4px;font-size:9.3pt;line-height:1.5;color:#475569}
.cv-item-desc ul{margin:0;padding-left:15px}
.cv-item-desc li{margin-bottom:1.5px}
.cv-item-desc li::marker{color:var(--cv-accent)}

/* Skills */
.cv-skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 22px}
.cv-skill-top{display:flex;justify-content:space-between;font-size:9pt;font-weight:600;color:#334155;margin-bottom:3px}
.cv-skill-top span:last-child{color:#94a3b8;font-weight:500;font-size:8.3pt}
.cv-bar{height:4px;background:#e8edf3;border-radius:3px;overflow:hidden}
.cv-bar-fill{height:100%;background:linear-gradient(90deg,var(--cv-accent),#b9963f);border-radius:3px}

.cv-tags{display:flex;flex-wrap:wrap;gap:5px}
.cv-tag{
  font-size:8.8pt;font-weight:600;color:#0f2744;
  background:#f1f5f9;border:1px solid #dbe3ec;border-radius:20px;
  padding:2.5px 10px;
}

/* Certificates */
.cv-cert{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px;break-inside:avoid}
.cv-cert-main{flex:1;min-width:0}
.cv-cert-name{font-weight:700;font-size:9.8pt;color:#0f2744}
.cv-cert-sub{font-size:8.8pt;color:#64748b;margin-top:1px}
.cv-cert-side{text-align:right;flex-shrink:0}
.cv-cert-date{font-size:8.4pt;color:#64748b;font-weight:600}
.cv-badge{
  display:inline-flex;align-items:center;gap:4px;font-size:7.6pt;font-weight:700;
  padding:2px 8px;border-radius:20px;margin-top:3px;letter-spacing:.03em;
  text-transform:uppercase;
}
.cv-badge.ok{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.cv-badge.warn{background:#fef3c7;color:#b45309;border:1px solid #fcd34d}
.cv-badge.danger{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5}
.cv-badge.neutral{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
.cv-badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor}

/* References */
.cv-ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}
.cv-ref{border-left:2.5px solid var(--cv-accent);padding-left:10px}
.cv-ref-name{font-weight:700;font-size:9.8pt;color:#0f2744}
.cv-ref-sub{font-size:8.8pt;color:#475569;margin-top:1px}
.cv-ref-contact{font-size:8.4pt;color:#64748b;margin-top:2px}

/* Page break helpers */
.cv-section,.cv-item,.cv-cert,.cv-ref{break-inside:avoid;page-break-inside:avoid}
.cv-section-title{break-after:avoid;page-break-after:avoid}

/* ============ MOBILE NAV ============ */
.mobile-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:110;
  background:var(--panel);border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 24px rgba(15,39,68,.1);
}
.mobile-nav .mn-inner{display:flex;justify-content:space-around}
.mobile-nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;border-radius:9px;font-size:9.5px;font-weight:600;color:var(--muted);
  transition:.15s;
}
.mobile-nav button.active{color:var(--navy);background:rgba(201,169,97,.14)}
[data-theme="dark"] .mobile-nav button.active{color:var(--gold)}

/* ============ BACK TO TOP ============ */
.back-to-top{
  position:fixed;right:18px;bottom:22px;z-index:105;
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(140deg,var(--navy),var(--navy-2));color:#fff;
  display:grid;place-items:center;box-shadow:0 6px 22px rgba(15,39,68,.35);
  opacity:0;visibility:hidden;transform:translateY(12px);transition:.25s;
}
.back-to-top.show{opacity:1;visibility:visible;transform:translateY(0)}
.back-to-top:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(15,39,68,.45)}

/* ============ TOAST ============ */
.toast-wrap{
  position:fixed;top:calc(var(--header-h) + 14px);right:16px;z-index:400;
  display:flex;flex-direction:column;gap:9px;pointer-events:none;max-width:calc(100vw - 32px);
}
.toast{
  display:flex;align-items:center;gap:10px;padding:11px 15px;
  background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);
  border-radius:10px;box-shadow:var(--shadow-lg);
  font-size:12.5px;font-weight:600;color:var(--text);
  animation:slideIn .3s cubic-bezier(.16,1,.3,1);pointer-events:auto;
  min-width:220px;
}
.toast.out{animation:slideOut .25s ease forwards}
.toast.ok{border-left-color:var(--ok)}
.toast.warn{border-left-color:var(--warn)}
.toast.err{border-left-color:var(--danger)}
.toast.ok svg{color:var(--ok)}
.toast.warn svg{color:var(--warn)}
.toast.err svg{color:var(--danger)}
.toast svg{color:var(--accent);flex-shrink:0}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideOut{to{opacity:0;transform:translateX(40px)}}

/* ============ MODAL ============ */
.modal-wrap{
  position:fixed;inset:0;z-index:500;display:none;
  align-items:center;justify-content:center;padding:16px;
  background:rgba(10,20,32,.55);backdrop-filter:blur(4px);
}
.modal-wrap.show{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--panel);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);width:100%;max-width:540px;max-height:90vh;
  display:flex;flex-direction:column;overflow:hidden;
  animation:popIn .25s cubic-bezier(.16,1,.3,1);
  border:1px solid var(--border);
}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal.sm{max-width:400px}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.modal-head h3{font-size:14.5px;font-weight:700;color:var(--text)}
.modal-body{padding:18px;overflow-y:auto;flex:1}
.modal-foot{
  display:flex;justify-content:flex-end;gap:9px;padding:14px 18px;
  border-top:1px solid var(--border);flex-shrink:0;background:var(--panel-2);
}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* ============ CROP ============ */
.crop-stage{
  position:relative;width:300px;height:300px;max-width:100%;margin:0 auto 14px;
  background:#0f172a;border-radius:10px;overflow:hidden;
  border:2px solid var(--border-2);touch-action:none;cursor:grab;
}
.crop-stage:active{cursor:grabbing}
.crop-stage img{position:absolute;transform:translate(-50%,-50%);will-change:left,top;pointer-events:none;user-select:none;-webkit-user-drag:none}
.crop-guide{
  position:absolute;inset:0;pointer-events:none;
  border:2px solid rgba(201,169,97,.9);border-radius:10px;
  box-shadow:inset 0 0 0 9999px rgba(0,0,0,.18);
}
.crop-guide::before,.crop-guide::after{
  content:'';position:absolute;background:rgba(255,255,255,.28);
}
.crop-guide::before{left:33.33%;right:33.33%;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.28);border-right:1px solid rgba(255,255,255,.28);background:none}
.crop-guide::after{top:33.33%;bottom:33.33%;left:0;right:0;border-top:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.28);background:none}

/* ============ EMPTY PREVIEW ============ */
.cv-empty-note{
  text-align:center;padding:40px 20px;color:#94a3b8;font-size:10pt;
}

/* ============ PRINT ============ */
@media print{
  @page{size:A4;margin:12mm 13mm}
  html,body{background:#fff!important;height:auto!important;overflow:visible!important}
  .app-header,.sidebar,.preview-toolbar,.mobile-nav,.back-to-top,
  .toast-wrap,.modal-wrap,#loader,.no-print{display:none!important}
  .app-main{display:block!important;height:auto!important;overflow:visible!important}
  .preview-wrap,.preview-stage{
    display:block!important;padding:0!important;margin:0!important;
    overflow:visible!important;background:#fff!important;height:auto!important;
  }
  .cv-holder{width:auto!important;height:auto!important;position:static!important}
  .cv-page{
    position:static!important;transform:none!important;
    width:auto!important;min-height:0!important;
    padding:0!important;margin:0!important;
    box-shadow:none!important;border:none!important;
    font-size:10pt!important;
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
  }
  .cv-page *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .cv-photo{box-shadow:none!important}
  a{color:inherit!important;text-decoration:none!important}
}

function mergeState(base, incoming) {
  if (!incoming || typeof incoming !== 'object') return base;
  const out = Array.isArray(base) ? [] : {};
  if (Array.isArray(base)) {
    return Array.isArray(incoming) ? incoming.slice() : base;
  }
  for (const k in base) {
    if (incoming[k] === undefined) out[k] = base[k];
    else if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) out[k] = mergeState(base[k], incoming[k]);
    else out[k] = incoming[k];
  }
  // keep unknown keys from incoming (future-proof)
  for (const k in incoming) if (!(k in out)) out[k] = incoming[k];
  return out;
}

/* ------------------------------------------------------------------
   4. STORAGE (LocalStorage + IndexedDB)
------------------------------------------------------------------ */
const LS_KEY = 'procv_state_v1';
const IDB_NAME = 'procv_db';
const IDB_STORE = 'kv';
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('IndexedDB unsupported'));
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function idbSet(key, val) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  });
}
async function idbGet(key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbDel(key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

let saveTimer = null;
let saving = false;

function save() {
  setStatus('Menyimpan…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 350);
}

async function doSave() {
  if (saving) return;
  saving = true;
  try {
    try { await idbSet('state', state); } catch (e) { console.warn('IDB save failed', e); }
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    } catch (e) {
      // Quota exceeded — save without photo
      try {
        const copy = JSON.parse(JSON.stringify(state));
        copy.personal.photo = '';
        localStorage.setItem(LS_KEY, JSON.stringify(copy));
      } catch (e2) { console.warn('LS save failed', e2); }
    }
    setStatus('Tersimpan');
    flashSaveDot();
  } finally {
    saving = false;
  }
}

async function loadState() {
  let data = null;
  try {
    const idbData = await idbGet('state');
    if (idbData) data = idbData;
  } catch (e) { /* ignore */ }
  if (!data) {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) data = JSON.parse(raw);
    } catch (e) { /* ignore */ }
  }
  state = data ? mergeState(defaultState(), data) : defaultState();
  // Ensure every section exists
  const base = defaultState();
  for (const k in base) {
    if (Array.isArray(base[k]) && !Array.isArray(state[k])) state[k] = [];
  }
  if (!Array.isArray(state.settings.sectionOrder) || !state.settings.sectionOrder.length) {
    state.settings.sectionOrder = base.settings.sectionOrder.slice();
  }
  if (!Array.isArray(state.settings.hiddenSections)) state.settings.hiddenSections = [];
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}
function uid() { return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function getPath(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
function setPath(obj, path, val) {
  const parts = path.split('.');
  const last = parts.pop();
  let t = obj;
  for (const k of parts) { if (!t[k] || typeof t[k] !== 'object') t[k] = {}; t = t[k]; }
  t[last] = val;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtMonth(v) {
  if (!v) return '';
  const parts = String(v).split('-');
  if (parts.length < 2) return parts[0] || '';
  const y = parts[0], m = parseInt(parts[1], 10);
  if (isNaN(m) || m < 1 || m > 12) return v;
  return `${MONTH_NAMES[m-1]} ${y}`;
}
function monthIdx(v) {
  if (!v) return null;
  const parts = String(v).split('-');
  const y = parseInt(parts[0], 10);
  if (isNaN(y)) return null;
  if (parts.length < 2) return y * 12;
  const m = parseInt(parts[1], 10);
  if (isNaN(m)) return y * 12;
  return y * 12 + (m - 1);
}
function durText(start, end, current) {
  const s = monthIdx(start);
  if (s == null) return '';
  let e;
  if (current) {
    const now = new Date();
    e = now.getFullYear() * 12 + now.getMonth();
  } else {
    e = monthIdx(end);
  }
  if (e == null) return '';
  let months = e - s;
  if (months < 0) months = 0;
  const y = Math.floor(months / 12), m = months % 12;
  if (y && m) return `${y} thn ${m} bln`;
  if (y) return `${y} thn`;
  return `${m} bln`;
}
function dateRange(start, end, current) {
  const s = fmtMonth(start);
  if (!s && !end && !current) return '';
  if (current) return `${s || ''} – Sekarang`;
  if (s && end) return `${s} – ${fmtMonth(end)}`;
  if (s) return s;
  if (end) return fmtMonth(end);
  return '';
}
function bullets(text) {
  if (!text) return '';
  const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (lines.length <= 1) return `<p style="margin:0">${esc(lines[0] || '')}</p>`;
  return `<ul>${lines.map(l => `<li>${esc(l.replace(/^[-•*\u2022]\s*/, ''))}</li>`).join('')}</ul>`;
}
function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v || '').trim()); }
function isValidPhone(v) {
  const s = String(v || '').trim();
  if (!s) return true;
  const digits = s.replace(/[^\d]/g, '');
  if (digits.length < 7 || digits.length > 15) return false;
  return /^[+\d][\d\s\-().]{5,}$/.test(s);
}
function levelLabel(l) {
  const n = Number(l) || 0;
  if (n >= 90) return 'Ahli';
  if (n >= 75) return 'Mahir';
  if (n >= 60) return 'Menengah';
  if (n >= 40) return 'Dasar';
  return 'Pemula';
}
function certStatus(expiry) {
  if (!expiry) return { label:'Tanpa Kedaluwarsa', cls:'neutral', days:null };
  const t = new Date(); t.setHours(0,0,0,0);
  const e = new Date(expiry + 'T00:00:00');
  if (isNaN(e.getTime())) return { label:'Tanpa Kedaluwarsa', cls:'neutral', days:null };
  const days = Math.round((e - t) / 86400000);
  if (days < 0) return { label:'Kedaluwarsa', cls:'danger', days };
  if (days === 0) return { label:'Kedaluwarsa Hari Ini', cls:'danger', days };
  if (days <= 30) return { label:'Akan Kedaluwarsa', cls:'warn', days };
  if (days <= 90) return { label:'Aktif', cls:'ok', days };
  return { label:'Aktif', cls:'ok', days };
}
function countdownText(days) {
  if (days == null) return '';
  if (days < 0) return `kedaluwarsa ${Math.abs(days)} hari lalu`;
  if (days === 0) return 'kedaluwarsa hari ini';
  if (days === 1) return 'tersisa 1 hari';
  if (days < 30) return `tersisa ${days} hari`;
  const m = Math.floor(days / 30);
  if (m < 12) return `tersisa ±${m} bulan`;
  const y = Math.floor(days / 365);
  return `tersisa ±${y} tahun`;
}

/* ------------------------------------------------------------------
   6. TOAST / MODAL / STATUS
------------------------------------------------------------------ */
function toast(msg, type = 'info', ms = 2600) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'info' ? '' : type);
  let ic = 'check';
  if (type === 'warn') ic = 'alert';
  if (type === 'err') ic = 'x';
  if (type === 'info') ic = 'check';
  el.innerHTML = `${icon(ic, 16)}<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 260);
  }, ms);
}
function setStatus(t) {
  const el = document.getElementById('statusText');
  if (el) el.textContent = t;
}
function flashSaveDot() {
  const d = document.getElementById('saveDot');
  if (!d) return;
  d.classList.add('flash');
  setTimeout(() => d.classList.remove('flash'), 900);
}

function openModal(html, size) {
  const wrap = document.getElementById('modalWrap');
  const box = document.getElementById('modalBox');
  box.className = 'modal' + (size === 'sm' ? ' sm' : '');
  box.innerHTML = html;
  wrap.classList.add('show');
  return box;
}
function closeModal() {
  document.getElementById('modalWrap').classList.remove('show');
  modalCtx = null;
}
function confirmDialog(title, msg, okLabel, onOk, danger) {
  const box = openModal(`
    <div class="modal-head">
      <h3>${esc(title)}</h3>
      <button class="icon-btn" data-modal-close>${icon('x', 18)}</button>
    </div>
    <div class="modal-body" style="font-size:13px;color:var(--text-2);line-height:1.6">${msg}</div>
    <div class="modal-foot">
      <button class="btn" data-modal-close>Batal</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="confirmOk">${esc(okLabel)}</button>
    </div>
  `, 'sm');
  box.querySelector('#confirmOk').addEventListener('click', () => {
    closeModal();
    onOk();
  });
}

function renderCV() {
  const d = state;
  const p = d.personal;
  const s = d.settings;

  /* ---- Header ---- */
  const name = (p.fullName || '').trim() || 'NAMA LENGKAP ANDA';
  const role = (p.title || '').trim();
  const contact = [];
  if (p.email) contact.push(`<span>${cvIcon('mail')}${esc(p.email)}</span>`);
  if (p.phone) contact.push(`<span>${cvIcon('phone')}${esc(p.phone)}</span>`);
  const addr = [p.address, p.city].filter(Boolean).join(', ');
  if (addr) contact.push(`<span>${cvIcon('pin')}${esc(addr)}</span>`);
  if (p.linkedin) contact.push(`<span>${cvIcon('linkedin')}${esc(p.linkedin)}</span>`);
  if (p.website) contact.push(`<span>${cvIcon('globe')}${esc(p.website)}</span>`);

  const photoHTML = (p.photo && s.showPhoto)
    ? `<img class="cv-photo" src="${p.photo}" alt="Foto">`
    : '';

  let html = `
    <header class="cv-head">
      <div class="cv-head-main">
        <h1 class="cv-name">${esc(name)}</h1>
        ${role ? `<div class="cv-role">${esc(role)}</div>` : ''}
        ${contact.length ? `<div class="cv-contact">${contact.join('')}</div>` : ''}
      </div>
      ${photoHTML}
    </header>`;

  /* ---- Sections ---- */
  let rendered = 0;
  const hidden = new Set(s.hiddenSections);
  s.sectionOrder.forEach(id => {
    if (hidden.has(id)) return;
    const fn = RENDERERS[id];
    if (!fn) return;
    const out = fn(d);
    if (out) { html += out; rendered++; }
  });

  if (rendered === 0 && !contact.length) {
    html += `<div class="cv-empty-note">CV Anda masih kosong.<br>Mulai isi data di panel sebelah kiri.</div>`;
  }

  const page = document.getElementById('cvPage');
  page.innerHTML = html;

  /* ---- Settings applied to page ---- */
  page.style.fontFamily = `'${s.font}', 'Segoe UI', system-ui, sans-serif`;
  page.style.fontSize = s.fontSize + 'pt';
  page.style.setProperty('--cv-accent', s.accent);
  page.className = 'cv-page density-' + (s.density || 'normal');

  document.documentElement.style.setProperty('--accent', s.accent);

  requestAnimationFrame(fitPreview);
  updateCounter();
}

function updateCounter() {
  const el = document.getElementById('counterText');
  if (!el) return;
  const d = state;
  let n = 0;
  ['experience','education','hardSkills','softSkills','techSkills','computerSkills','languages','certificates','organizations','projects','awards','references']
    .forEach(k => { n += (d[k] || []).length; });
  el.textContent = `${n} item data`;
}

/* ------------------------------------------------------------------
   8. PREVIEW SCALING
------------------------------------------------------------------ */
let userZoom = 1;
function fitPreview() {
  const stage = document.getElementById('previewStage');
  const holder = document.getElementById('cvHolder');
  const page = document.getElementById('cvPage');
  if (!stage || !holder || !page) return;

  page.style.transform = 'none';
  const pageW = 794;
  const pageH = page.offsetHeight || 1123;

  const avail = stage.clientWidth - 28;
  const fitScale = Math.min(1, avail / pageW);
  const scale = fitScale * userZoom;

  page.style.transform = `scale(${scale})`;
  page.style.transformOrigin = 'top left';

  holder.style.width = (pageW * scale) + 'px';
  holder.style.height = (pageH * scale) + 'px';
  holder.style.margin = '0 auto';

  const zl = document.getElementById('zoomLabel');
  if (zl) zl.textContent = Math.round(scale * 100) + '%';
}

function renderListTab(key, title) {
  const items = state[key] || [];
  const term = (searchTerms[key] || '').toLowerCase();

    if (!term) return true;
    return JSON.stringify(it).toLowerCase().includes(term);
  });

  return `

      <div class="search-box">

    <div class="list" id="list-${key}">
      ${filtered.length
        ? filtered.map(it => {
            const i = items.indexOf(it);
            return listItemHTML(key, it, i);
          }).join('')
        : `<div class="empty">${term ? 'Tidak ada hasil pencarian.' : 'Belum ada data. Klik "Tambah" untuk mulai.'}</div>`}
    </div>
  `;
}

function listItemHTML(key, item, i) {
  const t = itemTitle(key, item);
  const s = itemSub(key, item);
  return `<div class="list-item" data-item="${key}:${i}">
    <div class="li-main">
      <div class="li-title">${esc(t) || '<em style="color:var(--muted);font-weight:400">Tanpa judul</em>'}</div>
      ${s ? `<div class="li-sub">${esc(s)}</div>` : ''}
    </div>

      <button class="icon-btn" data-move="${key}:${i}:1" title="Turun">${icon('chevDown', 14)}</button>
      <button class="icon-btn" data-edit="${key}:${i}" title="Edit">${icon('edit', 14)}</button>
      <button class="icon-btn danger" data-del="${key}:${i}" title="Hapus">${icon('trash', 14)}</button>
    </div>
  </div>`;
}

function itemTitle(key, it) {
  switch (key) {
    case 'experience': return it.role || it.company || '';
    case 'education': return [it.degree, it.major].filter(Boolean).join(' · ') || it.institution || '';
    case 'certificates': return it.name || '';
    case 'organizations': return it.role || it.org || '';
    case 'projects': return it.name || '';
    case 'awards': return it.name || '';
    case 'references': return it.name || '';
    case 'hardSkills': case 'softSkills': case 'techSkills': case 'computerSkills': case 'languages':
      return it.name || '';
    default: return it.name || '';
  }
}
function itemSub(key, it) {
  switch (key) {
    case 'experience': return [it.company, dateRange(it.start, it.end, it.current)].filter(Boolean).join(' · ');
    case 'education': return [it.institution, [it.start, it.end].filter(Boolean).join('–')].filter(Boolean).join(' · ');
    case 'certificates': {
      const st = certStatus(it.expiry);
      return [it.issuer, it.expiry ? `${st.label}${st.days != null ? ' · ' + countdownText(st.days) : ''}` : ''].filter(Boolean).join(' · ');
    }
    case 'organizations': return [it.org, [it.start, it.end].filter(Boolean).join('–')].filter(Boolean).join(' · ');
    case 'projects': return [it.role, it.year].filter(Boolean).join(' · ');
    case 'awards': return [it.issuer, it.year].filter(Boolean).join(' · ');
    case 'references': return [it.position, it.company].filter(Boolean).join(' · ');
    case 'hardSkills': case 'softSkills': case 'techSkills': case 'computerSkills': case 'languages':
      return it.level != null ? levelLabel(it.level) + ` (${it.level}%)` : '';
    default: return '';
  }
}

/* ------------------------------------------------------------------
   10. SIDEBAR EVENT BINDING
------------------------------------------------------------------ */
function bindSidebarEvents() {
  const body = document.getElementById('sidebarBody');

  // Bind inputs
  body.querySelectorAll('[data-bind]').forEach(el => {
    el.addEventListener('input', onBindInput);
    el.addEventListener('change', onBindInput);
  });

  // Photo
  const fUp = body.querySelector('#btnPhotoUpload');
  if (fUp) fUp.addEventListener('click', () => body.querySelector('#filePhoto').click());
  const fInput = body.querySelector('#filePhoto');
  if (fInput) fInput.addEventListener('change', onPhotoChosen);
  const fCrop = body.querySelector('#btnPhotoCrop');
  if (fCrop) fCrop.addEventListener('click', openCropModal);
  const fRem = body.querySelector('#btnPhotoRemove');
  if (fRem) fRem.addEventListener('click', () => {
    confirmDialog('Hapus Foto', 'Foto akan dihapus dari CV. Lanjutkan?', 'Hapus', () => {
      state.personal.photo = '';
      save(); renderSidebar(); renderCV();
      toast('Foto dihapus', 'ok');
    }, true);
  });

  // Add buttons
  body.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => openItemModal(btn.dataset.add, null));
  });

  // Edit / Delete / Move
  body.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [k, i] = btn.dataset.edit.split(':');
      openItemModal(k, parseInt(i, 10));
    });
  });
  body.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [k, i] = btn.dataset.del.split(':');
      const idx = parseInt(i, 10);
      const item = state[k][idx];
      confirmDialog('Hapus Data', `Hapus "<b>${esc(itemTitle(k, item) || 'item ini')}</b>"? Tindakan ini tidak dapat dibatalkan.`, 'Hapus', () => {
        state[k].splice(idx, 1);
        save(); renderSidebar(); renderCV();
        toast('Data dihapus', 'ok');
      }, true);
    });
  });
  body.querySelectorAll('[data-move]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [k, i, dir] = btn.dataset.move.split(':');
      const idx = parseInt(i, 10), d = parseInt(dir, 10);
      const arr = state[k];
      const ni = idx + d;
      if (ni < 0 || ni >= arr.length) return;
      [arr[idx], arr[ni]] = [arr[ni], arr[idx]];
      save(); renderSidebar(); renderCV();
    });
  });

  // Search
  body.querySelectorAll('[data-search]').forEach(inp => {
    inp.addEventListener('input', () => {
      searchTerms[inp.dataset.search] = inp.value;
      const key = inp.dataset.search;
      const listEl = document.getElementById('list-' + key);
      if (listEl) {
        const term = inp.value.toLowerCase();
        const items = state[key] || [];
        const filtered = items.filter(it => !term || JSON.stringify(it).toLowerCase().includes(term));
        listEl.innerHTML = filtered.length
          ? filtered.map(it => listItemHTML(key, it, items.indexOf(it))).join('')
          : `<div class="empty">Tidak ada hasil pencarian.</div>`;
        rebindListActions(listEl);
      }
    });
  });

  // Theme segment
  body.querySelectorAll('[data-theme-set]').forEach(btn => {
    btn.addEventListener('click', () => setTheme(btn.dataset.themeSet));
  });

  // Accent swatches
  body.querySelectorAll('[data-accent]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.settings.accent = btn.dataset.accent;
      save(); renderSidebar(); renderCV();
    });
  });
  const custom = body.querySelector('#accentCustom');
  if (custom) custom.addEventListener('input', () => {
    state.settings.accent = custom.value;
    save(); renderCV();
  });

  // Range visual updates
  body.querySelectorAll('[data-range="fontSize"]').forEach(r => {
    r.addEventListener('input', () => {
      const v = body.querySelector('#fsVal');
      if (v) v.textContent = r.value + ' pt';
    });
  });

  // Section visibility
  body.querySelectorAll('[data-vis]').forEach(chk => {
    chk.addEventListener('change', () => {
      const id = chk.dataset.vis;
      const set = new Set(state.settings.hiddenSections);
      if (chk.checked) set.delete(id); else set.add(id);
      state.settings.hiddenSections = [...set];
      save(); renderCV();
    });
  });

  // Drag & drop order
  const orderList = body.querySelector('#orderList');
  if (orderList) setupDragOrder(orderList);

  // Data tab actions
  const bExp = body.querySelector('#btnExport');
  if (bExp) bExp.addEventListener('click', exportBackup);
  const bImp = body.querySelector('#btnImport');
  if (bImp) bImp.addEventListener('click', () => body.querySelector('#fileImport').click());
  const fImp = body.querySelector('#fileImport');
  if (fImp) fImp.addEventListener('change', importBackup);
  const bRes = body.querySelector('#btnRestoreLast');
  if (bRes) bRes.addEventListener('click', restoreLast);
  const bRst = body.querySelector('#btnReset');
  if (bRst) bRst.addEventListener('click', () => {
    confirmDialog('Reset Seluruh Data',
      'Semua data CV, foto, dan pengaturan akan dihapus permanen. Pastikan Anda sudah membuat backup.<br><br><b>Lanjutkan reset?</b>',
      'Ya, Reset', doReset, true);
  });
  const bWa = body.querySelector('#btnWa');
  if (bWa) bWa.addEventListener('click', () => {
    const phone = (state.personal.phone || '').replace(/[^\d]/g, '').replace(/^0/, '62');
    if (!phone) return toast('Nomor telepon belum diisi', 'warn');
    window.open('https://wa.me/' + phone, '_blank');
  });
  const bMail = body.querySelector('#btnMail');
  if (bMail) bMail.addEventListener('click', () => {
    if (!state.personal.email) return toast('Email belum diisi', 'warn');
    window.location.href = 'mailto:' + state.personal.email;
  });
}

function rebindListActions(scope) {
  scope.querySelectorAll('[data-edit]').forEach(btn => {

      openItemModal(k, parseInt(i, 10));

  });
  scope.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [k, i] = btn.dataset.del.split(':');
      const idx = parseInt(i, 10);
      const item = state[k][idx];
      confirmDialog('Hapus Data', `Hapus "<b>${esc(itemTitle(k, item) || 'item ini')}</b>"?`, 'Hapus', () => {
        state[k].splice(idx, 1);
        save(); renderSidebar(); renderCV();
        toast('Data dihapus', 'ok');
      }, true);
    });
  });
  scope.querySelectorAll('[data-move]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [k, i, dir] = btn.dataset.move.split(':');
      const idx = parseInt(i, 10), d = parseInt(dir, 10);
      const arr = state[k];
      const ni = idx + d;

function onBindInput(e) {
  const el = e.currentTarget;
  const key = el.dataset.bind;
  let val;
  if (el.type === 'checkbox') val = el.checked;
  else if (el.type === 'range') val = parseFloat(el.value);
  else val = el.value;

  setPath(state, key, val);

  // Live validation for email & phone
  if (key === 'personal.email' || key === 'personal.phone') validateField(el, key);

  // Range display
  if (el.dataset.range === 'fontSize') {
    const v = document.getElementById('fsVal');
    if (v) v.textContent = el.value + ' pt';
  }

  renderCV();
  save();
}

function validateField(el, key) {
  const errEl = document.querySelector(`[data-err="${key}"]`);
  let msg = '';
  if (key === 'personal.email' && el.value.trim() && !isValidEmail(el.value)) msg = 'Format email tidak valid.';
  if (key === 'personal.phone' && el.value.trim() && !isValidPhone(el.value)) msg = 'Nomor telepon tidak valid (7–15 digit).';
  el.classList.toggle('err', !!msg);
  if (errEl) {
    errEl.textContent = msg;
    errEl.classList.toggle('show', !!msg);
  }
}

/* ------------------------------------------------------------------
   11. ITEM MODAL
------------------------------------------------------------------ */
function fieldInModal(f, item) {
  const val = item[f.key] != null ? item[f.key] : '';
  const full = (f.type === 'textarea' || f.type === 'range' || f.type === 'checkbox');
  if (f.type === 'textarea') {
    return `<div class="field full">
      <label>${esc(f.label)}</label>
      <textarea data-f="${f.key}" rows="4" placeholder="${esc(f.ph || '')}">${esc(val)}</textarea>
    </div>`;
  }
  if (f.type === 'checkbox') {
    return `<div class="field full">
      <label class="check"><input type="checkbox" data-f="${f.key}" ${val ? 'checked' : ''}> ${esc(f.label)}</label>
    </div>`;
  }
  if (f.type === 'range') {
    const v = Number(val) || 0;
    return `<div class="field full">
      <label>${esc(f.label)}: <b data-rangeout="${f.key}">${v}%</b></label>
      <input type="range" min="0" max="100" step="5" value="${v}" data-f="${f.key}" data-rangein="1">
    </div>`;
  }
  return `<div class="field ${full ? 'full' : ''}">
    <label>${esc(f.label)}</label>
    <input type="${f.type}" data-f="${f.key}" value="${esc(val)}" placeholder="${esc(f.ph || '')}">
    <div class="field-err" data-ferr="${f.key}"></div>
  </div>`;
}

function openItemModal(key, index) {
  const schema = SCHEMAS[key];
  if (!schema) return;
  const isNew = index == null;
  const item = isNew ? {} : JSON.parse(JSON.stringify(state[key][index]));
  if (isNew && key === 'hardSkills') item.level = 60;
  if (isNew && (key === 'techSkills' || key === 'computerSkills' || key === 'languages')) item.level = 60;

  const label = SECTION_META[key].label;
  const box = openModal(`
    <div class="modal-head">
      <h3>${isNew ? 'Tambah' : 'Edit'} — ${esc(label)}</h3>
      <button class="icon-btn" data-modal-close>${icon('x', 18)}</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        ${schema.map(f => fieldInModal(f, item)).join('')}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-modal-close>Batal</button>
      <button class="btn btn-primary" id="modalSaveBtn">${icon('check', 15)} Simpan</button>
    </div>
  `);

  // range live update
  box.querySelectorAll('[data-rangein]').forEach(r => {
    r.addEventListener('input', () => {
      const o = box.querySelector(`[data-rangeout="${r.dataset.f}"]`);
      if (o) o.textContent = r.value + '%';
    });
  });

  // email/phone validation
  box.querySelectorAll('input[type=email],input[type=tel]').forEach(inp => {
    inp.addEventListener('input', () => {
      const k = inp.dataset.f;
      const errEl = box.querySelector(`[data-ferr="${k}"]`);
      let msg = '';
      if (inp.type === 'email' && inp.value.trim() && !isValidEmail(inp.value)) msg = 'Format email tidak valid.';
      if (inp.type === 'tel' && inp.value.trim() && !isValidPhone(inp.value)) msg = 'Nomor telepon tidak valid.';
      inp.classList.toggle('err', !!msg);
      if (errEl) { errEl.textContent = msg; errEl.classList.toggle('show', !!msg); }
    });
  });

  box.querySelector('#modalSaveBtn').addEventListener('click', () => {
    const newItem = {};
    let ok = true;

    schema.forEach(f => {
      const el = box.querySelector(`[data-f="${f.key}"]`);
      if (!el) { newItem[f.key] = ''; return; }
      let v;
      if (f.type === 'checkbox') v = el.checked;
      else if (f.type === 'range') v = parseInt(el.value, 10) || 0;
      else v = el.value.trim();

      // Validation
      if (f.type === 'email' && v && !isValidEmail(v)) {
        ok = false;
        const errEl = box.querySelector(`[data-ferr="${f.key}"]`);
        if (errEl) { errEl.textContent = 'Format email tidak valid.'; errEl.classList.add('show'); }
        el.classList.add('err');
      }
      if (f.type === 'tel' && v && !isValidPhone(v)) {
        ok = false;
        const errEl = box.querySelector(`[data-ferr="${f.key}"]`);
        if (errEl) { errEl.textContent = 'Nomor telepon tidak valid.'; errEl.classList.add('show'); }
        el.classList.add('err');
      }
      newItem[f.key] = v;
    });

    if (!ok) { toast('Periksa kembali data yang tidak valid', 'err'); return; }

    // Basic required check
    if (key === 'experience' && !newItem.role && !newItem.company) {
      toast('Isi minimal jabatan atau perusahaan', 'warn'); return;
    }
    if ((key === 'hardSkills' || key === 'softSkills' || key === 'techSkills' || key === 'computerSkills' || key === 'languages') && !newItem.name) {
      toast('Nama skill wajib diisi', 'warn'); return;
    }
    if (key === 'certificates' && !newItem.name) {
      toast('Nama sertifikat wajib diisi', 'warn'); return;
    }

    if (isNew) state[key].push(newItem);
    else state[key][index] = newItem;

    save(); renderSidebar(); renderCV(); closeModal();
    toast(isNew ? 'Data ditambahkan' : 'Data diperbarui', 'ok');
  });
}

/* ------------------------------------------------------------------
   12. PHOTO & CROP
------------------------------------------------------------------ */
function onPhotoChosen(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('File harus berupa gambar', 'err'); return; }
  if (file.size > 8 * 1024 * 1024) { toast('Ukuran gambar maksimal 8MB', 'err'); return; }

  const reader = new FileReader();
  reader.onload = ev => {
    state.personal.photo = ev.target.result;
    save(); renderSidebar(); renderCV();
    toast('Foto diunggah — gunakan Crop untuk menyesuaikan', 'ok');
    // open crop automatically
    setTimeout(openCropModal, 260);
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

let crop = { img: null, zoom: 1, ox: 0, oy: 0, base: 1, dragging: false, sx: 0, sy: 0, src: '' };

function cropStageSize() {
  return document.getElementById('cropStage').clientWidth || 300;
}

// Hitung skala dasar dari ukuran kotak crop yang SEBENARNYA (260px di HP, 300px di desktop)
function cropRecalcBase() {
  if (!crop.img) return;
  const stage = cropStageSize();
  crop.base = Math.max(stage / crop.img.naturalWidth, stage / crop.img.naturalHeight);
}

// Jaga agar foto selalu menutupi seluruh kotak (tidak ada area kosong)
function cropClamp() {
  const stage = cropStageSize();
  const s = crop.base * crop.zoom;
  const maxX = Math.max(0, (crop.img.naturalWidth * s - stage) / 2);
  const maxY = Math.max(0, (crop.img.naturalHeight * s - stage) / 2);
  crop.ox = Math.min(maxX, Math.max(-maxX, crop.ox));
  crop.oy = Math.min(maxY, Math.max(-maxY, crop.oy));
}

function openCropModal() {
  if (!state.personal.photo) { toast('Upload foto terlebih dahulu', 'warn'); return; }
  const img = new Image();
  img.onload = () => {
    crop.img = img;
    crop.src = state.personal.photo;
    crop.zoom = 1;
    crop.ox = 0;
    crop.oy = 0;
    document.getElementById('cropZoom').value = 100;
    document.getElementById('cropZoomVal').textContent = '100%';
    // Tampilkan modal DULU supaya ukuran kotak crop bisa diukur
    document.getElementById('cropModal').classList.add('show');
    cropRecalcBase();
    updateCropView();
  };
  img.onerror = () => toast('Gagal memuat gambar', 'err');
  img.src = state.personal.photo;
}

function updateCropView() {
  const el = document.getElementById('cropImg');
  if (!el || !crop.img) return;
  // FIX: sumber gambar sebelumnya tidak pernah di-set sehingga kotak crop tampil hitam
  if (el.getAttribute('src') !== crop.src) el.src = crop.src;
  cropClamp();
  const s = crop.base * crop.zoom;
  el.style.maxWidth = 'none';
  el.style.width = crop.img.naturalWidth * s + 'px';
  el.style.height = crop.img.naturalHeight * s + 'px';
  el.style.left = `calc(50% + ${crop.ox}px)`;
  el.style.top = `calc(50% + ${crop.oy}px)`;
  el.style.transform = 'translate(-50%, -50%)';
}

function setupCropEvents() {
  const stage = document.getElementById('cropStage');
  const zoomInput = document.getElementById('cropZoom');
  const zoomVal = document.getElementById('cropZoomVal');

  zoomInput.addEventListener('input', () => {
    crop.zoom = parseInt(zoomInput.value, 10) / 100;
    zoomVal.textContent = zoomInput.value + '%';
    updateCropView();
  });

  const startDrag = (x, y) => {
    crop.dragging = true;
    crop.sx = x - crop.ox;
    crop.sy = y - crop.oy;
  };
  const moveDrag = (x, y) => {
    if (!crop.dragging) return;
    crop.ox = x - crop.sx;
    crop.oy = y - crop.sy;
    updateCropView();
  };
  const endDrag = () => { crop.dragging = false; };

  stage.addEventListener('pointerdown', e => {
    if (!crop.img) return;
    stage.setPointerCapture(e.pointerId);
    startDrag(e.clientX, e.clientY);
    e.preventDefault();
  });
  stage.addEventListener('pointermove', e => {
    moveDrag(e.clientX, e.clientY);
  });
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  window.addEventListener('resize', () => {
    if (!crop.img || !document.getElementById('cropModal').classList.contains('show')) return;
    cropRecalcBase();
    updateCropView();
  });

  document.querySelectorAll('[data-crop-close]').forEach(b => {
    b.addEventListener('click', () => document.getElementById('cropModal').classList.remove('show'));
  });

  document.getElementById('cropApply').addEventListener('click', () => {
    if (!crop.img) return;
    const out = 520;
    cropClamp();
    const stageSize = cropStageSize();
    const k = out / stageSize;
    const cv = document.createElement('canvas');
    cv.width = out; cv.height = out;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, out, out);
    ctx.translate(out / 2, out / 2);
    ctx.translate(crop.ox * k, crop.oy * k);
    const s = crop.base * crop.zoom;
    ctx.scale(s * k, s * k);
    ctx.drawImage(crop.img, -crop.img.naturalWidth / 2, -crop.img.naturalHeight / 2);
    try {
      state.personal.photo = cv.toDataURL('image/jpeg', 0.9);
      save(); renderSidebar(); renderCV();
      document.getElementById('cropModal').classList.remove('show');
      toast('Foto berhasil disesuaikan', 'ok');
    } catch (err) {
      toast('Gagal memproses foto', 'err');
    }
  });
}

/* ------------------------------------------------------------------
   13. DRAG & DROP SECTION ORDER
------------------------------------------------------------------ */
function setupDragOrder(list) {
  let dragEl = null;
  list.querySelectorAll('.order-item').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragEl = el;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', el.dataset.sec); } catch (_) {}
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      list.querySelectorAll('.order-item').forEach(x => x.classList.remove('drag-over'));
      dragEl = null;
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      if (!dragEl || dragEl === el) return;
      el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', e => {
      e.preventDefault();
      el.classList.remove('drag-over');
      if (!dragEl || dragEl === el) return;
      const items = [...list.querySelectorAll('.order-item')];
      const from = items.indexOf(dragEl);
      const to = items.indexOf(el);
      if (from < 0 || to < 0) return;

      const order = state.settings.sectionOrder.slice();
      const [moved] = order.splice(from, 1);
      order.splice(to, 0, moved);
      state.settings.sectionOrder = order;
      save(); renderCV();
      // re-render order list only
      renderSidebar();
    });
  });
}

/* ------------------------------------------------------------------
   14. THEME
------------------------------------------------------------------ */
function setTheme(t) {
  state.settings.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  document.body.setAttribute('data-theme', t);
  const iconEl = document.getElementById('iconTheme');
  const label = document.querySelector('#btnTheme span');
  if (t === 'dark') {
    iconEl.innerHTML = ICON_PATHS.sun;
    if (label) label.textContent = 'Light';
  } else {
    iconEl.innerHTML = ICON_PATHS.moon;
    if (label) label.textContent = 'Dark';
  }
  save();
  // Re-render sidebar if in design tab to update active state
  if (activeTab === 'design') renderSidebar();
}

/* ------------------------------------------------------------------
   15. PRINT
------------------------------------------------------------------ */
function doPrint() {
  // Validate email/phone
  const issues = [];
  if (state.personal.email && !isValidEmail(state.personal.email)) issues.push('Email tidak valid');
  if (state.personal.phone && !isValidPhone(state.personal.phone)) issues.push('Nomor telepon tidak valid');

  if (issues.length) {
    toast(issues.join(' · ') + ' — perbaiki sebelum mencetak', 'warn', 3500);
  }

  renderCV();
  // Ensure preview scale is neutral during print (CSS handles it)
  const page = document.getElementById('cvPage');
  page.style.transform = 'none';
  setTimeout(() => {
    window.print();
    setTimeout(fitPreview, 400);
  }, 120);
}

/* ------------------------------------------------------------------
   16. BACKUP / RESTORE
------------------------------------------------------------------ */
function exportBackup() {
  try {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const name = (state.personal.fullName || 'cv').replace(/[^\w\-]+/g, '_').toLowerCase();
    a.href = url;
    a.download = `procv-backup-${name}-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast('Backup berhasil diunduh', 'ok');
  } catch (e) {
    toast('Gagal membuat backup', 'err');
  }
}

function importBackup(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data || typeof data !== 'object' || !data.personal) throw new Error('Invalid');
      confirmDialog('Import Backup',
        'Data saat ini akan <b>ditimpa</b> dengan isi file backup. Lanjutkan?',
        'Import', () => {
          state = mergeState(defaultState(), data);
          save();
          applyAllSettings();
          renderSidebar();
          renderCV();
          toast('Backup berhasil diimpor', 'ok');
        }, false);
    } catch (err) {
      toast('File backup tidak valid', 'err');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

async function restoreLast() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) { toast('Tidak ada sesi tersimpan di LocalStorage', 'warn'); return; }
    const data = JSON.parse(raw);
    if (!data || !data.personal) throw new Error();
    confirmDialog('Pulihkan Sesi Terakhir',
      'Muat ulang data dari LocalStorage (tanpa foto jika melebihi kuota)?',
      'Pulihkan', () => {
        state = mergeState(defaultState(), data);
        save();
        applyAllSettings();
        renderSidebar();
        renderCV();
        toast('Sesi dipulihkan', 'ok');
      }, false);
  } catch (e) {
    toast('Gagal memulihkan sesi', 'err');
  }
}

async function doReset() {
  try { await idbDel('state'); } catch (e) {}
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  state = defaultState();
  save();
  applyAllSettings();
  renderSidebar();
  renderCV();
  toast('Seluruh data telah direset', 'ok');
}

/* ------------------------------------------------------------------
   17. APPLY SETTINGS TO APP
------------------------------------------------------------------ */
function applyAllSettings() {
  const s = state.settings;
  document.documentElement.setAttribute('data-theme', s.theme || 'light');
  document.body.setAttribute('data-theme', s.theme || 'light');
  const iconEl = document.getElementById('iconTheme');
  const label = document.querySelector('#btnTheme span');
  if (iconEl && label) {
    if (s.theme === 'dark') {
      iconEl.innerHTML = ICON_PATHS.sun;
      label.textContent = 'Light';
    } else {
      iconEl.innerHTML = ICON_PATHS.moon;
      label.textContent = 'Dark';
    }
  }
}

/* ------------------------------------------------------------------
   18. EVENT WIRING (GLOBAL)
------------------------------------------------------------------ */
function bindGlobalEvents() {
  // Mode segment
  document.getElementById('modeSeg').addEventListener('click', e => {
    const btn = e.target.closest('[data-mode]');
    if (!btn) return;
    const mode = btn.dataset.mode;
    document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('active', b === btn));
    document.body.classList.toggle('mode-preview', mode === 'preview');
    document.body.classList.toggle('mode-edit', mode === 'edit');
    if (mode === 'preview') setTimeout(fitPreview, 60);
    else setTimeout(fitPreview, 60);
  });

  // Theme button
  document.getElementById('btnTheme').addEventListener('click', () => {
    setTheme(state.settings.theme === 'dark' ? 'light' : 'dark');
  });

  // Print buttons
  document.getElementById('btnPrint').addEventListener('click', doPrint);
  document.getElementById('btnPrint2').addEventListener('click', doPrint);

  // Backup quick
  document.getElementById('btnBackupQuick').addEventListener('click', exportBackup);

  // Zoom
  document.getElementById('btnZoomIn').addEventListener('click', () => {
    userZoom = Math.min(2, userZoom + 0.1);
    fitPreview();
  });
  document.getElementById('btnZoomOut').addEventListener('click', () => {
    userZoom = Math.max(0.3, userZoom - 0.1);
    fitPreview();
  });
  document.getElementById('btnZoomFit').addEventListener('click', () => {
    userZoom = 1;
    fitPreview();
  });

  // Tab strip
  document.getElementById('tabStrip').addEventListener('click', e => {
    const btn = e.target.closest('[data-tab]');
    if (!btn) return;
    activeTab = btn.dataset.tab;
    renderSidebar();
  });

  // Mobile nav
  document.querySelector('.mobile-nav').addEventListener('click', e => {
    const btn = e.target.closest('[data-mnav]');
    if (!btn) return;
    const v = btn.dataset.mnav;
    document.querySelectorAll('.mobile-nav button').forEach(b => b.classList.toggle('active', b === btn));
    if (v === 'preview') {
      document.body.classList.add('mode-preview');
      document.body.classList.remove('mode-edit');
      document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('active', b.dataset.mode === 'preview'));
      setTimeout(fitPreview, 60);
    } else {
      document.body.classList.remove('mode-preview');
      document.body.classList.add('mode-edit');
      document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('active', b.dataset.mode === 'edit'));
      activeTab = v;
      renderSidebar();
    }
  });

  // Back to top
  const btt = document.getElementById('backToTop');
  window.addEventListener('scroll', () => {
    btt.classList.toggle('show', window.scrollY > 300);
  }, { passive: true });
  btt.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  // Modal close delegation
  document.getElementById('modalWrap').addEventListener('click', e => {
    if (e.target.closest('[data-modal-close]')) closeModal();
    if (e.target.id === 'modalWrap') closeModal();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeModal();
      document.getElementById('cropModal').classList.remove('show');
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
      // let browser handle print naturally (we don't prevent)
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      save();
      toast('Data disimpan', 'ok');
    }
  });

  // Resize
  let rt = null;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(fitPreview, 120);
  });

  // Before print: re-render
  window.addEventListener('beforeprint', () => {
    renderCV();
  });
  window.addEventListener('afterprint', () => {
    setTimeout(fitPreview, 200);
  });
}

/* ------------------------------------------------------------------
   19. INIT
------------------------------------------------------------------ */
async function init() {
  try {
    await loadState();
    applyAllSettings();
    renderSidebar();
    renderCV();
    bindGlobalEvents();
    setupCropEvents();
    setStatus('Tersimpan');
    setTimeout(fitPreview, 100);
    setTimeout(fitPreview, 500);
  } catch (e) {
    console.error(e);
    toast('Terjadi kesalahan saat memuat aplikasi', 'err', 5000);
  } finally {
    const loader = document.getElementById('loader');
    setTimeout(() => {
      loader.classList.add('hide');
      setTimeout(() => loader.remove(), 500);
    }, 350);
  }
}

document.addEventListener('DOMContentLoaded', init);

// Handle images load affecting page height
window.addEventListener('load', () => setTimeout(fitPreview, 150));
</script>
