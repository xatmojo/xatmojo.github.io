<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Card Studio | Simulasi</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- jsPDF for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-app: #F3F4F6;
            --bg-panel: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --danger: #EF4444;
            --success: #10B981;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            z-index: 10;
        }
        
        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--text-main);
        }

        /* Main Layout */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 65px);
        }

        /* Sidebar / Form Panel */
        .sidebar {
            width: 400px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            flex-shrink: 0;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }

        /* Preview Panel */
        .preview-area {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            background: radial-gradient(circle at center, #E2E8F0 0%, var(--bg-app) 100%);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.875rem;
            transition: all 0.2s ease;
            background: #F9FAFB;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            background: #FFF;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid var(--border);
            margin-top: 0.5rem;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            gap: 0.5rem;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .btn-outline:hover { background: #F9FAFB; border-color: #D1D5DB; }

        .btn-danger {
            background: #FEE2E2;
            color: var(--danger);
        }
        .btn-danger:hover { background: #FECACA; }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .action-grid .btn {
            width: 100%;
        }

        /* Canvas Container */
        .canvas-container {
            width: 100%;
            max-width: 850px;
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            background: #fff;
            aspect-ratio: 1.585; /* Standard ID card ratio */
            margin-bottom: 2rem;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* File Upload Area */
        .upload-area {
            border: 2px dashed #CBD5E1;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #F8FAFC;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: #EEF2FF;
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .photo-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 1rem;
            display: none; /* Hidden until photo uploaded */
        }
        
        .slider-group {
            margin-top: 0.5rem;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 0.25rem;
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #1E293B;
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-size: 0.875rem;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .app-container {
                flex-direction: column;
                height: auto;
                overflow: visible;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                height: auto;
                overflow: visible;
            }
            .preview-area {
                padding: 1rem;
                min-height: 500px;
            }
            .canvas-container {
                width: 95%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            Identity Card <span>Studio</span>
        </div>
        <div style="font-size: 0.75rem; color: var(--danger); font-weight: 600; border: 1px solid var(--danger); padding: 4px 8px; border-radius: 4px;">
            MODE SIMULASI
        </div>
    </header>

    <div class="app-container">
        <!-- Form Sidebar -->
        <aside class="sidebar">
            <div>
                <div class="section-title">Informasi Utama</div>
                <div class="form-group">
                    <label>Provinsi (Header 1)</label>
                    <input type="text" id="in-provinsi" class="form-control" value="PROVINSI DKI JAKARTA" oninput="updateState('provinsi', this.value)">
                </div>
                <div class="form-group">
                    <label>Kabupaten/Kota (Header 2)</label>
                    <input type="text" id="in-kabupaten" class="form-control" value="JAKARTA BARAT" oninput="updateState('kabupaten', this.value)">
                </div>
                <div class="form-group">
                    <label>NIK (Simulasi)</label>
                    <input type="text" id="in-nik" class="form-control" value="3171234567890123" maxlength="16" oninput="updateState('nik', this.value)">
                </div>
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="in-nama" class="form-control" value="MIRA SETIAWAN" oninput="updateState('nama', this.value)">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tempat Lahir</label>
                        <input type="text" id="in-tempat" class="form-control" value="JAKARTA" oninput="updateState('tempatLahir', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Tanggal Lahir</label>
                        <input type="text" id="in-tgl" class="form-control" value="18-02-1986" oninput="updateState('tanggalLahir', this.value)">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Jenis Kelamin</label>
                        <select id="in-jk" class="form-control" onchange="updateState('jenisKelamin', this.value)">
                            <option value="LAKI-LAKI">LAKI-LAKI</option>
                            <option value="PEREMPUAN" selected>PEREMPUAN</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Gol. Darah</label>
                        <input type="text" id="in-goldar" class="form-control" value="B" oninput="updateState('golDarah', this.value)">
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">Alamat</div>
                <div class="form-group">
                    <label>Alamat</label>
                    <input type="text" id="in-alamat" class="form-control" value="JL. PASTI CEPAT A7/66" oninput="updateState('alamat', this.value)">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>RT</label>
                        <input type="text" id="in-rt" class="form-control" value="007" oninput="updateState('rt', this.value)">
                    </div>
                    <div class="form-group">
                        <label>RW</label>
                        <input type="text" id="in-rw" class="form-control" value="008" oninput="updateState('rw', this.value)">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Kel/Desa</label>
                        <input type="text" id="in-kel" class="form-control" value="PEGADUNGAN" oninput="updateState('kelDesa', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Kecamatan</label>
                        <input type="text" id="in-kec" class="form-control" value="KALIDERES" oninput="updateState('kecamatan', this.value)">
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">Lainnya</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Agama</label>
                        <input type="text" id="in-agama" class="form-control" value="ISLAM" oninput="updateState('agama', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Status Kawin</label>
                        <input type="text" id="in-status" class="form-control" value="KAWIN" oninput="updateState('status', this.value)">
                    </div>
                </div>
                <div class="form-group">
                    <label>Pekerjaan</label>
                    <input type="text" id="in-pekerjaan" class="form-control" value="PEGAWAI SWASTA" oninput="updateState('pekerjaan', this.value)">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Kewarganegaraan</label>
                        <input type="text" id="in-warga" class="form-control" value="WNI" oninput="updateState('kewarganegaraan', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Berlaku Hingga</label>
                        <input type="text" id="in-berlaku" class="form-control" value="22-02-2017" oninput="updateState('berlaku', this.value)">
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">Foto & Desain</div>
                <!-- Photo Upload -->
                <div class="upload-area" id="drop-zone" onclick="document.getElementById('file-input').click()">
                    <input type="file" id="file-input" accept="image/jpeg, image/png, image/webp">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px; color: var(--primary);"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <p style="font-size: 0.875rem; font-weight: 500;">Klik atau Drop Foto di Sini</p>
                    <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">JPG, PNG, WEBP (Max 2MB)</p>
                </div>

                <div class="photo-controls" id="photo-controls">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Zoom Foto</label>
                        <input type="range" id="photo-zoom" min="0.5" max="3" step="0.1" value="1" oninput="updatePhotoTransform()">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Geser X</label>
                        <input type="range" id="photo-x" min="-100" max="100" step="1" value="0" oninput="updatePhotoTransform()">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Geser Y</label>
                        <input type="range" id="photo-y" min="-100" max="100" step="1" value="0" oninput="updatePhotoTransform()">
                    </div>
                    <button class="btn btn-outline" onclick="removePhoto()" style="height: 100%;">Hapus Foto</button>
                </div>

                <div class="form-group" style="margin-top: 1rem;">
                    <label>Warna Tema Latar</label>
                    <select id="theme-color" class="form-control" onchange="updateState('theme', this.value); renderCard();">
                        <option value="#D6EAF8">Biru Muda (Default)</option>
                        <option value="#E8F8F5">Hijau Mint</option>
                        <option value="#FEF9E7">Kuning Lembut</option>
                        <option value="#FADBD8">Merah Muda</option>
                        <option value="#EBF5FB">Biru Sangat Muda</option>
                    </select>
                </div>
            </div>

            <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border);">
                <div class="action-grid">
                    <button class="btn btn-outline" onclick="saveDraft()">Simpan Draft</button>
                    <button class="btn btn-outline" onclick="loadDraft()">Muat Draft</button>
                    <button class="btn btn-primary" onclick="exportImage('png')">Download PNG</button>
                    <button class="btn btn-primary" onclick="exportImage('jpg')">Download JPG</button>
                    <button class="btn btn-outline" onclick="exportPDF()" style="grid-column: span 2;">Export PDF</button>
                </div>
                <button class="btn btn-danger" onclick="resetForm()" style="width: 100%;">Reset Form</button>
            </div>
        </aside>

        <!-- Canvas Preview Area -->
        <main class="preview-area">
            <div class="canvas-container">
                <canvas id="id-card-canvas" width="1000" height="630"></canvas>
            </div>
            <p style="color: var(--text-muted); font-size: 0.875rem; text-align: center; max-width: 600px;">
                <strong>Catatan Keamanan:</strong> Aplikasi ini hanya untuk simulasi. Gambar yang dihasilkan dilengkapi dengan watermark permanen dan tidak dapat digunakan sebagai dokumen resmi.
            </p>
        </main>
    </div>

    <div id="toast-container"></div>

    <script>
        // --- State Management ---
        const state = {
            provinsi: 'PROVINSI DKI JAKARTA',
            kabupaten: 'JAKARTA BARAT',
            nik: '3171234567890123',
            nama: 'MIRA SETIAWAN',
            tempatLahir: 'JAKARTA',
            tanggalLahir: '18-02-1986',
            jenisKelamin: 'PEREMPUAN',
            golDarah: 'B',
            alamat: 'JL. PASTI CEPAT A7/66',
            rt: '007',
            rw: '008',
            kelDesa: 'PEGADUNGAN',
            kecamatan: 'KALIDERES',
            agama: 'ISLAM',
            status: 'KAWIN',
            pekerjaan: 'PEGAWAI SWASTA',
            kewarganegaraan: 'WNI',
            berlaku: '22-02-2017',
            theme: '#D6EAF8'
        };

        let photoImage = null;
        let photoTransform = { zoom: 1, x: 0, y: 0 };
        
        const canvas = document.getElementById('id-card-canvas');
        const ctx = canvas.getContext('2d');

        // --- Core Functions ---

        function updateState(key, value) {
            state[key] = value;
            renderCard();
        }

        // Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    ${type === 'success' ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>' : '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>'}
                </svg>
                ${message}
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Canvas Rendering ---

        function renderCard() {
            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Background Base
            ctx.fillStyle = state.theme;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Draw Decorative Background Elements (Subtle Waves/Lines)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 100 + (i * 60));
                ctx.bezierCurveTo(300, 50 + (i * 60), 700, 200 + (i * 60), 1000, 100 + (i * 60));
                ctx.stroke();
            }

            // 3. Draw Headers
            ctx.fillStyle = '#111827';
            ctx.textAlign = 'center';
            
            ctx.font = 'bold 32px Inter, sans-serif';
            ctx.fillText(state.provinsi, 500, 60);
            
            ctx.font = 'bold 28px Inter, sans-serif';
            ctx.fillText(state.kabupaten, 500, 100);

            // 4. Draw Text Fields (Left Side)
            const startXLabel = 60;
            const startXValue = 260;
            let startY = 160;
            const lineHeight = 32;

            ctx.textAlign = 'left';
            ctx.fillStyle = '#111827';

            // NIK (Special formatting)
            ctx.font = 'bold 24px Inter, sans-serif';
            ctx.fillText('NIK', startXLabel, startY);
            ctx.fillText(':', 230, startY);
            ctx.fillText(state.nik, startXValue, startY);
            startY += lineHeight + 8;

            // Standard Fields
            ctx.font = '16px Inter, sans-serif';
            
            const drawField = (label, value, y) => {
                ctx.fillText(label, startXLabel, y);
                ctx.fillText(':', 230, y);
                ctx.fillText(value, startXValue, y);
            };

            drawField('Nama', state.nama, startY);
            drawField('Tempat/Tgl Lahir', `${state.tempatLahir}, ${state.tanggalLahir}`, startY + lineHeight);
            drawField('Jenis Kelamin', state.jenisKelamin, startY + lineHeight * 2);
            
            // Gol Darah (Right aligned of gender)
            ctx.fillText('Gol. Darah : ' + state.golDarah, 550, startY + lineHeight * 2);
            
            drawField('Alamat', state.alamat, startY + lineHeight * 3);
            
            // Address indentation
            const addrIndent = startXValue;
            ctx.fillText(`RT/RW      : ${state.rt}/${state.rw}`, addrIndent, startY + lineHeight * 4);
            ctx.fillText(`Kel/Desa   : ${state.kelDesa}`, addrIndent, startY + lineHeight * 5);
            ctx.fillText(`Kecamatan  : ${state.kecamatan}`, addrIndent, startY + lineHeight * 6);
            
            drawField('Agama', state.agama, startY + lineHeight * 7);
            drawField('Status Perkawinan', state.status, startY + lineHeight * 8);
            drawField('Pekerjaan', state.pekerjaan, startY + lineHeight * 9);
            drawField('Kewarganegaraan', state.kewarganegaraan, startY + lineHeight * 10);
            drawField('Berlaku Hingga', state.berlaku, startY + lineHeight * 11);

            // 5. Draw Photo Area
            const photoX = 680;
            const photoY = 150;
            const photoW = 230;
            const photoH = 320;

            // Photo Background (Red)
            ctx.fillStyle = '#991B1B';
            ctx.fillRect(photoX, photoY, photoW, photoH);

            if (photoImage) {
                ctx.save();
                // Clip to photo box
                ctx.beginPath();
                ctx.rect(photoX, photoY, photoW, photoH);
                ctx.clip();

                // Calculate aspect ratio and center image with transforms
                const imgAspect = photoImage.width / photoImage.height;
                const boxAspect = photoW / photoH;
                
                let drawW = photoW;
                let drawH = photoH;

                if (imgAspect > boxAspect) {
                    drawW = photoH * imgAspect;
                } else {
                    drawH = photoW / imgAspect;
                }

                // Apply zoom & pan
                drawW *= photoTransform.zoom;
                drawH *= photoTransform.zoom;

                const offsetX = (photoW - drawW) / 2 + photoTransform.x;
                const offsetY = (photoH - drawH) / 2 + photoTransform.y;

                ctx.drawImage(photoImage, photoX + offsetX, photoY + offsetY, drawW, drawH);
                ctx.restore();
            } else {
                // Placeholder text if no photo
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.textAlign = 'center';
                ctx.font = '16px Inter, sans-serif';
                ctx.fillText('FOTO 3x4', photoX + photoW/2, photoY + photoH/2);
            }

            // Photo Border
            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 2;
            ctx.strokeRect(photoX, photoY, photoW, photoH);

            // Photo Footer Text
            ctx.fillStyle = '#111827';
            ctx.textAlign = 'center';
            ctx.font = 'bold 14px Inter, sans-serif';
            ctx.fillText(state.kabupaten, photoX + photoW/2, photoY + photoH + 30);
            ctx.font = '12px Inter, sans-serif';
            ctx.fillText('02-12-2012', photoX + photoW/2, photoY + photoH + 50);

            // Fake Signature (Stylized curve)
            ctx.beginPath();
            ctx.moveTo(photoX + 50, photoY + photoH + 80);
            ctx.bezierCurveTo(photoX + 80, photoY + photoH + 40, photoX + 120, photoY + photoH + 100, photoX + 150, photoY + photoH + 60);
            ctx.bezierCurveTo(photoX + 170, photoY + photoH + 40, photoX + 180, photoY + photoH + 80, photoX + 190, photoY + photoH + 70);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#111827';
            ctx.stroke();

            // 6. Draw Watermark (Permanent)
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(-Math.PI / 6); // Rotate -30 degrees
            
            // Big background watermark
            ctx.fillStyle = 'rgba(239, 68, 68, 0.15)'; // Red with low opacity
            ctx.textAlign = 'center';
            ctx.font = 'bold 90px Inter, sans-serif';
            ctx.fillText('SIMULASI', 0, 0);
            
            ctx.font = 'bold 30px Inter, sans-serif';
            ctx.fillText('BUKAN DOKUMEN RESMI', 0, 50);
            ctx.restore();

            // Foreground watermark border
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
            
            // Foreground text
            ctx.fillStyle = 'rgba(239, 68, 68, 0.8)';
            ctx.font = 'bold 20px Inter, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('SIMULASI - BUKAN DOKUMEN RESMI', canvas.width - 30, canvas.height - 20);
        }

        // --- Photo Handling ---

        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const photoControls = document.getElementById('photo-controls');

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--primary)';
            dropZone.style.background = '#EEF2FF';
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#CBD5E1';
            dropZone.style.background = '#F8FAFC';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#CBD5E1';
            dropZone.style.background = '#F8FAFC';
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            // Validation
            if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
                showToast('Format file tidak didukung. Gunakan JPG, PNG, atau WEBP.', 'error');
                return;
            }
            if (file.size > 2 * 1024 * 1024) { // 2MB limit
                showToast('Ukuran file terlalu besar (Maksimal 2MB).', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    photoImage = img;
                    // Reset transforms
                    photoTransform = { zoom: 1, x: 0, y: 0 };
                    document.getElementById('photo-zoom').value = 1;
                    document.getElementById('photo-x').value = 0;
                    document.getElementById('photo-y').value = 0;
                    
                    photoControls.style.display = 'grid';
                    renderCard();
                    showToast('Foto berhasil diunggah!');
                };
                img.onerror = () => showToast('Gagal memuat gambar.', 'error');
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function updatePhotoTransform() {
            if (!photoImage) return;
            photoTransform.zoom = parseFloat(document.getElementById('photo-zoom').value);
            photoTransform.x = parseInt(document.getElementById('photo-x').value);
            photoTransform.y = parseInt(document.getElementById('photo-y').value);
            renderCard();
        }

        function removePhoto() {
            photoImage = null;
            photoControls.style.display = 'none';
            fileInput.value = '';
            renderCard();
            showToast('Foto dihapus.');
        }

        // --- Export & Utilities ---

        function exportImage(format) {
            try {
                // Create a temporary canvas to add white background if exporting JPG (Canvas defaults to transparent)
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tCtx = tempCanvas.getContext('2d');
                
                if (format === 'jpg') {
                    tCtx.fillStyle = '#FFFFFF';
                    tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                }
                
                tCtx.drawImage(canvas, 0, 0);

                const dataURL = tempCanvas.toDataURL(`image/${format === 'jpg' ? 'jpeg' : 'png'}`, 1.0);
                const link = document.createElement('a');
                link.download = `SIMULASI_ID_CARD_${Date.now()}.${format}`;
                link.href = dataURL;
                link.click();
                showToast(`Berhasil mengunduh ${format.toUpperCase()}`);
            } catch (error) {
                console.error(error);
                showToast('Gagal mengunduh gambar.', 'error');
            }
        }

        function exportPDF() {
            try {
                const { jsPDF } = window.jspdf;
                // ID Card standard size 85.6 x 53.98 mm, but we use a custom landscape format
                const doc = new jsPDF({
                    orientation: 'landscape',
                    unit: 'px',
                    format: [canvas.width, canvas.height]
                });

                const imgData = canvas.toDataURL('image/jpeg', 1.0);
                doc.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
                doc.save(`SIMULASI_ID_CARD_${Date.now()}.pdf`);
                showToast('Berhasil mengekspor PDF.');
            } catch (error) {
                console.error(error);
                showToast('Gagal mengekspor PDF.', 'error');
            }
        }

        // --- Local Storage (Draft) ---

        function saveDraft() {
            try {
                const draft = {
                    state: state,
                    photo: photoImage ? photoImage.src : null,
                    transform: photoTransform
                };
                localStorage.setItem('idCardDraft', JSON.stringify(draft));
                showToast('Draft berhasil disimpan.');
            } catch (e) {
                showToast('Gagal menyimpan draft (Penyimpanan penuh).', 'error');
            }
        }

        function loadDraft() {
            const saved = localStorage.getItem('idCardDraft');
            if (!saved) {
                showToast('Tidak ada draft tersimpan.', 'error');
                return;
            }

            try {
                const draft = JSON.parse(saved);
                
                // Restore State
                Object.keys(draft.state).forEach(key => {
                    state[key] = draft.state[key];
                    // Update DOM inputs
                    const inputMap = {
                        provinsi: 'in-provinsi', kabupaten: 'in-kabupaten', nik: 'in-nik',
                        nama: 'in-nama', tempatLahir: 'in-tempat', tanggalLahir: 'in-tgl',
                        jenisKelamin: 'in-jk', golDarah: 'in-goldar', alamat: 'in-alamat',
                        rt: 'in-rt', rw: 'in-rw', kelDesa: 'in-kel', kecamatan: 'in-kec',
                        agama: 'in-agama', status: 'in-status', pekerjaan: 'in-pekerjaan',
                        kewarganegaraan: 'in-warga', berlaku: 'in-berlaku', theme: 'theme-color'
                    };
                    if (inputMap[key]) {
                        document.getElementById(inputMap[key]).value = draft.state[key];
                    }
                });

                // Restore Photo
                if (draft.photo) {
                    const img = new Image();
                    img.onload = () => {
                        photoImage = img;
                        photoTransform = draft.transform;
                        
                        document.getElementById('photo-zoom').value = photoTransform.zoom;
                        document.getElementById('photo-x').value = photoTransform.x;
                        document.getElementById('photo-y').value = photoTransform.y;
                        photoControls.style.display = 'grid';
                        
                        renderCard();
                    };
                    img.src = draft.photo;
                } else {
                    photoImage = null;
                    photoControls.style.display = 'none';
                    renderCard();
                }

                showToast('Draft berhasil dimuat.');
            } catch (e) {
                showToast('Gagal memuat draft.', 'error');
            }
        }

        function resetForm() {
            if (!confirm('Apakah Anda yakin ingin mereset semua data dan foto?')) return;
            
            // Reset state
            state.provinsi = 'PROVINSI DKI JAKARTA';
            state.kabupaten = 'JAKARTA BARAT';
            state.nik = '3171234567890123';
            state.nama = 'MIRA SETIAWAN';
            // ... (other defaults)
            
            // Hard reload approach for simplicity in resetting DOM
            location.reload();
        }

        // --- Initialization ---
        window.onload = () => {
            renderCard();
        };

        // Prevent default drag behaviors on window
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => e.preventDefault());

    </script>
</body>
</html>
