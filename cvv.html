*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
h1,h2,h3,h4{font-family:'Outfit','Inter',sans-serif;margin:0;line-height:1.25;font-weight:600}
button{font-family:inherit;font-size:inherit}
a{color:inherit}
img{max-width:100%}

.icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:-0.14em}
.icon.fill{fill:currentColor;stroke:none}

/* Preloader */
#preloader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(160deg,var(--navy),color-mix(in srgb,var(--navy) 70%,#000));color:#cbd8e8;transition:opacity .45s ease,visibility .45s}
#preloader.hide{opacity:0;visibility:hidden}
.loader{width:46px;height:46px;border-radius:50%;border:3px solid rgba(var(--accent-rgb),.22);border-top-color:var(--gold);animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#preloader span{font-size:.85rem;letter-spacing:.18em;text-transform:uppercase}

/* App shell */
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--navy) 0%,color-mix(in srgb,var(--navy) 70%,#000) 100%);color:#cfdcec;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 16px;gap:6px;border-right:1px solid rgba(var(--accent-rgb),.16);z-index:120}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px}
.brand-mark{width:42px;height:42px;border-radius:13px;flex:none;background:linear-gradient(140deg,var(--gold),var(--gold-3));display:grid;place-items:center;color:var(--navy);font-size:1.3rem;box-shadow:0 6px 16px rgba(var(--accent-rgb),.32)}
.brand strong{display:block;font-family:'Outfit',sans-serif;font-size:1.02rem;color:#fff;letter-spacing:.02em}
.brand small{display:block;font-size:.7rem;color:#8ba0b8;letter-spacing:.12em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1;padding-right:2px}
.nav::-webkit-scrollbar{width:5px}
.nav::-webkit-scrollbar-thumb{background:rgba(var(--accent-rgb),.35);border-radius:8px}
.nav-link{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:11px;text-decoration:none;font-size:.865rem;font-weight:500;color:#b6c6d9;border-left:3px solid transparent;transition:.22s}
.nav-link .icon{font-size:1.02rem;opacity:.85}
.nav-link:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-link.active{background:linear-gradient(90deg,rgba(var(--accent-rgb),.2),rgba(var(--accent-rgb),.04));color:#fff;border-left-color:var(--gold)}
.nav-link.active .icon{color:var(--gold-2);opacity:1}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.09);padding-top:14px;display:grid;gap:7px}
.sidebar-foot .btn{width:100%;justify-content:flex-start;font-size:.82rem}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;padding:11px 22px;background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);backdrop-filter:blur(8px)}
.topbar-title{font-family:'Outfit',sans-serif;font-weight:600;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.save-indicator{font-size:.72rem;font-weight:600;color:var(--green);display:flex;align-items:center;gap:5px;opacity:0;transition:.3s;letter-spacing:.04em}
.save-indicator.show{opacity:1}
.content{padding:22px;max-width:1180px;width:100%;margin:0 auto;flex:1}
section{scroll-margin-top:82px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:600;font-size:.83rem;cursor:pointer;transition:.2s;white-space:nowrap;line-height:1.2}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn .icon{font-size:1rem}
.btn.primary{background:linear-gradient(135deg,var(--navy-2),var(--navy-3));color:#fff;border-color:transparent}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-3));color:var(--navy);border-color:transparent}
.btn.danger{background:var(--red);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{background:rgba(0,0,0,.05);color:var(--text)}
[data-theme="dark"] .btn.ghost:hover{background:rgba(255,255,255,.07)}
.btn.sm{padding:6px 11px;font-size:.76rem;border-radius:9px}
.btn.sm .icon{font-size:.9rem}

.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;transition:.2s;font-size:1.05rem;flex:none}
.icon-btn:hover{background:var(--card-2);transform:translateY(-1px)}
.icon-btn.sm{width:31px;height:31px;font-size:.85rem;border-radius:9px}
.lang-btn{display:inline-flex !important;width:auto !important;height:38px;padding:0 11px;align-items:center;justify-content:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}

/* Hero */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--navy) 0%,var(--hero-mid) 55%,var(--navy) 100%);border-radius:22px;padding:34px;margin-bottom:20px;display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;box-shadow:var(--shadow)}
.hero::before{content:'';position:absolute;right:-70px;top:-70px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(var(--accent-rgb),.30),transparent 68%);pointer-events:none}
.hero::after{content:'';position:absolute;left:-90px;bottom:-110px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%);pointer-events:none}
.hero-photo-wrap{position:relative;z-index:1}
.hero-photo{width:152px;height:152px;border-radius:50%;overflow:hidden;position:relative;border:3px solid var(--gold);box-shadow:0 0 0 7px rgba(var(--accent-rgb),.14);background:var(--navy-2);display:grid;place-items:center}
.hero-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.hero-photo .photo-empty{font-size:3.2rem;color:#4c6f96}
.photo-edit{position:absolute;right:-2px;bottom:-2px;width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--navy);border:3px solid var(--navy);display:grid;place-items:center;cursor:pointer;font-size:1rem;transition:.2s}
.photo-edit:hover{transform:scale(1.08)}
.hero-text{position:relative;z-index:1;min-width:0}
.hero-eyebrow{font-size:.68rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-2);font-weight:600;margin-bottom:6px}
.hero h1{font-size:clamp(1.5rem,3.4vw,2.35rem);color:#fff;letter-spacing:.01em;word-break:break-word}
.hero-rank{display:inline-flex;align-items:center;gap:8px;margin-top:9px;font-size:.9rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--gold-2)}
.hero-rank::before{content:'';width:26px;height:2px;background:var(--gold);border-radius:2px}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:.775rem;font-weight:500;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);color:#dbe7f4;text-decoration:none;transition:.2s;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.chip:hover{background:rgba(var(--accent-rgb),.22);border-color:rgba(var(--accent-rgb),.5);color:#fff}
.chip .icon{color:var(--gold-2)}

/* Sections */
.section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm);transition:background .3s,border-color .3s}
.section-head{display:flex;align-items:center;gap:13px;margin-bottom:18px;flex-wrap:wrap}
.section-icon{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,color-mix(in srgb,var(--navy) 9%,transparent),rgba(var(--accent-rgb),.16));color:var(--navy-3);font-size:1.15rem}
[data-theme="dark"] .section-icon{background:rgba(var(--accent-rgb),.14);color:var(--gold-2)}
.section-title{min-width:0}
.section-title h2{font-size:.98rem;letter-spacing:.09em;text-transform:uppercase}
.section-title p{margin:2px 0 0;font-size:.78rem;color:var(--muted)}
.section-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px}
.info-item{display:flex;gap:11px;padding:13px 14px;border-radius:var(--radius-sm);background:var(--card-2);border:1px solid var(--border)}
.info-item .ii-icon{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;background:rgba(var(--accent-rgb),.14);color:var(--gold-3);font-size:.95rem}
[data-theme="dark"] .info-item .ii-icon{color:var(--gold-2)}
.info-item .ii-label{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.info-item .ii-value{font-size:.9rem;font-weight:600;word-break:break-word}
.info-item.full{grid-column:1/-1}
.summary-text{font-size:.95rem;line-height:1.85;color:var(--text);white-space:pre-wrap}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:.87rem;border:1.5px dashed var(--border);border-radius:var(--radius-sm);background:var(--card-2)}
.empty .icon{font-size:1.9rem;display:block;margin:0 auto 10px;opacity:.45}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm);-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:collapse;font-size:.86rem;min-width:760px}
table.data th{background:var(--card-2);text-align:left;padding:11px 14px;font-weight:700;font-size:.71rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border)}
table.data td{padding:11px 14px;border-top:1px solid var(--border);vertical-align:top;word-break:break-word}
table.data tbody tr:first-child td{border-top:0}
table.data tbody tr{transition:background .15s}
table.data tbody tr:hover{background:rgba(var(--accent-rgb),.06)}
.cell-actions{display:flex;gap:6px;justify-content:flex-end}
.cell-strong{font-weight:600}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.badge-green{background:rgba(15,157,88,.14);color:#0f9d58}
.badge-amber{background:rgba(217,119,6,.16);color:#b45309}
.badge-red{background:rgba(220,38,38,.14);color:#dc2626}
[data-theme="dark"] .badge-green{color:#3ddc84}
[data-theme="dark"] .badge-amber{color:#fbbf24}
[data-theme="dark"] .badge-red{color:#f87171}
.cd{display:block;font-size:.68rem;color:var(--muted);margin-top:4px}

.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.search-box{position:relative;flex:1;min-width:190px}
.search-box .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.95rem}
.search-box input{width:100%;padding:9px 12px 9px 36px;border-radius:11px;border:1px solid var(--border);background:var(--card-2);color:var(--text);font-size:.83rem;font-family:inherit}
.search-box input:focus{outline:2px solid rgba(var(--accent-rgb),.4);outline-offset:0}
select.mini{padding:9px 12px;border-radius:11px;border:1px solid var(--border);background:var(--card-2);color:var(--text);font-size:.8rem;font-family:inherit;cursor:pointer}

/* Timeline */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,var(--gold),rgba(var(--accent-rgb),.12));border-radius:2px}
.tl-item{position:relative;margin-bottom:16px}
.tl-item:last-child{margin-bottom:0}
.tl-dot{position:absolute;left:-24px;top:16px;width:13px;height:13px;border-radius:50%;background:var(--gold);border:3px solid var(--card);box-shadow:0 0 0 2px rgba(var(--accent-rgb),.35)}
.tl-card{background:var(--card-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px}
.tl-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.tl-head h3{font-size:.98rem}
.tl-company{font-size:.83rem;color:var(--gold);font-weight:600;margin:1px 0 0}
.pill{margin-left:auto;padding:4px 11px;border-radius:999px;font-size:.7rem;font-weight:700;background:color-mix(in srgb,var(--navy) 8%,transparent);color:var(--navy-3);white-space:nowrap}
[data-theme="dark"] .pill{background:rgba(var(--accent-rgb),.16);color:var(--gold-2)}
.tl-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tl-meta span{font-size:.72rem;padding:3px 9px;border-radius:7px;background:var(--card);border:1px solid var(--border);color:var(--muted)}
.tl-desc{margin:11px 0 0;font-size:.85rem;color:var(--muted);white-space:pre-wrap;line-height:1.7}
.tl-actions{display:flex;gap:6px;margin-top:12px;justify-content:flex-end}

/* Contact cards */
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px}
.contact-card{display:flex;align-items:center;gap:13px;padding:16px;border-radius:var(--radius-sm);background:var(--card-2);border:1px solid var(--border);text-decoration:none;color:var(--text);transition:.22s}
a.contact-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:rgba(var(--accent-rgb),.5)}
.cc-icon{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,var(--navy-2),var(--navy-3));color:var(--gold-2);font-size:1.15rem}
.cc-icon.wa{background:linear-gradient(140deg,#128C7E,#25D366);color:#fff}
.cc-icon.mail{background:linear-gradient(140deg,#1b4066,#2a6ba8);color:#fff}
.cc-icon.ig{background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);color:#fff}
.contact-card small{display:block;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.contact-card strong{display:block;font-size:.87rem;word-break:break-word;font-weight:600}

/* Alert */
.alert-banner{display:flex;gap:13px;align-items:flex-start;padding:15px 18px;border-radius:var(--radius-sm);background:rgba(217,119,6,.10);border:1px solid rgba(217,119,6,.35);margin-bottom:20px;font-size:.84rem}
.alert-banner.danger{background:rgba(220,38,38,.09);border-color:rgba(220,38,38,.35)}
.alert-banner .icon{font-size:1.3rem;color:var(--amber);flex:none;margin-top:1px}
.alert-banner.danger .icon{color:var(--red)}
.alert-banner strong{display:block;margin-bottom:3px}
.alert-banner ul{margin:5px 0 0;padding-left:18px}

/* Modal */
#modalRoot{position:fixed;inset:0;z-index:500;display:none}
#modalRoot.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(7,15,25,.62);backdrop-filter:blur(3px);animation:fadeIn .22s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{position:relative;z-index:1;width:min(680px,calc(100% - 28px));max-height:88vh;margin:6vh auto;display:flex;flex-direction:column;background:var(--card);border-radius:20px;border:1px solid var(--border);box-shadow:0 30px 70px rgba(0,0,0,.4);animation:popIn .26s cubic-bezier(.2,.9,.3,1.2);overflow:hidden}
@keyframes popIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:12px;padding:17px 20px;border-bottom:1px solid var(--border);background:var(--card-2);flex:none}
.modal-head h3{font-size:1rem;flex:1}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);background:var(--card-2);flex:none}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:.76rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field label .req{color:var(--red);margin-left:2px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:var(--card-2);color:var(--text);font-family:inherit;font-size:.87rem;transition:.18s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18)}
.field textarea{resize:vertical;min-height:78px;line-height:1.6}
.confirm-msg{font-size:.92rem;line-height:1.75;margin:0}

.photo-editor{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:start}
.photo-preview{width:200px;height:240px;border-radius:16px;overflow:hidden;border:2px solid var(--gold);background:var(--card-2);display:grid;place-items:center;position:relative}
.photo-preview img{width:100%;height:100%;object-fit:cover;display:block}
.photo-controls{display:flex;flex-direction:column;gap:13px}
.upload-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:11px;cursor:pointer;font-weight:700;font-size:.84rem;background:linear-gradient(135deg,var(--navy-2),var(--navy-3));color:#fff}
input[type="range"]{width:100%;-webkit-appearance:none;height:6px;border-radius:6px;background:var(--border);outline:none}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
input[type="range"]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid #fff}

/* Theme picker */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.theme-swatch{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:11px;border:1px solid var(--border);background:var(--card-2);cursor:pointer;transition:.18s;font-family:inherit;font-size:.7rem;color:var(--text)}
.theme-swatch:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.theme-swatch.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(var(--accent-rgb),.35)}
.swatch-circle{width:30px;height:30px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.swatch-label{font-weight:600;letter-spacing:.02em}

/* Toast */
#toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:900;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 30px)}
.toast{display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:12px;background:var(--navy-2);color:#fff;font-size:.83rem;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.3);animation:toastIn .3s cubic-bezier(.2,.9,.3,1.3);transition:opacity .3s,transform .3s}
.toast .icon{font-size:1.05rem;color:#3ddc84}
.toast.err{background:#7f1d1d}
.toast.err .icon{color:#fca5a5}
.toast.info{background:var(--navy-3)}
.toast.info .icon{color:var(--gold-2)}
.toast.out{opacity:0;transform:translateY(12px)}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}

/* Back to top */
.back-top{position:fixed;right:20px;bottom:20px;z-index:200;width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(140deg,var(--gold),var(--gold-3));color:var(--navy);display:grid;place-items:center;font-size:1.15rem;box-shadow:0 10px 24px rgba(var(--accent-rgb),.4);opacity:0;visibility:hidden;transform:translateY(14px);transition:.3s}
.back-top.show{opacity:1;visibility:visible;transform:none}

/* Edit mode */
.edit-only{display:none !important}
body.edit-on .edit-only{display:inline-flex !important}
body.edit-on .edit-only.block{display:flex !important}
body.edit-on #editToggle{background:linear-gradient(135deg,var(--gold),var(--gold-3));color:var(--navy);border-color:transparent}
body:not(.edit-on) .cell-actions,
body:not(.edit-on) .tl-actions{display:none !important}
@media (max-width:760px){body:not(.edit-on) td.col-action{display:none !important}}

.app-foot{text-align:center;padding:22px;font-size:.75rem;color:var(--muted);border-top:1px solid var(--border);letter-spacing:.04em}

/* Responsive */
@media (max-width:1024px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);transition:transform .3s cubic-bezier(.3,.9,.4,1);box-shadow:0 0 50px rgba(0,0,0,.4);height:100vh}
  .sidebar.open{transform:none}
  .sidebar-backdrop{position:fixed;inset:0;background:rgba(7,15,25,.55);z-index:110;opacity:0;visibility:hidden;transition:.3s}
  .sidebar-backdrop.show{opacity:1;visibility:visible}
  .content{padding:16px}
  .hero{padding:26px}
}
@media (max-width:760px){
  .topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px}
  .topbar-title{display:none}
  .save-indicator{display:none}
  .topbar-actions{display:contents}
  #menuBtn{order:1}
  #devBtn{order:2;margin-left:auto;width:38px;height:38px}
  #accentBtn{order:3;width:38px;height:38px}
  #langBtn{order:4;height:38px;padding:0 9px;font-size:.7rem}
  #themeBtn{order:5;width:38px;height:38px}
  .topbar::after{content:'';order:6;flex-basis:100%;height:0}
  #editToggle{order:7;flex:1 1 0;min-width:0}
  .topbar-actions > [data-action="print"]{order:8;flex:1 1 0;min-width:0}
  .topbar-actions > [data-action="reset"]{order:9;flex:1 1 0;min-width:0}
  .topbar-actions .btn{padding:9px 6px;font-size:.74rem;gap:5px;justify-content:center}
  .topbar-actions .btn span{display:inline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center;gap:20px;padding:26px 20px}
  .hero-rank{justify-content:center}
  .hero-chips{justify-content:center}
  .hero-photo{width:128px;height:128px}
  .section{padding:18px}
  .form-grid{grid-template-columns:1fr}
  .photo-editor{grid-template-columns:1fr;justify-items:center}
  .photo-preview{width:170px;height:200px}
  .section-tools{margin-left:0;width:100%}
  .section-head{gap:10px}
  table.data{min-width:0}
  table.data thead{display:none}
  table.data tr{display:block;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;padding:4px;background:var(--card)}
  table.data tbody tr:first-child td{border-top:0}
  table.data td{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border:0;padding:8px 10px;border-bottom:1px dashed var(--border);text-align:right}
  table.data td:last-child{border-bottom:0}
  table.data td::before{content:attr(data-label);font-weight:700;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;flex:none;text-align:left;padding-top:2px}
  table.data td.cell-actions{justify-content:flex-end}
  .timeline{padding-left:20px}
  .tl-dot{left:-19px}
}
@media (max-width:420px){
  .topbar{padding:8px 10px;gap:6px}
  .topbar-actions .btn{padding:8px 5px;font-size:.7rem;gap:4px}
  .topbar-actions .btn .icon{font-size:.85rem}
  #menuBtn,#themeBtn,#devBtn,#accentBtn{width:34px;height:34px}
  #langBtn{height:34px;padding:0 7px;font-size:.66rem}
}

/* =========================================================
   PRINT — tema menembus media print
   ========================================================= */
@media print{
  @page{size:A4 portrait;margin:12mm 11mm 13mm}
  html[data-theme],:root{--bg:#ffffff;--card:#ffffff;--card-2:#ffffff;--text:#0f1c2e;--muted:#4a5a6e;--border:#b9c6d6;--shadow:none;--shadow-sm:none}
  html,body{background:#fff !important;color:#0f1c2e !important;font-size:10pt !important}
  body{line-height:1.45}
  .sidebar,.sidebar-backdrop,.topbar,.back-top,#toasts,#preloader,.no-print,#modalRoot{display:none !important}
  body .edit-only,body.edit-on .edit-only{display:none !important}
  .empty{display:none !important}
  section.is-empty{display:none !important}
  .v-empty{display:none !important}
  .info-item.item-empty{display:none !important}
  .contact-card.is-placeholder{display:none !important}
  table.data th.th-actions{display:none !important}
  table.data td.col-action,table.data td.cell-actions{display:none !important}
  .app{display:block !important}
  .main{display:block !important}
  .content{padding:0 !important;max-width:none !important;margin:0 !important}
  .hero{
    display:grid !important;grid-template-columns:26mm 1fr;gap:6mm;align-items:center;
    background:linear-gradient(135deg,var(--navy) 0%,var(--hero-mid) 55%,var(--navy) 100%) !important;
    color:#fff !important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    border-radius:6px !important;padding:6mm !important;margin:0 0 4mm !important;
    box-shadow:none !important;page-break-inside:avoid;
  }
  .hero::before,.hero::after{display:none !important}
  .hero-photo{width:26mm !important;height:26mm !important;border-width:2px !important;box-shadow:none !important}
  .hero-photo .photo-empty{font-size:2rem}
  .hero h1{font-size:16pt !important;color:#fff !important}
  .hero-rank{font-size:8.5pt !important;color:var(--gold-2) !important;margin-top:1mm !important}
  .hero-eyebrow{font-size:6.5pt !important;margin-bottom:1mm !important;color:var(--gold-2) !important}
  .hero-chips{gap:2mm !important;margin-top:2.5mm !important}
  .chip{font-size:7.2pt !important;padding:1mm 2.4mm !important;background:rgba(255,255,255,.13) !important;border-color:rgba(255,255,255,.25) !important;color:#eaf1f9 !important}
  .photo-edit{display:none !important}
  .section{border:1px solid #c3cede !important;border-radius:4px !important;padding:3.4mm 4mm !important;margin:0 0 3mm !important;box-shadow:none !important;background:#fff !important;break-inside:avoid;page-break-inside:avoid}
  .section-head{margin-bottom:2.4mm !important;gap:2.5mm !important}
  .section-icon{
    width:7mm !important;height:7mm !important;border-radius:2mm !important;
    font-size:9pt !important;
    background:rgba(var(--accent-rgb),.12) !important;
    color:var(--gold-3) !important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .section-title h2{font-size:9.5pt !important;letter-spacing:.06em !important;color:var(--navy) !important}
  .section-title p{font-size:7pt !important;margin-top:0 !important}
  .info-grid{grid-template-columns:1fr 1fr !important;gap:2mm !important}
  .info-item{padding:2mm 2.6mm !important;border:1px solid #dfe6ee !important;background:#fafcfe !important;border-radius:2mm !important}
  .info-item .ii-icon{display:none !important}
  .info-item .ii-label{font-size:6.5pt !important}
  .info-item .ii-value{font-size:8.3pt !important}
  .summary-text{font-size:8.8pt !important;line-height:1.6 !important}
  .table-wrap{overflow:visible !important;border:1px solid #c3cede !important;border-radius:3px !important}
  table.data{min-width:0 !important;width:100% !important;font-size:7.6pt !important}
  table.data thead{display:table-header-group !important}
  table.data tr{display:table-row !important;border:0 !important;margin:0 !important;padding:0 !important;background:transparent !important}
  table.data th{display:table-cell !important;padding:1.6mm 2mm !important;font-size:6.6pt !important;background:#eef2f8 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;border-bottom:1px solid #b9c6d6 !important;color:#33455c !important}
  table.data td{display:table-cell !important;padding:1.6mm 2mm !important;border-bottom:1px solid #dde5ef !important;border-top:0 !important;text-align:left !important}
  table.data td::before{display:none !important}
  table.data tbody tr{page-break-inside:avoid}
  .badge{font-size:6.4pt !important;padding:.6mm 1.8mm !important;border:1px solid currentColor !important;background:transparent !important}
  .cd{font-size:6pt !important;margin-top:.4mm !important}
  .timeline{padding-left:5mm !important}
  .timeline::before{width:1px !important;left:1.2mm !important;background:var(--gold) !important}
  .tl-dot{left:-5mm !important;width:2.6mm !important;height:2.6mm !important;border-width:1px !important;background:var(--gold) !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tl-card{background:#fafcfe !important;border:1px solid #dfe6ee !important;padding:2.4mm 3mm !important;border-radius:2mm !important;page-break-inside:avoid}
  .tl-head h3{font-size:8.8pt !important}
  .tl-company{font-size:8pt !important;color:var(--gold-3) !important}
  .pill{font-size:6.6pt !important;padding:.6mm 2mm !important;background:#eef2f8 !important;color:var(--navy) !important;border:1px solid #cfdae7 !important}
  .tl-meta span{font-size:6.6pt !important;padding:.5mm 1.6mm !important;background:#fff !important;border:1px solid #dfe6ee !important}
  .tl-desc{font-size:7.6pt !important;line-height:1.5 !important;margin-top:1.5mm !important}
  .tl-actions{display:none !important}
  .tl-item{margin-bottom:2.5mm !important}
  .contact-grid{grid-template-columns:1fr 1fr !important;gap:2mm !important}
  .contact-card{padding:2.4mm 3mm !important;background:#fafcfe !important;border:1px solid #dfe6ee !important;border-radius:2mm !important}
  .cc-icon{width:8mm !important;height:8mm !important;border-radius:2mm !important;font-size:9pt !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ---------- 4. TANGGAL ---------- */
function isoToDMY(iso){if(!iso)return '';const m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(iso);}
function dmyToISO(dmy){if(!dmy)return '';const m=String(dmy).trim().match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);if(!m)return null;const d=+m[1],mo=+m[2],y=+m[3];if(mo<1||mo>12||d<1||d>31)return null;const dt=new Date(y,mo-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function fmtDate(v){if(!v)return '—';const d=new Date(String(v).length===10?v+'T00:00:00':v);if(isNaN(d.getTime()))return '—';const M=UI.lang==='en'?MONTHS_EN:MONTHS_ID;return `${String(d.getDate()).padStart(2,'0')} ${M[d.getMonth()]} ${d.getFullYear()}`;}
function daysLeft(exp){if(!exp)return null;const d=new Date(exp+'T00:00:00');if(isNaN(d.getTime()))return null;const today=new Date();today.setHours(0,0,0,0);return Math.round((d-today)/DAY);}
function certStatus(c){const d=daysLeft(c.expiryDate);if(d===null)return null;if(d<0)return{key:'expired',label:t('status_expired'),cls:'badge-red',days:d};if(d<=90)return{key:'soon',label:t('status_soon'),cls:'badge-amber',days:d};return{key:'active',label:t('status_active'),cls:'badge-green',days:d};}
function statusCell(item){const s=certStatus(item);if(!s)return DASH;const extra=s.days<0?t('status_days_ago').replace('{n}',Math.abs(s.days)):t('status_days_left').replace('{n}',s.days);return `<span class="badge ${s.cls}">${s.label}</span><small class="cd">${extra}</small>`;}
function durationDays(a,b){if(!a||!b)return null;const d1=new Date(a+'T00:00:00'),d2=new Date(b+'T00:00:00');if(isNaN(d1)||isNaN(d2)||d2<d1)return null;return Math.round((d2-d1)/DAY)+1;}
function durationLabel(a,b){const d=durationDays(a,b);if(d===null)return '—';const m=Math.round(d/30.44*10)/10;return UI.lang==='en'?`${m} months · ${d} days`:`${m} bulan · ${d} hari`;}
function waNumber(p){if(!p)return '';let n=String(p).replace(/[^\d+]/g,'').replace(/^\+/,'');if(n.startsWith('0'))n='62'+n.slice(1);if(n.startsWith('620'))n='62'+n.slice(3);return n;}

const DASH = '<span class="v-empty">—</span>';
function tv(v){const s=String(v??'').trim();return(!s||s==='—')?DASH:esc(s);}
function tvDate(v){if(!v)return DASH;const f=fmtDate(v);return f==='—'?DASH:esc(f);}
function tvDur(a,b){const d=durationDays(a,b);return d===null?DASH:esc(durationLabel(a,b));}

let modalSaveHandler=null;
function openModal({title,bodyHTML,saveLabel='Save',onSave=null,danger=false,cancelLabel=null}){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="modal-backdrop" data-close></div><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn sm" data-close title="${esc(t('modal_close'))}">${icon('x')}</button></div><div class="modal-body">${bodyHTML}</div><div class="modal-foot"><button class="btn ghost" data-close>${esc(cancelLabel||t('btn_cancel'))}</button>${onSave?`<button class="btn ${danger?'danger':'primary'}" id="modalSave">${icon('save')}${esc(saveLabel)}</button>`:''}</div></div>`;
  root.classList.add('open');
  document.body.style.overflow='hidden';
  root.querySelectorAll('[data-close]').forEach(b=>{b.onclick=closeModal;});
  modalSaveHandler=onSave;
  const btn=root.querySelector('#modalSave');
  if(btn)btn.onclick=()=>{if(modalSaveHandler&&modalSaveHandler()===false)return;closeModal();};
  root.onkeydown=e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'&&btn){e.preventDefault();btn.click();}};
  setTimeout(()=>{const first=root.querySelector('.modal-body input:not([type=range]):not([type=file]):not([type=color]), .modal-body select, .modal-body textarea');if(first)first.focus();},90);
}
function closeModal(){const root=$('#modalRoot');root.classList.remove('open');root.innerHTML='';root.onkeydown=null;modalSaveHandler=null;document.body.style.overflow='';}

/* ---------- 9. FORM BUILDER ---------- */
function fieldHTML(f,value){
  const id='fld_'+f.key;
  const v=value==null?'':value;
  const label=t(f.labelKey);
  const ph=f.phKey?t(f.phKey):(f.ph||'');
  let input;
  if(f.type==='textarea'){
    input=`<textarea id="${id}" name="${esc(f.key)}" rows="${f.rows||3}" placeholder="${esc(ph)}">${esc(v)}</textarea>`;
  } else if(f.type==='select'){
    const opts=(f.options||[]).map(o=>{const val=o.v!==undefined?o.v:o;const lbl=o.l?t(o.l):o;return `<option value="${esc(val)}"${String(val)===String(v)?' selected':''}>${esc(lbl)}</option>`;}).join('');
    input=`<select id="${id}" name="${esc(f.key)}">${opts}</select>`;
  } else if(f.type==='date'){
    input=`<input id="${id}" name="${esc(f.key)}" type="text" inputmode="numeric" value="${esc(isoToDMY(v))}" placeholder="dd/mm/yyyy" maxlength="10" ${f.required?'required':''} autocomplete="off" data-date-input="1">`;
  } else {
    input=`<input id="${id}" name="${esc(f.key)}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(ph)}"${f.min?` min="${esc(f.min)}"`:''}${f.max?` max="${esc(f.max)}"`:''}${f.step?` step="${esc(f.step)}"`:''}${f.required?' required':''} autocomplete="off">`;
  }
  return `<div class="field ${f.full?'full':''}"><label for="${id}">${esc(label)}${f.required?'<span class="req">*</span>':''}</label>${input}</div>`;
}

function openFormModal(title,fields,values,onSubmit,opts={}){
  const html=`<form id="modalForm" class="form-grid" novalidate autocomplete="off">${fields.map(f=>fieldHTML(f,values[f.key])).join('')}</form>`;
  openModal({
    title,bodyHTML:html,saveLabel:opts.saveLabel||t('btn_save'),
    onSave:()=>{
      const form=$('#modalForm');
      if(!form)return false;
      const data={};
      for(const f of fields){
        const elm=form.elements[f.key];
        const raw=elm?String(elm.value).trim():'';
        const label=t(f.labelKey);
        if(f.type==='date'){
          if(!raw){ if(f.required){toast(t('toast_required').replace('{label}',label),'err');if(elm)elm.focus();return false;} data[f.key]=''; continue; }
          const iso=dmyToISO(raw);
          if(iso===null){toast(t('toast_date_invalid').replace('{label}',label),'err');if(elm)elm.focus();return false;}
          data[f.key]=iso; continue;
        }
        data[f.key]=raw;
        if(f.required&&!raw){toast(t('toast_required').replace('{label}',label),'err');if(elm)elm.focus();return false;}
        if(f.type==='email'&&raw&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(raw)){toast(t('toast_email_invalid'),'err');if(elm)elm.focus();return false;}
        if(f.type==='tel'&&raw&&!/^[0-9+\-\s()]{7,20}$/.test(raw)){toast(t('toast_phone_invalid'),'err');if(elm)elm.focus();return false;}
      }
      onSubmit(data);
      return true;
    }
  });
}

  $('#contact').innerHTML=sectionHead('phone',t('sec_contact_title'),t('sec_contact_sub'),`<button class="btn sm primary edit-only" data-action="edit-profile">${icon('edit')} ${esc(t('btn_edit'))}</button>`)+`<div class="contact-grid">${cards.join('')}</div>`;
}

/* ---------- 21. EMPTY STATES ---------- */
function updateEmptyStates(){
  const p=DATA.profile;
  $('#summary').classList.toggle('is-empty',!p.summary);
  $('#documents').classList.toggle('is-empty',!DATA.documents.length);
  $('#coc').classList.toggle('is-empty',!DATA.certificates.filter(c=>c.category==='coc').length);
  $('#cop').classList.toggle('is-empty',!DATA.certificates.filter(c=>c.category==='cop').length);
  $('#other').classList.toggle('is-empty',!DATA.certificates.filter(c=>c.category==='other').length);
  $('#sea').classList.toggle('is-empty',!DATA.seaService.length);
  $('#work').classList.toggle('is-empty',!DATA.workExperience.length);
  const personalEmpty=!p.birthPlace&&!p.birthDate&&!p.gender&&!p.religion&&!p.height&&!p.weight&&!p.maritalStatus&&!p.nationality&&!p.address;
  $('#personal').classList.toggle('is-empty',personalEmpty);
  const contactEmpty=!p.phone&&!p.email&&!p.address;
  $('#contact').classList.toggle('is-empty',contactEmpty);
}

/* ---------- 22. APPLY (theme/lang/edit) ---------- */
function applyEditMode(){
  document.body.classList.toggle('edit-on',!!UI.edit);
  const btn=$('#editToggle');
  if(btn)btn.innerHTML=UI.edit?icon('eye')+' <span>'+esc(t('btn_preview_mode'))+'</span>':icon('edit')+' <span>'+esc(t('btn_edit_mode'))+'</span>';
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme',UI.theme||'light');
  document.documentElement.setAttribute('data-accent',UI.accent||'navy');
  const btn=$('#themeBtn');
  if(btn)btn.innerHTML=UI.theme==='dark'?icon('sun'):icon('moon');
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',UI.theme==='dark'?'#070f19':'#0b1f3a');
}
function applyLang(){
  document.documentElement.lang=UI.lang||'id';
  const lbl=$('#langLabel');
  if(lbl)lbl.textContent=(UI.lang||'id').toUpperCase();
  $$('[data-i18n-key]').forEach(el=>{const k=el.dataset.i18nKey;if(I18N[k])el.textContent=t(k);});
  $$('[data-i18n-title]').forEach(el=>{const k=el.dataset.i18nTitle;if(I18N[k])el.title=t(k);});
  applyEditMode();
}

function renderAll(){
  renderHero();renderAlerts();renderPersonal();renderSummary();renderDocuments();
  renderCertSection('coc');renderCertSection('cop');renderCertSection('other');
  renderSeaService();renderWork();renderContact();updateEmptyStates();
  applyEditMode();applyTheme();
}

/* ---------- 23. CRUD HANDLERS ---------- */
function openProfileModal(){
  openFormModal(t('modal_edit_profile'),PROFILE_FIELDS,DATA.profile,data=>{
    DATA.profile=Object.assign(DATA.profile,data);save();renderAll();
    toast(t('toast_profile_updated'),'ok');
  });
}
function openDocModal(id){
  const existing=id?DATA.documents.find(d=>d.id===id):null;
  openFormModal(existing?t('modal_edit_doc'):t('modal_add_doc'),DOC_FIELDS,existing||{type:'Buku Pelaut'},data=>{
    if(existing){Object.assign(existing,data);toast(t('toast_doc_updated'),'ok');}
    else{DATA.documents.push(Object.assign({id:uid()},data));toast(t('toast_doc_added'),'ok');}
    save();renderAll();
  });
}
function openCertModal(cat,id){
  const existing=id?DATA.certificates.find(c=>c.id===id):null;
  openFormModal(existing?t('modal_edit_cert'):t('modal_add_cert'),CERT_FIELDS,existing||{},data=>{
    if(existing){Object.assign(existing,data);toast(t('toast_cert_updated'),'ok');}
    else{DATA.certificates.push(Object.assign({id:uid(),category:cat},data));toast(t('toast_cert_added'),'ok');}
    save();renderAll();
  });
}
function openSeaModal(id){
  const existing=id?DATA.seaService.find(s=>s.id===id):null;
  openFormModal(existing?t('modal_edit_sea'):t('modal_add_sea'),SEA_FIELDS,existing||{},data=>{
    if(existing){Object.assign(existing,data);toast(t('toast_sea_updated'),'ok');}
    else{DATA.seaService.push(Object.assign({id:uid()},data));toast(t('toast_sea_added'),'ok');}
    save();renderAll();
  });
}
function openWorkModal(id){
  const existing=id?DATA.workExperience.find(w=>w.id===id):null;
  openFormModal(existing?t('modal_edit_work'):t('modal_add_work'),WORK_FIELDS,existing||{},data=>{
    if(existing){Object.assign(existing,data);toast(t('toast_work_updated'),'ok');}
    else{DATA.workExperience.push(Object.assign({id:uid()},data));toast(t('toast_work_added'),'ok');}
    save();renderAll();
  });
}
function deleteItem(kind,id,label){
  confirmModal(t('modal_delete_title'),t('modal_delete_msg').replace('{x}',label),()=>{
    if(kind==='doc')DATA.documents=DATA.documents.filter(x=>x.id!==id);
    else if(kind==='cert')DATA.certificates=DATA.certificates.filter(x=>x.id!==id);
    else if(kind==='sea')DATA.seaService=DATA.seaService.filter(x=>x.id!==id);
    else if(kind==='work')DATA.workExperience=DATA.workExperience.filter(x=>x.id!==id);
    save();renderAll();toast(t('toast_deleted'),'ok');
  });
}

/* ---------- 24. PHOTO EDITOR ---------- */
let photoTmp={data:'',zoom:1,x:50,y:50};
function openPhotoModal(){
  const p=DATA.profile;
  photoTmp={data:p.photo||'',zoom:p.photoZoom||1,x:p.photoX||50,y:p.photoY||50};
  const previewHTML=photoTmp.data?`<img id="photoPreviewImg" src="${photoTmp.data}" style="object-position:${photoTmp.x}% ${photoTmp.y}%;transform:scale(${photoTmp.zoom})">`:`<div class="photo-empty">${icon('user')}</div>`;
  const bodyHTML=`
    <div class="photo-editor">
      <div class="photo-preview" id="photoPreview">${previewHTML}</div>
      <div class="photo-controls">
        <p style="font-size:.82rem;color:var(--muted);margin:0">${esc(t('photo_hint'))}</p>
        <label class="upload-btn" for="photoInput">${icon('upload')} ${esc(t('photo_choose'))}</label>
        <div class="field"><label>${esc(t('photo_zoom'))}</label><input type="range" id="photoZoomRange" min="1" max="3" step="0.05" value="${photoTmp.zoom}"></div>
        <div class="field"><label>${esc(t('photo_x'))}</label><input type="range" id="photoXRange" min="0" max="100" step="1" value="${photoTmp.x}"></div>
        <div class="field"><label>${esc(t('photo_y'))}</label><input type="range" id="photoYRange" min="0" max="100" step="1" value="${photoTmp.y}"></div>
        <button type="button" class="btn danger sm" id="photoRemoveBtn">${icon('trash')} ${esc(t('photo_remove'))}</button>
      </div>
    </div>`;
  openModal({title:t('photo_title'),bodyHTML,saveLabel:t('photo_use'),onSave:()=>{
    DATA.profile.photo=photoTmp.data;
    DATA.profile.photoZoom=photoTmp.zoom;
    DATA.profile.photoX=photoTmp.x;
    DATA.profile.photoY=photoTmp.y;
    save();renderAll();toast(t('photo_updated'),'ok');
  }});
  const img=$('#photoPreviewImg');
  const updatePreview=()=>{
    if(!img)return;
    img.style.objectPosition=`${photoTmp.x}% ${photoTmp.y}%`;
    img.style.transform=`scale(${photoTmp.zoom})`;
  };
  $('#photoZoomRange')?.addEventListener('input',e=>{photoTmp.zoom=parseFloat(e.target.value);updatePreview();});
  $('#photoXRange')?.addEventListener('input',e=>{photoTmp.x=parseFloat(e.target.value);updatePreview();});
  $('#photoYRange')?.addEventListener('input',e=>{photoTmp.y=parseFloat(e.target.value);updatePreview();});
  $('#photoRemoveBtn')?.addEventListener('click',()=>{
    photoTmp={data:'',zoom:1,x:50,y:50};
    $('#photoPreview').innerHTML=`<div class="photo-empty">${icon('user')}</div>`;
    toast(t('photo_removed'),'info');
  });
}

function compressImage(dataUrl,maxDim=480,quality=0.85){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      let{w:width,h:height}= {w:img.width,h:img.height};
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){
        if(w>h){h=h*maxDim/w;w=maxDim;}
        else{w=w*maxDim/h;h=maxDim;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>resolve(null);
    img.src=dataUrl;
  });
}

/* ---------- 25. EXPORT / IMPORT ---------- */
function exportData(){
  try{
    const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`seafarer-cv-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(url);
    toast(t('toast_backup_ok'),'ok');
  }catch(e){toast(t('toast_backup_err'),'err');}
}

function importFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      if(!parsed||typeof parsed!=='object')throw new Error('invalid');
      confirmModal(t('modal_import_title'),t('modal_import_msg'),()=>{
        DATA=mergeData(parsed);save();renderAll();toast(t('toast_import_ok'),'ok');
      });
    }catch(err){toast(t('toast_import_invalid'),'err');}
  };
  reader.onerror=()=>toast(t('toast_import_err'),'err');
  reader.readAsText(file);
}

/* ---------- 26. CENTRAL CLICK DELEGATION ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const a=el.dataset.action;
  const id=el.dataset.id;
  switch(a){
    case 'toggle-sidebar':$('#sidebar')?.classList.toggle('open');$('#sidebarBackdrop')?.classList.toggle('show');break;
    case 'dev-info':openDevModal();break;
    case 'toggle-accent':openThemePicker();break;
    case 'toggle-theme':UI.theme=UI.theme==='dark'?'light':'dark';saveUI();applyTheme();toast(t(UI.theme==='dark'?'toast_theme_dark':'toast_theme_light'),'ok');break;
    case 'toggle-lang':UI.lang=UI.lang==='en'?'id':'en';saveUI();applyLang();renderAll();toast(t(UI.lang==='en'?'toast_lang_en':'toast_lang_id'),'info');break;
    case 'toggle-edit':UI.edit=!UI.edit;saveUI();applyEditMode();toast(t(UI.edit?'toast_edit_on':'toast_preview_on'),'ok');break;
    case 'print':toast(t('toast_preparing'),'info');setTimeout(()=>window.print(),250);break;
    case 'back-top':window.scrollTo({top:0,behavior:'smooth'});break;
    case 'export':exportData();break;
    case 'import':$('#importInput')?.click();break;
    case 'reset':confirmModal(t('modal_reset_title'),t('modal_reset_msg'),()=>{DATA=blankData();save();renderAll();toast(t('toast_reset'),'ok');});break;
    case 'photo':openPhotoModal();break;
    case 'edit-profile':openProfileModal();break;
    case 'add-doc':openDocModal();break;
    case 'edit-doc':openDocModal(id);break;
    case 'del-doc':deleteItem('doc',id,el.dataset.label||'document');break;
    case 'add-cert':openCertModal(el.dataset.cat||'coc');break;
    case 'edit-cert':{const c=DATA.certificates.find(x=>x.id===id);if(c)openCertModal(c.category,id);break;}
    case 'del-cert':deleteItem('cert',id,el.dataset.label||'certificate');break;
    case 'add-sea':openSeaModal();break;
    case 'edit-sea':openSeaModal(id);break;
    case 'del-sea':deleteItem('sea',id,el.dataset.label||'vessel');break;
    case 'add-work':openWorkModal();break;
    case 'edit-work':openWorkModal(id);break;
    case 'del-work':deleteItem('work',id,el.dataset.label||'experience');break;
  }
});

/* ---------- 27. FILE INPUTS ---------- */
$('#importInput')?.addEventListener('change',e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value='';});
$('#photoInput')?.addEventListener('change',async e=>{
  const f=e.target.files[0];
  if(!f)return;
  if(!f.type.startsWith('image/')){toast(t('photo_not_image'),'err');e.target.value='';return;}
  const reader=new FileReader();
  reader.onload=async ev=>{
    toast(t('photo_processing'),'info');
    const compressed=await compressImage(ev.target.result);
    if(!compressed){toast(t('photo_read_err'),'err');return;}
    photoTmp.data=compressed;
    const preview=$('#photoPreview');
    if(preview)preview.innerHTML=`<img id="photoPreviewImg" src="${compressed}" style="object-position:${photoTmp.x}% ${photoTmp.y}%;transform:scale(${photoTmp.zoom})">`;
    const img=$('#photoPreviewImg');
    $('#photoZoomRange')?.addEventListener('input',ev=>{photoTmp.zoom=parseFloat(ev.target.value);img.style.transform=`scale(${photoTmp.zoom})`;});
    $('#photoXRange')?.addEventListener('input',ev=>{photoTmp.x=parseFloat(ev.target.value);img.style.objectPosition=`${photoTmp.x}% ${photoTmp.y}%`;});
    $('#photoYRange')?.addEventListener('input',ev=>{photoTmp.y=parseFloat(ev.target.value);img.style.objectPosition=`${photoTmp.x}% ${photoTmp.y}%`;});
    toast(t('photo_ready'),'ok');
  };
  reader.onerror=()=>toast(t('photo_read_err'),'err');
  reader.readAsDataURL(f);
  e.target.value='';
});

/* ---------- 28. SEARCH & SORT ---------- */
document.addEventListener('input',e=>{
  const s=e.target.dataset.search;
  if(!s)return;
  UI.search[s]=e.target.value;
  saveUI();
  const q=e.target.value.toLowerCase();
  $$(`tr[data-text]`).forEach(tr=>{
    if(tr.closest(`#${s}`))tr.style.display=(!q||tr.dataset.text.includes(q))?'':'none';
  });
});
document.addEventListener('change',e=>{
  const s=e.target.dataset.sort;
  if(!s)return;
  UI.sort[s]=e.target.value;
  saveUI();
  if(s==='coc'||s==='cop'||s==='other')renderCertSection(s);
  else if(s==='sea')renderSeaService();
  else if(s==='work')renderWork();
});

/* ---------- 29. SIDEBAR BACKDROP ---------- */
$('#sidebarBackdrop')?.addEventListener('click',()=>{
  $('#sidebar')?.classList.remove('open');
  $('#sidebarBackdrop')?.classList.remove('show');
});

/* ---------- 30. SCROLL SPY ---------- */
const NAV_SECTIONS=['home','personal','summary','documents','coc','cop','other','sea','work','contact'];
let scrollTicking=false;
window.addEventListener('scroll',()=>{
  if(scrollTicking)return;
  scrollTicking=true;
  requestAnimationFrame(()=>{
    let current='home';
    for(const id of NAV_SECTIONS){
      const el=document.getElementById(id);
      if(el&&el.getBoundingClientRect().top<130)current=id;
    }
    $$('.nav-link').forEach(a=>a.classList.toggle('active',a.dataset.nav===current));
    $('#backTop')?.classList.toggle('show',window.scrollY>420);
    scrollTicking=false;
  });
},{passive:true});

/* ---------- 31. INIT ---------- */
function init(){
  applyLang();
  applyTheme();
  renderAll();
  $('#year').textContent=new Date().getFullYear();
  const pre=$('#preloader');
  if(pre)setTimeout(()=>pre.classList.add('hide'),320);
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
} else {
  init();
}
</script>
