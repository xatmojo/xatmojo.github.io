<script>
(function(){
  try{
    var ui = JSON.parse(localStorage.getItem('seafarer_cv_ui_v1') || '{}');
    var theme = ui.theme || 'navy';
    if(theme === 'light') theme = 'navy';
    if(theme === 'dark')  theme = 'midnight';
    var darkThemes = ['midnight','deep-ocean','dark-emerald','dark-crimson'];
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-dark', darkThemes.indexOf(theme) >= 0 ? 'true' : 'false');
  }catch(e){}
})();
</script>

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:var(--fs);line-height:1.6;
  -webkit-font-smoothing:antialiased;transition:background .3s,color .3s;
}
h1,h2,h3,h4{font-family:'Outfit','Inter',sans-serif;margin:0;line-height:1.25;font-weight:600}
button{font-family:inherit;font-size:inherit}
a{color:inherit}
img{max-width:100%}
.icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:-0.14em}
.icon.fill{fill:currentColor;stroke:none}

#preloader{
  position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#cbd8e8;
  transition:opacity .45s ease,visibility .45s;
}
#preloader.hide{opacity:0;visibility:hidden}
.loader{width:46px;height:46px;border-radius:50%;
  border:3px solid rgba(var(--gold-rgb),.22);border-top-color:var(--gold);
  animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#preloader span{font-size:.85rem;letter-spacing:.18em;text-transform:uppercase}

.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}

/* ── SIDEBAR (tanpa brand) ─────────────────────────────── */
.sidebar{
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
  color:#cfdcec;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;padding:22px 16px;gap:6px;
  border-right:1px solid rgba(var(--gold-rgb),.16);z-index:120;
}
.nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1;padding-right:2px;padding-top:6px}
.nav::-webkit-scrollbar{width:5px}
.nav::-webkit-scrollbar-thumb{background:rgba(var(--gold-rgb),.35);border-radius:8px}
.nav-link{
  display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:11px;
  text-decoration:none;font-size:.865rem;font-weight:500;color:#b6c6d9;
  border-left:3px solid transparent;transition:.22s;
}
.nav-link .icon{font-size:1.02rem;opacity:.85}
.nav-link:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-link.active{
  background:linear-gradient(90deg,rgba(var(--gold-rgb),.2),rgba(var(--gold-rgb),.04));
  color:#fff;border-left-color:var(--gold);
}
.nav-link.active .icon{color:var(--gold-2);opacity:1}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.09);padding-top:14px;display:grid;gap:7px}
.sidebar-foot .btn{width:100%;justify-content:flex-start;font-size:.82rem}

.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}

/* ── TOPBAR — hanya pojok kanan atas ───────────────────── */
.topbar{
  position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;
  padding:11px 22px;background:var(--card);border-bottom:1px solid var(--border);
  box-shadow:var(--shadow-sm);backdrop-filter:blur(8px);
  justify-content:flex-end;
}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.save-indicator{font-size:.72rem;font-weight:600;color:var(--green);
  display:flex;align-items:center;gap:5px;opacity:0;transition:.3s;letter-spacing:.04em}
.save-indicator.show{opacity:1}

.content{padding:22px;max-width:1180px;width:100%;margin:0 auto;flex:1}
section{scroll-margin-top:82px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:11px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-weight:600;font-size:.83rem;
  cursor:pointer;transition:.2s;white-space:nowrap;line-height:1.2;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn .icon{font-size:1rem}
.btn.primary{background:linear-gradient(135deg,var(--navy-2),var(--navy-3));color:#fff;border-color:transparent}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--navy);border-color:transparent}
.btn.danger{background:var(--red);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{background:rgba(0,0,0,.05);color:var(--text)}
[data-dark="true"] .btn.ghost:hover{background:rgba(255,255,255,.07)}
.btn.sm{padding:6px 11px;font-size:.76rem;border-radius:9px}
.btn.sm .icon{font-size:.9rem}
.icon-btn{
  display:inline-grid;place-items:center;width:38px;height:38px;
  border-radius:11px;border:1px solid var(--border);background:var(--card);
  color:var(--text);cursor:pointer;transition:.2s;font-size:1.05rem;flex:none;
}
.icon-btn:hover{background:var(--card-2);transform:translateY(-1px)}
.icon-btn.sm{width:31px;height:31px;font-size:.85rem;border-radius:9px}
.lang-btn{
  display:inline-flex !important;width:auto !important;height:38px;padding:0 11px;
  align-items:center;justify-content:center;gap:6px;font-size:.72rem;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
}

.hero{
  position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-3) 55%,var(--navy) 100%);
  border-radius:22px;padding:34px;margin-bottom:20px;
  display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;
  box-shadow:var(--shadow);
}
.hero::before{content:'';position:absolute;right:-70px;top:-70px;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--gold-rgb),.30),transparent 68%);pointer-events:none}
.hero::after{content:'';position:absolute;left:-90px;bottom:-110px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%);pointer-events:none}
.hero-photo-wrap{position:relative;z-index:1}
.hero-photo{
  width:152px;height:152px;border-radius:50%;overflow:hidden;position:relative;
  border:3px solid var(--gold);box-shadow:0 0 0 7px rgba(var(--gold-rgb),.14);
  background:var(--navy-2);display:grid;place-items:center;
}
.hero-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.hero-photo .photo-empty{font-size:3.2rem;color:#4c6f96}
.photo-edit{
  position:absolute;right:-2px;bottom:-2px;width:38px;height:38px;border-radius:50%;
  background:var(--gold);color:var(--navy);border:3px solid var(--navy);
  display:grid;place-items:center;cursor:pointer;font-size:1rem;transition:.2s;
}
.photo-edit:hover{transform:scale(1.08)}
.hero-text{position:relative;z-index:1;min-width:0}
.hero-eyebrow{font-size:.68rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--gold-2);font-weight:600;margin-bottom:6px}
.hero h1{font-size:clamp(1.5rem,3.4vw,2.35rem);color:#fff;letter-spacing:.01em;word-break:break-word}
.hero-rank{display:inline-flex;align-items:center;gap:8px;margin-top:9px;
  font-size:.9rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--gold-2)}
.hero-rank::before{content:'';width:26px;height:2px;background:var(--gold);border-radius:2px}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
  font-size:.775rem;font-weight:500;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.16);color:#dbe7f4;text-decoration:none;
  transition:.2s;max-width:100%;
}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.chip:hover{background:rgba(var(--gold-rgb),.22);border-color:rgba(var(--gold-rgb),.5);color:#fff}
.chip .icon{color:var(--gold-2)}

.section{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm);
  transition:background .3s,border-color .3s;
}
.section-head{display:flex;align-items:center;gap:13px;margin-bottom:18px;flex-wrap:wrap}
.section-icon{
  width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,rgba(var(--navy-rgb),.09),rgba(var(--gold-rgb),.16));
  color:var(--navy-3);font-size:1.15rem;
}
[data-dark="true"] .section-icon{background:rgba(var(--gold-rgb),.14);color:var(--gold-2)}
.section-title{min-width:0}
.section-title h2{font-size:.98rem;letter-spacing:.09em;text-transform:uppercase}
.section-title p{margin:2px 0 0;font-size:.78rem;color:var(--muted)}
.section-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px}
.info-item{
  display:flex;gap:11px;padding:13px 14px;border-radius:var(--radius-sm);
  background:var(--card-2);border:1px solid var(--border);
}
.info-item .ii-icon{
  width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:rgba(var(--gold-rgb),.14);color:var(--gold-dark);font-size:.95rem;
}
[data-dark="true"] .info-item .ii-icon{color:var(--gold-2)}
.info-item .ii-label{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.info-item .ii-value{font-size:.9rem;font-weight:600;word-break:break-word}
.info-item.full{grid-column:1/-1}

.summary-text{font-size:.95rem;line-height:1.85;color:var(--text);white-space:pre-wrap}
.empty{
  padding:34px 18px;text-align:center;color:var(--muted);font-size:.87rem;
  border:1.5px dashed var(--border);border-radius:var(--radius-sm);background:var(--card-2);
}
.empty .icon{font-size:1.9rem;display:block;margin:0 auto 10px;opacity:.45}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm);-webkit-overflow-scrolling:touch}

.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}

.timeline{position:relative;padding-left:26px}

.tl-item{position:relative;margin-bottom:16px}

.tl-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}

.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}

.photo-editor{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:start}

.photo-controls{display:flex;flex-direction:column;gap:13px}

.theme-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

function isoToDMY(iso){
  if(!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : String(iso);
}
function dmyToISO(dmy){
  if(!dmy) return '';
  const m = String(dmy).trim().match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if(!m) return null;
  const d = parseInt(m[1],10), mo = parseInt(m[2],10), y = parseInt(m[3],10);
  if(mo<1||mo>12||d<1||d>31) return null;
  const dt = new Date(y, mo-1, d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d) return null;
  return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function fmtDate(v){
  if(!v) return '—';
  const d = new Date(String(v).length === 10 ? v + 'T00:00:00' : v);
  if(isNaN(d.getTime())) return '—';
  const M = UI.lang === 'en' ? MONTHS_EN : MONTHS_ID;
  return `${String(d.getDate()).padStart(2,'0')} ${M[d.getMonth()]} ${d.getFullYear()}`;
}
function daysLeft(exp){
  if(!exp) return null;
  const d = new Date(exp + 'T00:00:00');
  if(isNaN(d.getTime())) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d - today) / DAY);
}
function certStatus(c){
  const d = daysLeft(c.expiryDate);
  if(d === null) return null;
  if(d < 0)   return { key:'expired', label:t('status_expired'), cls:'badge-red',   days:d };
  if(d <= 90) return { key:'soon',    label:t('status_soon'),    cls:'badge-amber', days:d };
  return           { key:'active',  label:t('status_active'),  cls:'badge-green', days:d };
}
function statusCell(item){
  const s = certStatus(item);
  if(!s) return DASH;
  const extra = s.days < 0
    ? t('status_days_ago').replace('{n}', Math.abs(s.days))
    : t('status_days_left').replace('{n}', s.days);
  return `<span class="badge ${s.cls}">${s.label}</span><small class="cd">${extra}</small>`;
}
function durationDays(a, b){
  if(!a || !b) return null;
  const d1 = new Date(a + 'T00:00:00');
  const d2 = new Date(b + 'T00:00:00');
  if(isNaN(d1) || isNaN(d2) || d2 < d1) return null;
  return Math.round((d2 - d1) / DAY) + 1;
}
function durationLabel(a, b){
  const d = durationDays(a, b);
  if(d === null) return '—';
  const m = Math.round(d / 30.44 * 10) / 10;
  if(UI.lang === 'en') return `${m} months · ${d} days`;
  return `${m} bulan · ${d} hari`;
}
function waNumber(phone){
  if(!phone) return '';
  let n = String(phone).replace(/[^\d+]/g, '').replace(/^\+/, '');
  if(n.startsWith('0')) n = '62' + n.slice(1);
  if(n.startsWith('620')) n = '62' + n.slice(3);
  return n;
}

const DASH = '<span class="v-empty">—</span>';
function tv(v){ const s = String(v ?? '').trim(); return (!s || s === '—') ? DASH : esc(s); }
function tvDate(v){ if(!v) return DASH; const f = fmtDate(v); return f === '—' ? DASH : esc(f); }
function tvDur(a, b){ const d = durationDays(a, b); return d === null ? DASH : esc(durationLabel(a, b)); }

      { id: uid(), type:'MCU',         name:'Medical Check-Up (MCU)',     number:'', issuer:'', issueDate:'', expiryDate:'' }
    ],
    certificates:[],
    seaService:[],
    workExperience:[]
  };
}
function mergeData(saved){
  const base = blankData();
  if(!saved || typeof saved !== 'object') return base;
  base.profile = Object.assign({}, base.profile, saved.profile || {});
  base.documents      = Array.isArray(saved.documents)      ? saved.documents.map(x => Object.assign({ id: uid() }, x))      : base.documents;
  base.certificates   = Array.isArray(saved.certificates)   ? saved.certificates.map(x => Object.assign({ id: uid() }, x))   : [];
  base.seaService     = Array.isArray(saved.seaService)     ? saved.seaService.map(x => Object.assign({ id: uid() }, x))     : [];
  base.workExperience = Array.isArray(saved.workExperience) ? saved.workExperience.map(x => Object.assign({ id: uid() }, x)) : [];
  return base;
}
function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return blankData();
    return mergeData(JSON.parse(raw));
  }catch(e){ console.warn('Load error:', e); return blankData(); }
}
function loadUI(){
  const def = {
    edit:false, theme:'navy', lang:'id',
    search:{ documents:'', coc:'', cop:'', other:'' },
    sort:{ coc:'default', cop:'default', other:'default', sea:'desc', work:'desc' }
  };
  try{
    const raw = localStorage.getItem(UI_KEY);
    if(!raw) return def;
    const s = JSON.parse(raw);
    return Object.assign(def, s, {
      search: Object.assign(def.search, s.search || {}),
      sort:   Object.assign(def.sort,   s.sort   || {})
    });
  }catch(e){ return def; }
}

}

function toast(msg, type = 'ok'){
  const box = $('#toasts');
  const el  = document.createElement('div');
  el.className = 'toast ' + (type === 'ok' ? '' : type);
  const ico = type === 'err' ? 'alert' : type === 'info' ? 'clock' : 'check';
  el.innerHTML = icon(ico) + '<span>' + esc(msg) + '</span>';
  box.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 2900);
}

let modalSaveHandler = null;
function openModal({ title, bodyHTML, saveLabel = 'Save', onSave = null, danger = false, cancelLabel = null }){
  const root = $('#modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" data-close></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3>${esc(title)}</h3>
        <button class="icon-btn sm" data-close title="${esc(t('modal_close'))}">${icon('x')}</button>
      </div>
      <div class="modal-body">${bodyHTML}</div>
      <div class="modal-foot">
        <button class="btn ghost" data-close>${esc(cancelLabel || t('btn_cancel'))}</button>
        ${onSave ? `<button class="btn ${danger ? 'danger' : 'primary'}" id="modalSave">${icon('save')}${esc(saveLabel)}</button>` : ''}
      </div>
    </div>`;
  root.classList.add('open');
  document.body.style.overflow = 'hidden';
  root.querySelectorAll('[data-close]').forEach(b => { b.onclick = closeModal; });
  modalSaveHandler = onSave;
  const btn = root.querySelector('#modalSave');
  if(btn) btn.onclick = () => {
    if(modalSaveHandler && modalSaveHandler() === false) return;
    closeModal();
  };
  root.onkeydown = e => {
    if(e.key === 'Escape') closeModal();
    if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && btn){ e.preventDefault(); btn.click(); }
  };
  setTimeout(() => {
    const first = root.querySelector('.modal-body input:not([type=range]):not([type=file]), .modal-body select, .modal-body textarea');
    if(first) first.focus();
  }, 90);
}
function closeModal(){
  const root = $('#modalRoot');
  root.classList.remove('open');
  root.innerHTML = '';
  root.onkeydown = null;
  modalSaveHandler = null;
  document.body.style.overflow = '';
}
function confirmModal(title, message, onYes){
  openModal({
    title, bodyHTML: `<p class="confirm-msg">${esc(message)}</p>`,
    saveLabel: t('btn_yes_continue'), danger: true,
    onSave: () => { onYes(); }
  });
}

function fieldHTML(f, value){
  const id = 'fld_' + f.key;
  const v  = value == null ? '' : value;
  const label = t(f.labelKey);
  const ph = f.phKey ? t(f.phKey) : (f.ph || '');
  let input;

  if(f.type === 'textarea'){
    input = `<textarea id="${id}" name="${esc(f.key)}" rows="${f.rows || 3}" placeholder="${esc(ph)}">${esc(v)}</textarea>`;
  } else if(f.type === 'select'){
    const opts = (f.options || []).map(o => {
      const val = o.v !== undefined ? o.v : o;
      const lbl = o.l ? t(o.l) : o;
      return `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(lbl)}</option>`;
    }).join('');
    input = `<select id="${id}" name="${esc(f.key)}">${opts}</select>`;
  } else if(f.type === 'date'){
    input = `<input id="${id}" name="${esc(f.key)}" type="text" inputmode="numeric"
             value="${esc(isoToDMY(v))}" placeholder="dd/mm/yyyy" maxlength="10"
             ${f.required ? 'required' : ''} autocomplete="off" data-date-input="1">`;
  } else {
    input = `<input id="${id}" name="${esc(f.key)}" type="${f.type || 'text'}" value="${esc(v)}"
             placeholder="${esc(ph)}"${f.min ? ` min="${esc(f.min)}"` : ''}
             ${f.max ? ` max="${esc(f.max)}"` : ''}${f.step ? ` step="${esc(f.step)}"` : ''}
             ${f.required ? ' required' : ''} autocomplete="off">`;
  }
  return `<div class="field ${f.full ? 'full' : ''}">
            <label for="${id}">${esc(label)}${f.required ? '<span class="req">*</span>' : ''}</label>
            ${input}
          </div>`;
}

function openFormModal(title, fields, values, onSubmit, opts = {}){
  const html = `<form id="modalForm" class="form-grid" novalidate autocomplete="off">
      ${fields.map(f => fieldHTML(f, values[f.key])).join('')}
    </form>`;
  openModal({
    title, bodyHTML: html,
    saveLabel: opts.saveLabel || t('btn_save'),
    onSave: () => {
      const form = $('#modalForm');
      if(!form) return false;
      const data = {};
      for(const f of fields){
        const elm = form.elements[f.key];
        const raw = elm ? String(elm.value).trim() : '';
        const label = t(f.labelKey);

        if(f.type === 'date'){
          if(!raw){
            if(f.required){
              toast(t('toast_required').replace('{label}', label), 'err');
              if(elm) elm.focus();
              return false;
            }
            data[f.key] = '';
            continue;
          }
          const iso = dmyToISO(raw);
          if(iso === null){
            toast(t('toast_date_invalid').replace('{label}', label), 'err');
            if(elm) elm.focus();
            return false;
          }
          data[f.key] = iso;
          continue;
        }

        data[f.key] = raw;

        if(f.required && !raw){
          toast(t('toast_required').replace('{label}', label), 'err');
          if(elm) elm.focus();
          return false;
        }
        if(f.type === 'email' && raw && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(raw)){
          toast(t('toast_email_invalid'), 'err');
          if(elm) elm.focus();
          return false;
        }
        if(f.type === 'tel' && raw && !/^[0-9+\-\s()]{7,20}$/.test(raw)){
          toast(t('toast_phone_invalid'), 'err');
          if(elm) elm.focus();
          return false;
        }
      }
      onSubmit(data);
      return true;
    }
  });
}

function renderAlerts(){
  const zone = $('#alertZone');
  const soon = [], expired = [];
  DATA.certificates.forEach(c => {
    const s = certStatus(c);
    if(!s) return;
    if(s.key === 'expired') expired.push(c);
    else if(s.key === 'soon') soon.push(c);

  if(!soon.length && !expired.length){ zone.innerHTML = ''; return; }

  let html = '';
  if(expired.length){
    html += `<div class="alert-banner danger no-print">
      ${icon('alert')}

function getCerts(cat){
  let list = DATA.certificates.filter(c => c.category === cat);
  const s = UI.sort[cat] || 'default';
  if(s === 'expiry')      list.sort((a,b) => (a.expiryDate || '9999-99-99').localeCompare(b.expiryDate || '9999-99-99'));
  else if(s === 'name')   list.sort((a,b) => (a.name || '').localeCompare(b.name || '', 'id'));
  else if(s === 'issued') list.sort((a,b) => (b.issueDate || '').localeCompare(a.issueDate || ''));
  return list;
}

function applyTheme(){
  if(UI.theme === 'light') UI.theme = 'navy';
  if(UI.theme === 'dark')  UI.theme = 'midnight';
  if(!THEMES_ALL.includes(UI.theme)) UI.theme = 'navy';

  const dark = isDarkTheme(UI.theme);
  document.documentElement.setAttribute('data-theme', UI.theme);
  document.documentElement.setAttribute('data-dark', dark ? 'true' : 'false');

  const btn = $('#themeBtn');
  if(btn) btn.innerHTML = icon('palette');

  const meta = document.querySelector('meta[name=theme-color]');
  if(meta){
    const colors = {
      navy:'#0b1f3a', ocean:'#0c2d48', emerald:'#064e3b', crimson:'#450a0a',
      violet:'#2e1065', graphite:'#1f2937', midnight:'#070f19',

function openPhotoModal(){
  const p = DATA.profile;
  const preview = p.photo
    ? `<img id="photoPrevImg" src="${p.photo}" alt="preview" style="object-position:${p.photoX}% ${p.photoY}%;transform:scale(${p.photoZoom})">`
    : `<div id="photoPrevImg" style="display:grid;place-items:center;width:100%;height:100%;color:var(--muted);font-size:2.5rem;">${icon('user')}</div>`;

  const body = `
    <div class="photo-editor">
      <div class="photo-preview" id="photoPreviewBox">${preview}</div>
      <div class="photo-controls">
        <label class="upload-btn" for="photoFileInput">${icon('upload')} ${esc(t('photo_choose'))}</label>
        <input type="file" id="photoFileInput" accept="image/*" hidden>
        <button class="btn ghost" type="button" id="photoRemoveBtn">${icon('trash')} ${esc(t('photo_remove'))}</button>
        <div>
          <label style="font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">${esc(t('photo_zoom'))}</label>
          <input type="range" id="photoZoom" min="1" max="2.5" step="0.05" value="${p.photoZoom}">
        </div>
        <div>
          <label style="font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">${esc(t('photo_x'))}</label>
          <input type="range" id="photoX" min="0" max="100" step="1" value="${p.photoX}">
        </div>
        <div>
          <label style="font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">${esc(t('photo_y'))}</label>
          <input type="range" id="photoY" min="0" max="100" step="1" value="${p.photoY}">
        </div>
        <p style="font-size:.75rem;color:var(--muted);line-height:1.5;margin:0;">${esc(t('photo_hint'))}</p>
      </div>
    </div>`;

  openModal({
    title: t('photo_title'),
    bodyHTML: body,
    saveLabel: t('photo_use'),
    onSave: () => {
      const img = $('#photoPreviewBox img');
      if(img){
        DATA.profile.photo = img.src;
        DATA.profile.photoZoom = parseFloat($('#photoZoom').value) || 1;
        DATA.profile.photoX = parseInt($('#photoX').value, 10) || 50;
        DATA.profile.photoY = parseInt($('#photoY').value, 10) || 50;
      } else {
        DATA.profile.photo = '';
      }
      save(); renderAll();
      toast(t('photo_updated'));
      return true;
    }
  });

  setTimeout(() => {
    const fileIn = $('#photoFileInput');
    const prevBox = $('#photoPreviewBox');
    const zoom = $('#photoZoom');
    const px = $('#photoX');
    const py = $('#photoY');

    function updateTransform(){
      const img = prevBox.querySelector('img');
      if(!img) return;
      img.style.transform = `scale(${zoom.value})`;
      img.style.objectPosition = `${px.value}% ${py.value}%`;
    }

    if(fileIn){
      fileIn.onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        if(!file.type.startsWith('image/')){ toast(t('photo_not_image'), 'err'); return; }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const srcImg = new Image();
          srcImg.onload = () => {
            const maxDim = 400;
            const ratio = Math.min(maxDim/srcImg.width, maxDim/srcImg.height, 1);
            const w = Math.round(srcImg.width * ratio);
            const h = Math.round(srcImg.height * ratio);
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(srcImg, 0, 0, w, h);
            const compressed = canvas.toDataURL('image/jpeg', 0.85);
            prevBox.innerHTML = `<img src="${compressed}" alt="preview" style="width:100%;height:100%;object-fit:cover;display:block;">`;
            updateTransform();
            toast(t('photo_ready'), 'info');
          };
          srcImg.onerror = () => toast(t('photo_read_err'), 'err');
          srcImg.src = ev.target.result;
        };
        reader.onerror = () => toast(t('photo_file_err'), 'err');
        reader.readAsDataURL(file);
      };
    }
    const removeBtn = $('#photoRemoveBtn');
    if(removeBtn){
      removeBtn.onclick = () => {
        prevBox.innerHTML = `<div style="display:grid;place-items:center;width:100%;height:100%;color:var(--muted);font-size:2.5rem;">${icon('user')}</div>`;
        toast(t('photo_removed'), 'info');
      };
    }
    [zoom, px, py].forEach(el => { if(el) el.oninput = updateTransform; });
  }, 60);
}

function exportJSON(){
  try{
    const blob = new Blob([JSON.stringify(DATA, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cv-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast(t('toast_backup_ok'));
  }catch(e){
    console.error(e);
    toast(t('toast_backup_err'), 'err');
  }
}
function triggerImport(){
  const inp = $('#importInput');
  inp.value = '';
  inp.onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try{
        const parsed = JSON.parse(ev.target.result);
        confirmModal(t('modal_import_title'), t('modal_import_msg'), () => {
          DATA = mergeData(parsed);
          save(); renderAll();
          toast(t('toast_import_ok'));
        });
      }catch(err){
        toast(t('toast_import_invalid'), 'err');
      }
    };
    reader.onerror = () => toast(t('toast_import_err'), 'err');
    reader.readAsText(file);
  };
  inp.click();
}

function doAction(action, el){
  switch(action){
    case 'toggle-sidebar':
      $('#sidebar').classList.toggle('open');
      $('#sidebarBackdrop').classList.toggle('show');
      break;
    case 'toggle-theme':
    case 'theme-picker':
      openThemePicker();
      break;
    case 'toggle-lang':
      UI.lang = UI.lang === 'en' ? 'id' : 'en';
      saveUI();
      applyLang();
      renderAll();
      toast(UI.lang === 'en' ? t('toast_lang_en') : t('toast_lang_id'), 'info');
      break;
    case 'toggle-edit':
      UI.edit = !UI.edit;
      saveUI();
      applyEditMode();
      toast(UI.edit ? t('toast_edit_on') : t('toast_preview_on'), 'info');
      break;
    case 'print':
      window.print();
      break;
    case 'reset':
      resetAll();
      break;
    case 'export':
      exportJSON();
      break;
    case 'import':
      triggerImport();
      break;
    case 'back-top':
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;
    case 'dev-info':
      openDevModal();
      break;
    case 'photo':
      openPhotoModal();
      break;
    case 'edit-profile':
      editProfile();
      break;
    case 'add-doc':
      addDoc();
      break;
    case 'add-cert':
      addCert(el.dataset.cat || 'coc');
      break;
    case 'add-sea':
      addSea();
      break;
    case 'add-work':
      addWork();
      break;
    case 'edit-doc':
      editDoc(el.dataset.id);
      break;
    case 'edit-cert':
      editCert(el.dataset.id);
      break;
    case 'edit-sea':
      editSea(el.dataset.id);
      break;
    case 'edit-work':
      editWork(el.dataset.id);
      break;
    case 'del-doc':
      deleteItem('doc', el.dataset.id, el.dataset.label);
      break;
    case 'del-cert':
      deleteItem('cert', el.dataset.id, el.dataset.label);
      break;
    case 'del-sea':
      deleteItem('sea', el.dataset.id, el.dataset.label);
      break;
    case 'del-work':
      deleteItem('work', el.dataset.id, el.dataset.label);
      break;
  }
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if(btn){ doAction(btn.dataset.action, btn); }
});

document.addEventListener('input', (e) => {
  const search = e.target.closest('[data-search]');
  if(search){
    const cat = search.dataset.search;
    UI.search[cat] = search.value;
    saveUI();
    const section = search.closest('.section');
    const q = search.value.toLowerCase();
    if(section){
      section.querySelectorAll('tbody tr[data-text]').forEach(tr => {
        const txt = tr.dataset.text || '';
        tr.style.display = (!q || txt.includes(q)) ? '' : 'none';
      });
    }
  }
});

document.addEventListener('change', (e) => {
  const sort = e.target.closest('[data-sort]');
  if(sort){
    const cat = sort.dataset.sort;
    UI.sort[cat] = sort.value;
    saveUI();
    if(cat === 'sea')  renderSeaService();
    else if(cat === 'work') renderWork();
    else renderCertSection(cat);
  }
});

$('#sidebarBackdrop').addEventListener('click', () => {
  $('#sidebar').classList.remove('open');
  $('#sidebarBackdrop').classList.remove('show');
});

window.addEventListener('scroll', () => {
  const top = $('#backTop');
  if(window.scrollY > 300) top.classList.add('show');
  else top.classList.remove('show');
  const sections = $$('main section[id]');
  const navLinks = $$('.nav-link');
  let current = '';
  sections.forEach(sec => {
    const rect = sec.getBoundingClientRect();
    if(rect.top <= 120 && rect.bottom > 120) current = sec.id;
  });
  if(current){
    navLinks.forEach(l => l.classList.toggle('active', l.dataset.nav === current));
  }
});

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    $('#sidebar').classList.remove('open');
    $('#sidebarBackdrop').classList.remove('show');
  }
});

function init(){
  applyLang();
  renderAll();
  setTimeout(() => $('#preloader').classList.add('hide'), 500);
}
init();
