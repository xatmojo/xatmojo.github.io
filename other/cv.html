<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Pelaut / Engineer Generator</title>
    <style>
        :root {
            --primary: #1a3c5e;
            --primary-light: #2a5a8a;
            --border: #333;
            --bg-form: #f0f4f8;
            --bg-preview: #e0e0e0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --radius: 8px;
            --font-cv: 'Segoe UI', 'Arial', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== HEADER BAR ===== */
        .top-bar {
            width: 100%;
            background: var(--primary);
            color: #fff;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
        }
        .top-bar h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .top-bar .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-generate {
            background: #fff;
            color: var(--primary);
            border: 2px solid #fff;
        }
        .btn-generate:hover {
            background: var(--primary-light);
            color: #fff;
            border-color: var(--primary-light);
        }
        .btn-print {
            background: #28a745;
            color: #fff;
            border: 2px solid #28a745;
        }
        .btn-print:hover {
            background: #218838;
            border-color: #218838;
        }
        .btn-reset {
            background: transparent;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #fff;
        }

        /* ===== FORM SECTION ===== */
        .form-wrapper {
            width: 100%;
            max-width: 1100px;
            padding: 24px 20px 0;
        }
        .form-section {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 30px;
            margin-bottom: 32px;
            border-left: 4px solid var(--primary);
        }
        .form-section h2 {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-section h2 .icon {
            font-size: 1.3rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #495057;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .form-group input,
        .form-group select {
            padding: 10px 12px;
            border: 1.5px solid #ced4da;
            border-radius: 6px;
            font-size: 0.92rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafbfc;
            width: 100%;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(26, 60, 94, 0.1);
            background: #fff;
        }
        .form-group .hint {
            font-size: 0.7rem;
            color: #888;
            font-style: italic;
        }

        /* ===== CV PREVIEW SECTION ===== */
        .preview-wrapper {
            width: 100%;
            max-width: 1100px;
            padding: 0 20px 40px;
            flex: 1;
        }
        .preview-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .cv-preview {
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
            padding: 50px 55px 40px;
            max-width: 850px;
            margin: 0 auto;
            position: relative;
            font-family: var(--font-cv);
            color: #111;
            line-height: 1.5;
        }

        /* CV Inner Styles */
        .cv-title {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #000;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .cv-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }
        .cv-photo-placeholder {
            position: absolute;
            top: 30px;
            right: 35px;
            width: 105px;
            height: 135px;
            border: 2.5px dashed #888;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #999;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: #fafafa;
        }
        .cv-section-title {
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #000;
            margin: 22px 0 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #333;
        }
        .cv-section-title.first {
            margin-top: 0;
            padding-top: 10px;
            border-top: 2px solid #333;
        }
        .cv-personal-grid {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 4px 12px;
            font-size: 0.88rem;
        }
        .cv-personal-grid .label {
            font-weight: 600;
            color: #333;
        }
        .cv-personal-grid .value {
            color: #111;
        }
        .cv-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            margin: 8px 0 4px;
        }
        .cv-table th,
        .cv-table td {
            border: 1.2px solid #333;
            padding: 8px 10px;
            text-align: left;
            vertical-align: middle;
        }
        .cv-table th {
            background: #f0f2f5;
            font-weight: 700;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #222;
        }
        .cv-table td {
            font-size: 0.82rem;
        }
        .cv-note {
            font-size: 0.78rem;
            color: #444;
            margin-top: 18px;
            padding: 10px 12px;
            background: #f8f9fa;
            border-left: 3px solid var(--primary);
            font-style: italic;
            line-height: 1.6;
        }
        .cv-note a {
            color: var(--primary-light);
            text-decoration: none;
            font-style: normal;
            font-weight: 600;
        }
        .cv-page-number {
            position: absolute;
            bottom: 18px;
            right: 35px;
            font-size: 0.85rem;
            color: #333;
            font-weight: 600;
        }
        .cv-footer-space {
            height: 35px;
        }

        /* ===== PRINT STYLES ===== */
        @media print {
            body {
                background: #fff;
                display: block;
            }
            .top-bar,
            .form-wrapper,
            .preview-label,
            .btn,
            .no-print {
                display: none !important;
            }
            .preview-wrapper {
                max-width: 100%;
                padding: 0;
                margin: 0;
            }
            .cv-preview {
                box-shadow: none;
                border-radius: 0;
                max-width: 100%;
                padding: 30px 25px;
                margin: 0;
                page-break-after: avoid;
            }
            .cv-photo-placeholder {
                right: 20px;
                top: 20px;
            }
            .cv-page-number {
                right: 20px;
                bottom: 12px;
            }
            .cv-table th,
            .cv-table td {
                border-color: #000;
                padding: 6px 8px;
                font-size: 0.75rem;
            }
            .cv-section-title {
                margin-top: 14px;
                font-size: 0.85rem;
            }
            .cv-title {
                font-size: 1.3rem;
            }
            .cv-personal-grid {
                font-size: 0.8rem;
                grid-template-columns: 170px 1fr;
            }
            @page {
                size: A4;
                margin: 15mm 12mm;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .form-section {
                padding: 18px 16px;
            }
            .form-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .cv-preview {
                padding: 30px 20px 50px;
            }
            .cv-photo-placeholder {
                width: 80px;
                height: 100px;
                right: 15px;
                top: 15px;
                font-size: 0.6rem;
                border-width: 2px;
            }
            .cv-title {
                font-size: 1.2rem;
                letter-spacing: 1px;
            }
            .cv-personal-grid {
                grid-template-columns: 140px 1fr;
                font-size: 0.78rem;
            }
            .cv-table {
                font-size: 0.7rem;
            }
            .cv-table th,
            .cv-table td {
                padding: 5px 6px;
                font-size: 0.68rem;
            }
            .top-bar h1 {
                font-size: 1rem;
            }
            .btn {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            .cv-section-title {
                font-size: 0.8rem;
            }
        }
        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .cv-preview {
                padding: 20px 12px 45px;
                overflow-x: auto;
            }
            .cv-photo-placeholder {
                width: 65px;
                height: 85px;
                right: 10px;
                top: 10px;
                font-size: 0.5rem;
            }
            .cv-personal-grid {
                grid-template-columns: 110px 1fr;
                font-size: 0.72rem;
            }
            .cv-table {
                font-size: 0.62rem;
            }
            .cv-table th,
            .cv-table td {
                padding: 4px 4px;
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== TOP BAR ===== -->
    <div class="top-bar">
        <h1>⚓ CV Pelaut / Engineer Generator</h1>
        <div class="actions">
            <button class="btn btn-generate" onclick="generateCV()" title="Generate CV dari data form">
                📄 Generate CV
            </button>
            <button class="btn btn-print" onclick="printCV()" title="Cetak / Simpan sebagai PDF">
                🖨️ Print / PDF
            </button>
            <button class="btn btn-reset" onclick="resetForm()" title="Reset ke data default">
                ↺ Reset
            </button>
        </div>
    </div>

    <!-- ===== FORM SECTION ===== -->
    <div class="form-wrapper no-print">
        <div class="form-section">
            <h2><span class="icon">👤</span> Personal Data</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="f-name" placeholder="Contoh: Ichrom Hadi Nugroho" value="Ichrom Hadi Nugroho">
                </div>
                <div class="form-group">
                    <label>Tempat / Tanggal Lahir</label>
                    <input type="text" id="f-birth" placeholder="Contoh: Purworejo/ 15 December 2001" value="Purworejo/ 15 December 2001">
                </div>
                <div class="form-group">
                    <label>Jenis Kelamin</label>
                    <select id="f-gender">
                        <option value="Male" selected>Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Agama</label>
                    <input type="text" id="f-religion" placeholder="Contoh: Islam" value="Islam">
                </div>
                <div class="form-group">
                    <label>Tinggi / Berat</label>
                    <input type="text" id="f-height-weight" placeholder="Contoh: 168 cm / 60 kg" value="168 cm / 60 kg">
                </div>
                <div class="form-group">
                    <label>Status Pernikahan</label>
                    <select id="f-marital">
                        <option value="Single" selected>Single</option>
                        <option value="Married">Married</option>
                        <option value="Divorced">Divorced</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Alamat Tetap</label>
                    <input type="text" id="f-address" placeholder="Contoh: Kutoarjo, Purworejo, Jawa Tengah" value="Kutoarjo, Purworejo, Jawa Tengah, Indonesia">
                </div>
                <div class="form-group">
                    <label>Kewarganegaraan</label>
                    <input type="text" id="f-nationality" placeholder="Contoh: Indonesian" value="Indonesian">
                </div>
                <div class="form-group">
                    <label>Nomor Telepon</label>
                    <input type="text" id="f-phone" placeholder="Contoh: 081234567890" value="081234567890">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="f-email" placeholder="Contoh: nama@email.com" value="ichromhadi@gmail.com">
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2><span class="icon">📋</span> Document</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Jenis Dokumen</label>
                    <input type="text" id="f-doc-type" placeholder="Contoh: Seaman Book" value="Seaman Book">
                </div>
                <div class="form-group">
                    <label>Nomor Dokumen</label>
                    <input type="text" id="f-doc-number" placeholder="Contoh: F123456" value="F123456">
                </div>
                <div class="form-group">
                    <label>Tempat &amp; Tanggal Dikeluarkan</label>
                    <input type="text" id="f-doc-issue" placeholder="Contoh: Jakarta, 10 January 2020" value="Jakarta, 10 January 2020">
                </div>
                <div class="form-group">
                    <label>Tanggal Kadaluarsa</label>
                    <input type="text" id="f-doc-expiry" placeholder="Contoh: 10 January 2025" value="10 January 2025">
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2><span class="icon">🎓</span> Certificate of Competency</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nama Sertifikat</label>
                    <input type="text" id="f-coc-name" placeholder="Contoh: Rating Engine" value="Rating Engine">
                </div>
                <div class="form-group">
                    <label>Certificate Number I</label>
                    <input type="text" id="f-coc-num1" placeholder="Contoh: 6201234567890123" value="6201234567890123">
                </div>
                <div class="form-group">
                    <label>Certificate Number II</label>
                    <input type="text" id="f-coc-num2" placeholder="Contoh: 6201234567890124" value="6201234567890124">
                </div>
                <div class="form-group">
                    <label>Tempat &amp; Tanggal Dikeluarkan</label>
                    <input type="text" id="f-coc-issue" placeholder="Contoh: Jakarta, 15 March 2020" value="Jakarta, 15 March 2020">
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2><span class="icon">📜</span> Certificate of Proficiency</h2>

            <!-- COP 1 -->
            <div style="margin-bottom:18px; padding:14px; background:#f8f9fa; border-radius:6px; border-left:3px solid #1a3c5e;">
                <p style="font-weight:700; font-size:0.9rem; margin-bottom:10px; color:#1a3c5e;">Sertifikat 1 — BSTCP</p>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nama Sertifikat</label>
                        <input type="text" id="f-cop1-name" placeholder="Contoh: BSTCP" value="BSTCP">
                    </div>
                    <div class="form-group">
                        <label>Serial Number</label>
                        <input type="text" id="f-cop1-serial" placeholder="Contoh: 123456" value="123456">
                    </div>
                    <div class="form-group">
                        <label>Certificate Number</label>
                        <input type="text" id="f-cop1-num" placeholder="Contoh: 6201234567890123" value="6201234567890123">
                    </div>
                    <div class="form-group">
                        <label>Tempat &amp; Tanggal Dikeluarkan</label>
                        <input type="text" id="f-cop1-issue" placeholder="Contoh: Jakarta, 10 January 2020" value="Jakarta, 10 January 2020">
                    </div>
                </div>
            </div>

            <!-- COP 2 -->
            <div style="margin-bottom:18px; padding:14px; background:#f8f9fa; border-radius:6px; border-left:3px solid #1a3c5e;">
                <p style="font-weight:700; font-size:0.9rem; margin-bottom:10px; color:#1a3c5e;">Sertifikat 2 — SATCP</p>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nama Sertifikat</label>
                        <input type="text" id="f-cop2-name" placeholder="Contoh: SATCP" value="SATCP">
                    </div>
                    <div class="form-group">
                        <label>Serial Number</label>
                        <input type="text" id="f-cop2-serial" placeholder="Contoh: 123457" value="123457">
                    </div>
                    <div class="form-group">
                        <label>Certificate Number</label>
                        <input type="text" id="f-cop2-num" placeholder="Contoh: 6201234567890124" value="6201234567890124">
                    </div>
                    <div class="form-group">
                        <label>Tempat &amp; Tanggal Dikeluarkan</label>
                        <input type="text" id="f-cop2-issue" placeholder="Contoh: Jakarta, 12 January 2020" value="Jakarta, 12 January 2020">
                    </div>
                </div>
            </div>

            <!-- COP 3 -->
            <div style="margin-bottom:18px; padding:14px; background:#f8f9fa; border-radius:6px; border-left:3px solid #1a3c5e;">
                <p style="font-weight:700; font-size:0.9rem; margin-bottom:10px; color:#1a3c5e;">Sertifikat 3 — AFFCP</p>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nama Sertifikat</label>
                        <input type="text" id="f-cop3-name" placeholder="Contoh: AFFCP" value="AFFCP">
                    </div>
                    <div class="form-group">
                        <label>Serial Number</label>
                        <input type="text" id="f-cop3-serial" placeholder="Contoh: 123458" value="123458">
                    </div>
                    <div class="form-group">
                        <label>Certificate Number</label>
                        <input type="text" id="f-cop3-num" placeholder="Contoh: 6201234567890125" value="6201234567890125">
                    </div>
                    <div class="form-group">
                        <label>Tempat &amp; Tanggal Dikeluarkan</label>
                        <input type="text" id="f-cop3-issue" placeholder="Contoh: Jakarta, 14 January 2020" value="Jakarta, 14 January 2020">
                    </div>
                </div>
            </div>

            <!-- COP 4 -->
            <div style="margin-bottom:0; padding:14px; background:#f8f9fa; border-radius:6px; border-left:3px solid #1a3c5e;">
                <p style="font-weight:700; font-size:0.9rem; margin-bottom:10px; color:#1a3c5e;">Sertifikat 4 — SDSDCP</p>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nama Sertifikat</label>
                        <input type="text" id="f-cop4-name" placeholder="Contoh: SDSDCP" value="SDSDCP">
                    </div>
                    <div class="form-group">
                        <label>Serial Number</label>
                        <input type="text" id="f-cop4-serial" placeholder="Contoh: 123459" value="123459">
                    </div>
                    <div class="form-group">
                        <label>Certificate Number</label>
                        <input type="text" id="f-cop4-num" placeholder="Contoh: 6201234567890126" value="6201234567890126">
                    </div>
                    <div class="form-group">
                        <label>Tempat &amp; Tanggal Dikeluarkan</label>
                        <input type="text" id="f-cop4-issue" placeholder="Contoh: Jakarta, 16 January 2020" value="Jakarta, 16 January 2020">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== CV PREVIEW SECTION ===== -->
    <div class="preview-wrapper">
        <div class="preview-label">📄 <strong>Preview CV</strong> — Hasil akan tampil di bawah ini</div>
        <div class="cv-preview" id="cv-preview">
            <!-- CV content is populated by JavaScript -->
        </div>
    </div>

    <script>
        function getVal(id) {
            const el = document.getElementById(id);
            return el ? el.value.trim() : '';
        }

        function generateCV() {
            const cv = document.getElementById('cv-preview');

            // Gather all data
            const name = getVal('f-name');
            const birth = getVal('f-birth');
            const gender = getVal('f-gender');
            const religion = getVal('f-religion');
            const heightWeight = getVal('f-height-weight');
            const marital = getVal('f-marital');
            const address = getVal('f-address');
            const nationality = getVal('f-nationality');
            const phone = getVal('f-phone');
            const email = getVal('f-email');

            const docType = getVal('f-doc-type');
            const docNumber = getVal('f-doc-number');
            const docIssue = getVal('f-doc-issue');
            const docExpiry = getVal('f-doc-expiry');

            const cocName = getVal('f-coc-name');
            const cocNum1 = getVal('f-coc-num1');
            const cocNum2 = getVal('f-coc-num2');
            const cocIssue = getVal('f-coc-issue');

            const cop1Name = getVal('f-cop1-name');
            const cop1Serial = getVal('f-cop1-serial');
            const cop1Num = getVal('f-cop1-num');
            const cop1Issue = getVal('f-cop1-issue');

            const cop2Name = getVal('f-cop2-name');
            const cop2Serial = getVal('f-cop2-serial');
            const cop2Num = getVal('f-cop2-num');
            const cop2Issue = getVal('f-cop2-issue');

            const cop3Name = getVal('f-cop3-name');
            const cop3Serial = getVal('f-cop3-serial');
            const cop3Num = getVal('f-cop3-num');
            const cop3Issue = getVal('f-cop3-issue');

            const cop4Name = getVal('f-cop4-name');
            const cop4Serial = getVal('f-cop4-serial');
            const cop4Num = getVal('f-cop4-num');
            const cop4Issue = getVal('f-cop4-issue');

            const cvHTML = `
                <div class="cv-photo-placeholder">
                    <span>PHOTO</span>
                </div>

                <div class="cv-title">CURRICULUM VITAE</div>
                <div class="cv-subtitle">SEAFARER / ENGINEER</div>

                <div class="cv-section-title first">PERSONAL DATA</div>
                <div class="cv-personal-grid">
                    <span class="label">Name</span>
                    <span class="value">: ${name || '—'}</span>
